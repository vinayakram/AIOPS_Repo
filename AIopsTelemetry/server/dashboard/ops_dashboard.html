            <span class="topology-health-pill warn"><span class="status-dot"></span>${esc(`${health.warn || 0} ${state.lang === 'ja' ? '要注意' : 'degraded'}`)}</span>
            <span class="topology-health-pill error"><span class="status-dot"></span>${esc(`${health.error || 0} ${state.lang === 'ja' ? 'エラー' : 'error'}`)}</span>
          </div>
          <div class="topology-workspace">
            <section class="topology-canvas-panel">
              <div class="topology-panel-kicker">${esc(state.lang === 'ja' ? 'ライブ コンポーネント トポロジー' : 'Live component topology')}</div>
              <div class="topology-vm-label">${esc(`${state.lang === 'ja' ? 'VM' : 'VM'}: ${localizeNodeName(map.hostNode || {}, issue) || '--'}`)}</div>
              <div class="topology-canvas-frame">
                <div class="topology-runtime-cluster ${esc(clusterTone)}">
                  <div class="topology-runtime-header ${esc(clusterTone)}">
                    <div>
                      <div class="topology-runtime-title">${esc(appOf(issue) || localizeNodeName(map.symptomNode || {}, issue) || '--')}</div>
                      <div class="topology-runtime-status">${esc(state.lang === 'ja' ? '問題に応じて構成を投影' : 'Projected from the selected issue')}</div>
                    </div>
                    <span class="node-status">${esc(statusLabel(clusterTone))}</span>
                  </div>
                  <div class="topology-runtime-stack">
                    ${map.stackNodes.length ? map.stackNodes.map(node => renderTopologyCanvasNode(node, issue, map)).join('') : `
                      <div class="empty-copy">${esc(state.lang === 'ja' ? '関連コンポーネントがありません。' : 'No related components were projected for this issue.')}</div>
                    `}
                  </div>
                </div>
                <div class="topology-evidence-column">
                  <div class="topology-evidence-head">
                    <div class="topology-evidence-title">${esc(state.lang === 'ja' ? '観測シグナル' : 'Observability signals')}</div>
                    <div class="topology-evidence-copy">${esc(state.lang === 'ja' ? 'Prometheus と Langfuse から関連証拠を表示します。' : 'Related evidence from Prometheus and Langfuse appears here.')}</div>
                  </div>
                  <div class="topology-evidence-grid">
                    ${map.visibleEvidenceNodes.length ? map.visibleEvidenceNodes.map(node => renderTopologyCanvasNode(node, issue, map)).join('') : `
                      <div class="empty-copy">${esc(state.lang === 'ja' ? '監視シグナルはまだありません。' : 'No observability nodes are attached yet.')}</div>
                    `}
                  </div>
                </div>
              </div>
              <div class="topology-impact-ribbon">
                <strong>${esc(state.lang === 'ja' ? '障害経路:' : 'Impact path:')}</strong> ${esc(map.pathSummary)}
              </div>
            </section>
            <aside class="topology-inspector">
              <div class="topology-inspector-head">
                <div class="topology-inspector-title">${esc(localizeNodeName(selectedNode || {}, issue) || '--')}</div>
                <div class="topology-inspector-subtitle">${esc(localizeNodeRole(selectedNode) || nodeSummaryOf(selectedNode))}</div>
              </div>
              <div class="topology-inspector-body">
                <div class="topology-source-row">${renderTopologySourcePills(sourceSignals)}</div>
                <section class="topology-cause-card">
                  <div class="topology-cause-kicker">${esc(state.lang === 'ja' ? '根本原因' : 'Root cause')}</div>
                  <div class="topology-cause-title">${esc(shortenPlainText(topologyCauseOf(topology, analysis, issue), 120))}</div>
                  <div class="topology-cause-copy">${esc(shortenPlainText(nodeSummaryOf(map.rootNode), 220))}</div>
                  ${affectedNodes.length ? `
                    <div class="topology-affects">
                      <span>${esc(state.lang === 'ja' ? '影響先 →' : 'Affects ->')}</span>
                      ${affectedNodes.slice(0, 4).map(node => `<span class="topology-component-flag affected">${esc(localizeNodeName(node, issue))}</span>`).join('')}
                    </div>
                  ` : ``}
                </section>
                <section class="topology-inspector-section">
                  <div class="topology-section-title">${esc(state.lang === 'ja' ? 'Metrics' : 'Metrics')}</div>
                  ${renderInspectorMetrics(selectedNode)}
                </section>
                <section class="topology-inspector-section">
                  <div class="topology-section-title">${esc(state.lang === 'ja' ? 'Evidence logs' : 'Evidence logs')}</div>
                  ${renderInspectorLogs(state.componentLogs)}
                </section>
              </div>
            </aside>
          </div>
        </div>
      `;
    }

    function renderAssistantEntry(entry){
      if(entry.role === 'user'){
        return `

            <div class="assistant-meta"><span>${esc(tr('operator'))}</span><span class="assistant-avatar user">U</span></div>
            <div class="assistant-bubble"><p>${esc(entry.text || '')}</p></div>
          </div>
        `;
      }
      if(entry.mode === 'loading'){
        return `
          <div class="assistant-entry">
            <div class="assistant-meta"><span class="assistant-avatar assistant">助</span><span>${esc(tr('assistant'))}</span></div>
            <div class="assistant-bubble"><p>${esc(tr('assistantThinking'))}</p></div>
          </div>
        `;
      }
      if(entry.mode === 'five'){
        return `
          <div class="assistant-entry">
            <div class="assistant-meta"><span class="assistant-avatar assistant">助</span><span>${esc(tr('assistant'))}</span></div>
            <div class="assistant-bubble">
              <h3>${esc(entry.title || tr('quickFive'))}</h3>
              <ul>${(entry.items || []).map(item => `<li><strong>${esc(item[0])}</strong> ${esc(item[1])}</li>`).join('')}</ul>
            </div>
          </div>
        `;
      }
      if(entry.mode === 'detailed'){
        return `
          <div class="assistant-entry">
            <div class="assistant-meta"><span class="assistant-avatar assistant">助</span><span>${esc(tr('assistant'))}</span></div>
            <div class="assistant-bubble">
              <h3>${esc(entry.title || tr('detailedTitle'))}</h3>
              <p>${esc(entry.cause || '--')}</p>
              <p style="margin-top:10px"><strong>${esc(tr('nextAction'))}</strong> ${esc(entry.action || '--')}</p>
              ${(entry.evidence || []).length ? `<ul>${entry.evidence.map(item => `<li>${esc(item)}</li>`).join('')}</ul>` : ''}
            </div>
          </div>
        `;
      }
      if(entry.mode === 'chat'){
        return `
          <div class="assistant-entry">
            <div class="assistant-meta"><span class="assistant-avatar assistant">助</span><span>${esc(tr('assistant'))}</span></div>
            <div class="assistant-bubble">
              <h3>${esc(entry.title || tr('chatAnswerTitle'))}</h3>
              <p>${esc(entry.text || tr('noIssueSpecificAnswer'))}</p>
              ${(entry.evidence || []).length ? `<ul>${entry.evidence.map(item => `<li>${esc(item)}</li>`).join('')}</ul>` : ''}
            </div>
          </div>
        `;
      }
      return `
        <div class="assistant-entry">
          <div class="assistant-meta"><span class="assistant-avatar assistant">助</span><span>${esc(tr('assistant'))}</span></div>
          <div class="assistant-bubble">
            <h3>${esc(entry.title || tr('summaryTitle'))}</h3>
            <p>${esc(entry.summary || entry.text || '--')}</p>
          </div>
        </div>
      `;
    }

    function renderAssistantModal(){
      const entries = [...state.assistantMessages];
      if(state.assistantLoading) entries.push({role:'assistant', mode:'loading'});
      return `
        <div class="chat-modal-overlay">
          <div class="chat-modal">
            <section class="assistant-modal-shell">
              <div class="assistant-modal-head">
                <div>
                  <h2 class="section-title">${esc(tr('analysisTitle'))}</h2>
                  <p class="section-copy">${esc(tr('analysisCopy'))}</p>
                </div>
                <button class="chat-close" type="button" data-action="close-chat-panel" aria-label="${esc(tr('closeChatPanel'))}" title="${esc(tr('closeChatPanel'))}">×</button>
              </div>
              <div class="assistant-modal-body ${entries.length ? '' : 'empty'}">
                <div class="assistant-stream">
                  ${entries.map(renderAssistantEntry).join('')}
                </div>
              </div>
              <div class="assistant-modal-compose">
                <div class="assistant-compose">
                  <input id="assistant-draft" class="assistant-input" type="text" value="${esc(state.assistantDraft)}" placeholder="${esc(tr('askPlaceholder'))}">
                  <button class="btn primary" type="button" data-assistant-mode="custom">${esc(tr('askButton'))}</button>
                </div>
                <div class="assistant-tools">
                  <button class="assistant-prompt" type="button" data-assistant-mode="summary">${esc(tr('quickSummary'))}</button>
                  <button class="assistant-prompt" type="button" data-assistant-mode="five">${esc(tr('quickFive'))}</button>
                  <button class="assistant-prompt" type="button" data-assistant-mode="detailed">${esc(tr('quickDetailed'))}</button>
                </div>
              </div>
            </section>
          </div>
        </div>
      `;
    }

    function renderRcaPreview(issue, topology, analysis){
      return `
        <section class="section-card">
          <div class="section-head">
            <div>
              <h2 class="section-title">${esc(tr('rcaSummaryTitle'))}</h2>
            </div>
          </div>
          <div class="rca-preview">
            <div class="rca-card">
              <span>${esc(tr('likelyCause'))}</span>
              <strong>${esc(shortenPlainText(topologyCauseOf(topology, analysis, issue), 280))}</strong>
            </div>
            <div class="rca-card">
              <span>${esc(tr('nextAction'))}</span>
              <strong>${esc(topologyActionOf(topology, analysis) || '--')}</strong>
            </div>
            <button class="btn primary chat-launch" type="button" data-action="open-chat-panel">${esc(tr('openChatPanel'))}</button>
          </div>
        </section>
      `;
    }

    function renderIssueDetail(){
      const issue = getSelectedIssue();
      if(!issue){
        return renderEmptyState(tr('noIssueTitle'), tr('noIssueCopy'));
      }
      if(state.loadingDetail || !state.topologyPayload){
        return renderLoadingState(tr('detailLoadingTitle'), tr('detailLoadingCopy'));
      }
      const topology = state.topologyPayload.topology || {};
      const analysis = state.topologyPayload.analysis || {};
      return `
        <div class="detail-stack">
          <section class="detail-header">
            <div>
              <div class="detail-kicker">${esc(tr('detailEyebrow'))}</div>
              <h1 class="detail-title">#${issue.id} ${esc(titleOf(issue))}</h1>
              <div class="chips">
                <span class="chip ${severityBadgeClass(issue.severity)}">${esc(sevText(issue.severity))}</span>
                <span class="chip ${statusBadgeClass(issue.status)}">${esc(statusText(issue.status))}</span>
                <span class="chip primary-point">${esc(`${tr('primaryPoint')}: ${primaryIncidentPointOf(issue)}`)}</span>
                <span class="chip">${esc(`${tr('createdOn')}: ${formatIssueDate(issue.created_at)}`)}</span>
              </div>
            </div>
            <button class="btn subtle" type="button" data-action="back-to-issues">${esc(tr('backToIssues'))}</button>
          </section>

          <section class="section-card">
            <div class="section-head">
              <div>
                <h2 class="section-title">${esc(tr('visualFlowTitle'))}</h2>
                <p class="section-copy">${esc(tr('visualFlowCopy'))}</p>
              </div>
            </div>
            ${renderVisualFlow(topology, issue)}
          </section>

          ${renderRcaPreview(issue, topology, analysis)}
        </div>

        ${state.chatPanelOpen ? renderAssistantModal() : ''}
      `;
    }

    function renderContent(){
      if(state.loadingIssues){
        return renderLoadingState(tr('loadingTitle'), tr('loadingCopy'));
      }
      if(state.currentPage === 'home'){
        return renderHome();
      }
      if(state.currentPage === 'overview'){
        return renderOverview();
      }
      if(state.currentPage === 'issues' && state.selectedIssueId){
        return renderIssueDetail();
      }
      return renderIssuesList();
    }

    function applySidebarState(){
      const shell = document.getElementById('appShell');
      shell.classList.toggle('collapsed', state.sidebarCollapsed);
      localStorage.setItem('opsSidebarCollapsed', state.sidebarCollapsed ? '1' : '0');
    }

    function renderText(){
      document.documentElement.lang = state.lang;
      document.getElementById('brandName').textContent = tr('brand');
      document.getElementById('brandMark').textContent = tr('mark');
      document.getElementById('brandSubtitle').textContent = tr('subtitle');
      document.getElementById('liveText').textContent = tr('live');
      document.getElementById('langBtn').textContent = tr('lang');
    }

    function render(){
      const focusState = captureFocusState();
      renderText();
      applySidebarState();
      renderSidebar();
      document.getElementById('content').innerHTML = renderContent();
      restoreFocusState(focusState);
      syncAssistantScroll();
    }

    function renderIssuesWorkspace(){
      const content = document.getElementById('content');
      if(!content || state.loadingIssues || state.currentPage !== 'issues' || state.selectedIssueId){
        render();
        return;
      }
      const focusState = captureFocusState();
      content.innerHTML = renderIssuesList();
      restoreFocusState(focusState);
      syncAssistantScroll();
    }

    function captureFocusState(){
      const active = document.activeElement;
      if(!active || !active.id) return null;
      if(active.id !== 'issue-search' && active.id !== 'assistant-draft') return null;
      return {
        id: active.id,
        start: typeof active.selectionStart === 'number' ? active.selectionStart : null,
        end: typeof active.selectionEnd === 'number' ? active.selectionEnd : null,
      };
    }

    function restoreFocusState(focusState){
      if(!focusState) return;
      const target = document.getElementById(focusState.id);
      if(!target) return;
      target.focus();
      if(focusState.start != null && focusState.end != null && typeof target.setSelectionRange === 'function'){
        target.setSelectionRange(focusState.start, focusState.end);
      }
    }

    function syncAssistantScroll(){
      if(!state.chatPanelOpen) return;
      requestAnimationFrame(() => {
        const chatBody = document.querySelector('.assistant-modal-body');
        if(chatBody){
          chatBody.scrollTop = chatBody.scrollHeight;
        }
      });
    }

    document.getElementById('sidebarToggle').addEventListener('click', () => {
      state.sidebarCollapsed = !state.sidebarCollapsed;
      applySidebarState();
    });

    document.getElementById('langBtn').addEventListener('click', async () => {
      const preserveDetail = !!state.selectedIssueId;
      state.lang = state.lang === 'ja' ? 'en' : 'ja';
      await loadIssues({preserveDetail});
    });

    document.getElementById('sidebar').addEventListener('click', event => {
      const nav = event.target.closest('[data-nav]');
      if(!nav) return;
      switchPage(nav.dataset.nav);
    });

    document.getElementById('content').addEventListener('click', event => {
      const issueButton = event.target.closest('[data-issue-id]');
      if(issueButton){
        openIssue(Number(issueButton.dataset.issueId));
        return;
      }
      const backButton = event.target.closest('[data-action="back-to-issues"]');
      if(backButton){
        closeIssueDetail();
        return;
      }
      const nodeButton = event.target.closest('[data-node-id]');
      if(nodeButton){
        selectTopologyNode(nodeButton.dataset.nodeId);
        return;
      }
      const nodeLogsButton = event.target.closest('[data-node-logs]');
      if(nodeLogsButton){
        toggleTopologyLogs(nodeLogsButton.dataset.nodeLogs);
        return;
      }
      const openChatButton = event.target.closest('[data-action="open-chat-panel"]');
      if(openChatButton){
        openChatPanel();
        return;
      }
      const closeChatButton = event.target.closest('[data-action="close-chat-panel"]');
      if(closeChatButton){
        closeChatPanel();
        return;
      }
      const toggleFlowButton = event.target.closest('[data-action="toggle-flow-accordions"]');
      if(toggleFlowButton){
        const shouldOpen = !allFlowAccordionOpen();
        state.flowAccordion = {
          application: shouldOpen,
          activity: shouldOpen,
          failure: shouldOpen,
          evidence: shouldOpen,
        };
        render();
        return;
      }
      const assistantButton = event.target.closest('[data-assistant-mode]');
      if(assistantButton){
        submitAssistantQuery(assistantButton.dataset.assistantMode);
      }
    });

    document.getElementById('content').addEventListener('toggle', event => {
      const accordion = event.target.closest('[data-flow-section]');
      if(!accordion) return;
      const section = accordion.dataset.flowSection;
      state.flowAccordion[section] = accordion.open;
    }, true);

    document.getElementById('content').addEventListener('input', event => {
      if(event.target.id === 'issue-search'){
        state.searchQuery = event.target.value;
        renderIssuesWorkspace();
        return;
      }
      if(event.target.id === 'assistant-draft'){
        state.assistantDraft = event.target.value;
      }
    });

    document.getElementById('content').addEventListener('change', event => {
      if(event.target.id === 'status-filter'){
        state.statusFilter = event.target.value;
        renderIssuesWorkspace();
        return;
      }
      if(event.target.id === 'severity-filter'){
        state.severityFilter = event.target.value;
        renderIssuesWorkspace();
      }
    });

    document.getElementById('content').addEventListener('keydown', event => {
      if(event.target.id === 'assistant-draft' && event.key === 'Enter'){
        event.preventDefault();
        submitAssistantQuery('custom');
      }
    });

    loadIssues();
  </script>
</body>
</html>
