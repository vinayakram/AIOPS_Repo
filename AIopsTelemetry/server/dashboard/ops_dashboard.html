        id: String(node?.id || `node-${idx + 1}`),
        name: node?.name || node?.process_name || node?.service || `Node ${idx + 1}`,
        zone: node?.zone || (idx === 0 ? 'platform' : 'runtime'),
        role: node?.role || '',
        status: ['ok','warn','error'].includes(node?.status) ? node.status : 'ok',
        summary: node?.summary || node?.error_message || node?.role || '',
        error_message: node?.error_message || '',
        metrics: Array.isArray(node?.metrics) ? node.metrics : [],
        logs: Array.isArray(node?.logs) ? node.logs : [],
        layout: node?.layout || null,
      };
    }

    function defaultNodesForIssue(issue){
      const severity = issue?.severity === 'critical' || issue?.severity === 'high' ? 'error' : issue?.severity === 'medium' ? 'warn' : 'ok';
      return [
        {id:'vm-host', name:'VM Host', zone:'platform', role:'Compute and OS scheduler', status:severity, summary:titleOf(issue), metrics:[], logs:[]},
        {id:'docker-runtime', name:'Docker Runtime', zone:'runtime', role:'Container runtime and isolation', status:severity === 'error' ? 'warn' : severity, summary:descOf(issue), metrics:[], logs:[]},
        {id:'ai-agent', name:appOf(issue), zone:'runtime', role:'Primary application service', status:severity, summary:descOf(issue), metrics:[], logs:[]},
        {id:'prometheus', name:'Prometheus', zone:'observability', role:'Metrics scraping and alerting', status:'ok', summary:'Monitoring path', metrics:[], logs:[]},
        {id:'langfuse', name:'Langfuse', zone:'observability', role:'Trace capture and LLM observability', status:'ok', summary:'Tracing path', metrics:[], logs:[]},
        {id:'pgvector', name:'PGVector DB', zone:'observability', role:'Stateful vector dependency', status:'ok', summary:'Dependency path', metrics:[], logs:[]},
      ];
    }

    function buildFallbackTopologyPayload(issue, errorMessage = ''){
      const meta = issueMeta(issue);
      const rawTopology = meta.topology || {};
      const nodes = (Array.isArray(rawTopology.nodes) && rawTopology.nodes.length ? rawTopology.nodes : defaultNodesForIssue(issue)).map(normalizeNode);
      const counts = {ok:0, warn:0, error:0};
      nodes.forEach(node => { counts[node.status] = (counts[node.status] || 0) + 1; });
      const defaultComponent = (nodes.find(node => node.status === 'error') || nodes.find(node => node.status === 'warn') || nodes[0] || {}).id || null;
      return {
        issue: {id: issue.id, app_name: issue.app_name, trace_id: issue.trace_id},
        analysis: {
          status: rawTopology.root_cause_chain || issue.description ? 'done' : 'missing',
          likely_cause: rawTopology.root_cause_chain || descOf(issue),
          recommended_action: rawTopology.recommended_action || (errorMessage ? `${tr('technicalView')}: ${errorMessage}` : ''),
          model_used: errorMessage ? 'local-fallback' : 'metadata-topology',
        },
        topology: {
          title: rawTopology.title || tr('runtimeTitle'),
          root_cause_chain: rawTopology.root_cause_chain || descOf(issue),
          recommended_action: rawTopology.recommended_action || '',
          nodes,
          metrics: Array.isArray(rawTopology.metrics) ? rawTopology.metrics : [],
          health_counts: counts,
          default_component_id: defaultComponent,
        },
      };
    }

    function buildIncidentStory(topology, issue, analysis){
      const nodes = (topology?.nodes || []).map(node => ({...node}));
      const appTokens = [String(issue?.app_name || '').toLowerCase(), String(appOf(issue) || '').toLowerCase()].filter(Boolean);
      const primary = nodes.find(node => node.id === topology?.default_component_id)
        || nodes.find(node => String(node?.status || '').toLowerCase() === 'error')
        || nodes.find(node => String(node?.status || '').toLowerCase() === 'warn')
        || nodes[0]
        || null;
      const hostNodes = nodes.filter(node => ['platform','host'].includes(String(node.zone || '').toLowerCase()));
      const agentNodes = nodes.filter(node => {
        const name = `${node.id} ${node.name}`.toLowerCase();
        return appTokens.some(token => token && name.includes(token)) || node.id === 'ai-agent' || name.includes('agent');
      });
      const componentNodes = nodes.filter(node => ['docker-runtime','pgvector'].includes(node.id) || /db|vector|runtime|container|postgres/.test(`${node.id} ${node.name}`.toLowerCase()));
      const observabilityNodes = nodes.filter(node => ['prometheus','langfuse'].includes(node.id) || /prometheus|langfuse|trace|observability|metric/.test(`${node.id} ${node.name}`.toLowerCase()));
      const unique = list => list.filter((node, index, self) => self.findIndex(other => other.id === node.id) === index);
      const applicationNodes = unique(agentNodes.length ? agentNodes : [primary].filter(Boolean));
      const activityNodes = unique([
        ...agentNodes,
        ...componentNodes.filter(node => !primary || node.id !== primary.id),
        ...hostNodes.filter(node => !primary || node.id !== primary.id),
      ]).slice(0, 4);
      const failureNodes = unique([
        primary,
        ...nodes.filter(node => ['error','warn'].includes(String(node?.status || '').toLowerCase()) && (!primary || node.id !== primary.id)),
      ].filter(Boolean)).slice(0, 3);
      const evidenceNodes = unique(observabilityNodes.length ? observabilityNodes : [
        ...nodes.filter(node => (Array.isArray(node?.metrics) && node.metrics.length) || (Array.isArray(node?.logs) && node.logs.length)),
        ...nodes.filter(node => /prometheus|langfuse|trace|metric/.test(`${node.id} ${node.name}`.toLowerCase())),
      ]).slice(0, 4);
      const applicationName = appOf(issue) || localizeNodeName(applicationNodes[0] || primary || {}, issue) || '--';
      const failureName = localizeNodeName(failureNodes[0] || primary || applicationNodes[0] || {}, issue) || applicationName;
      const evidenceNames = evidenceNodes.map(node => localizeNodeName(node, issue)).filter(Boolean).slice(0, 2);
      const causeText = topologyCauseOf(topology, analysis, issue);
      return {
        application: {
          title: state.lang === 'ja' ? 'アプリケーション' : 'Application',
          copy: state.lang === 'ja'
            ? `${applicationName} が今回の問題の対象サービスです。`
            : `${applicationName} is the application tied to this incident.`,
          nodes: applicationNodes.slice(0, 2),
        },
        host: hostNodes[0] || primary || null,
        activity: {
          title: state.lang === 'ja' ? '何をしていたか' : 'What it was doing',
          copy: state.lang === 'ja'
            ? 'この問題が見えた時に通っていた処理経路です。'
            : 'This is the path the application was using when the issue surfaced.',
          nodes: activityNodes.length ? activityNodes : applicationNodes,
        },
        failure: {
          title: state.lang === 'ja' ? 'どこで壊れたか' : 'Where it broke',
          copy: state.lang === 'ja'
            ? `${failureName} が今回の主な異常ポイントです。`
            : `${failureName} is the main break point for this incident.`,
          nodes: failureNodes.length ? failureNodes : applicationNodes,
        },
        evidence: {
          title: state.lang === 'ja' ? 'どこで証拠を見たか' : 'How we verified it',
          copy: state.lang === 'ja'
            ? `${evidenceNames.join(' / ') || '監視とトレース'} で根拠を確認できます。`
            : `Evidence is confirmed in ${evidenceNames.join(' / ') || 'monitoring and trace tools'}.`,
          nodes: evidenceNodes.length ? evidenceNodes : unique(nodes.filter(node =>
            !hostNodes.some(item => item.id === node.id)
            && !agentNodes.some(item => item.id === node.id)
            && !componentNodes.some(item => item.id === node.id)
          )).slice(0, 3),
        },
        summary: shortenPlainText(causeText, 180),
        extra: unique(nodes.filter(node =>
          !hostNodes.some(item => item.id === node.id)
          && !agentNodes.some(item => item.id === node.id)
          && !componentNodes.some(item => item.id === node.id)
          && !observabilityNodes.some(item => item.id === node.id)
        )),
      };
    }

    function buildImpactSummary(issue, topology, analysis){
      const impact = topology?.impact || {};
      const primary = (topology?.nodes || []).find(node => node.id === topology?.default_component_id)
        || (topology?.nodes || []).find(node => node.status === 'error')
        || (topology?.nodes || []).find(node => node.status === 'warn')
        || (topology?.nodes || [])[0]
        || null;
      const affectedApps = Array.isArray(impact.applications) && impact.applications.length ? impact.applications.filter(Boolean) : [appOf(issue)].filter(Boolean);
      const cause = topologyCauseOf(topology, analysis, issue);
      return {
        service: appOf(issue) || '--',
        status: statusText(issue?.status),
        severity: sevText(issue?.severity),
        source: primary ? localizeNodeName(primary, issue) : appOf(issue),
        cause: shortenPlainText(cause, 180),
        nextAction: shortenPlainText(topologyActionOf(topology, analysis) || (state.lang === 'ja' ? '安全な初動対応を確認してください。' : 'Review the safest next response.'), 180),
        affected: affectedApps.join(', ') || appOf(issue) || '--',
      };
    }

    function assistantServiceName(node, issue){
      const raw = String(node?.service_name || node?.app_name || node?.name || '').trim();
      if(!raw) return issue?.app_name || '';
      const normalized = raw.toLowerCase();
      if(normalized === 'ai agent' || normalized === 'ai-agent'){
        return issue?.app_name || raw;
      }
      return raw;
    }

    function assistantServiceContext(issue, topology){
      const nodes = Array.isArray(topology?.nodes) ? topology.nodes : [];
      const projection = topology?.projection || {};
      const findNode = id => nodes.find(node => String(node?.id || '') === String(id || ''));
      const symptomNode = findNode(projection.symptom_component_id);
      const rootNode = findNode(projection.root_component_id);
      const affectedService = assistantServiceName(symptomNode, issue) || issue?.app_name || '';
      let rootCandidateService = assistantServiceName(rootNode, issue) || affectedService;
      if(rootCandidateService === affectedService){
        const alternate = nodes.find(node => {
          const candidate = assistantServiceName(node, issue);
          return candidate && candidate !== affectedService && ['warn', 'error'].includes(String(node?.status || '').toLowerCase());
        });
        if(alternate){
          rootCandidateService = assistantServiceName(alternate, issue);
        }
      }
      return {
        affectedService,
        rootCandidateService: rootCandidateService || affectedService,
      };
    }

    function buildFiveWhys(issue, analysis){
      const cause = analysisCauseOf(analysis) || descOf(issue) || titleOf(issue);
      const action = analysisActionOf(analysis) || tr('nextAction');
      const symptom = descOf(issue) || titleOf(issue);
      const layer = appOf(issue);
      return state.lang === 'ja'
        ? [
            ['なぜ利用者に影響が出たのか？', `${layer} で ${symptom} が発生したためです。`],
            ['なぜその問題が起きたのか？', cause],
            ['なぜ影響が広がったのか？', '同じランタイム経路にある依存コンポーネントにも影響が及んだためです。'],
            ['なぜ特定できるのか？', 'Prometheus や Langfuse などのシグナルに裏付けが残っているためです。'],
            ['次に何をすべきか？', action],
          ]
        : [
            ['Why did users feel impact?', `${layer} surfaced the issue as: ${symptom}.`],
            ['Why did that happen?', cause],
            ['Why did it propagate?', 'Dependencies on the same runtime path were affected as the issue expanded.'],
            ['Why are we confident?', 'Operational evidence was preserved in monitoring and trace signals.'],
            ['What should happen next?', action],
          ];
    }

    function detectAssistantIntent(question){
      const text = String(question || '').trim().toLowerCase();
      if(!text) return 'general';
      if(/next step|action|recommend|fix|mitigat|resolve|対応|修正|対処|次/.test(text)) return 'action';
      if(/status|current|now|live|ongoing|resolved|still|状態|現在|ライブ/.test(text)) return 'status';
      if(/evidence|metric|metrics|log|logs|prometheus|proof|signal|trace|証拠|ログ|メトリクス/.test(text)) return 'evidence';
      if(/which service|what service|affected|impact|component|service|app|どの|サービス|影響/.test(text)) return 'service';
      if(/why|cause|root cause|reason|what happened|issue|problem|原因|なぜ|理由/.test(text)) return 'cause';
      return 'general';
    }

    function buildChatEvidence(live){
      return (live?.evidence || [])
        .map(item => cleanDisplayText(item?.summary || item?.query_name || item?.kind))
        .filter(Boolean)
        .slice(0, 6);
    }

    function buildAssistantChatText(question, issue, analysis, topology, live){
      const serverAnswer = cleanDisplayText(live?.answer);
      if(serverAnswer) return serverAnswer;
      const intent = detectAssistantIntent(question);
      const impact = buildImpactSummary(issue, topology, analysis);
      const cause = analysisCauseOf(analysis) || impact.cause || descOf(issue) || titleOf(issue);
      const action = analysisActionOf(analysis) || topologyActionOf(topology, analysis) || impact.nextAction;
      const evidence = buildChatEvidence(live);
      const liveHazard = (live?.evidence || []).some(item => ['warning','error','critical'].includes(String(item?.severity || '').toLowerCase()));

      if(intent === 'action'){
        return cleanDisplayText(action) || tr('noIssueSpecificAnswer');
      }
      if(intent === 'status'){
        if(state.lang === 'ja'){
          if(liveHazard) return `問題 #${issue.id} は ${impact.status} で、${impact.service} に対して現在も警告またはエラーのライブ証拠があります。`;
          if(evidence.length) return `問題 #${issue.id} は ${impact.status} で、現在のライブ証拠は正常または参考情報です。`;
          return `問題 #${issue.id} は ${impact.status} ですが、この時間枠では新しいライブ証拠は返っていません。`;
        }
        if(liveHazard) return `Issue #${issue.id} is ${impact.status}, and live evidence still shows an active warning or error affecting ${impact.service}.`;
        if(evidence.length) return `Issue #${issue.id} is ${impact.status}, and the current live evidence is informational or healthy.`;
        return `Issue #${issue.id} is ${impact.status}, but no new live evidence was returned in this window.`;
      }
      if(intent === 'evidence'){
        if(evidence.length){
          return state.lang === 'ja'
            ? `この問題に関連するライブ証拠は次のとおりです: ${evidence.join('; ')}`
            : `Live evidence tied to this issue: ${evidence.join('; ')}`;
        }
        return tr('noIssueSpecificAnswer');
      }
      if(intent === 'service'){
        if(state.lang === 'ja'){
          return `影響を受けているサービスは ${impact.service} です。現在の主要な影響経路では ${impact.source} が関連コンポーネントとして見えています。`;
        }
        return `The affected service is ${impact.service}. In the current impact path, ${impact.source} appears as the primary related component.`;
      }
      if(intent === 'cause'){
        return cleanDisplayText(cause) || tr('noIssueSpecificAnswer');
      }
      if(state.lang === 'ja'){
        return cleanDisplayText(analysisSummaryOf(analysis) || cause || action) || tr('noIssueSpecificAnswer');
      }
      return cleanDisplayText(analysisSummaryOf(analysis) || cause || action) || tr('noIssueSpecificAnswer');
    }

    async function loadIssues({preserveDetail = false} = {}){
      const previousId = preserveDetail ? state.selectedIssueId : null;
      state.loadingIssues = true;
      if(!preserveDetail){
        state.selectedIssueId = null;
        state.topologyPayload = null;
        state.topologySelected = null;
        state.topologyBadge = null;
        state.topologyLogsSelected = null;
        state.componentLogs = [];
        state.componentLogMeta = null;
        state.assistantMessages = [];
        state.assistantDraft = '';
        clearComponentLogTimer();
      }
      render();
      try{
        const res = await fetch(`/api/issues?lang=${encodeURIComponent(state.lang)}`);
        if(!res.ok) throw new Error(await res.text());
        const data = await res.json();
        state.issues = data.issues || [];
        if(previousId && state.issues.some(issue => issue.id === previousId)){
          state.selectedIssueId = previousId;
          await loadSelectedTopology();
        } else if(previousId){
          state.selectedIssueId = null;
          state.topologyPayload = null;
          state.topologySelected = null;
          state.topologyBadge = null;
          state.topologyLogsSelected = null;
          state.componentLogs = [];
          state.componentLogMeta = null;
        } else if(state.initialIssueId && state.issues.some(issue => issue.id === state.initialIssueId)){
          state.selectedIssueId = state.initialIssueId;
          state.hasAutoOpenedIssue = true;
          await loadSelectedTopology();
          if(['chat','rca','remediation'].includes(state.initialMode)){
            state.chatPanelOpen = true;
          }
          state.initialIssueId = null;
          state.initialMode = '';
        } else if(state.currentPage === 'issues' && !state.hasAutoOpenedIssue){
          const preferred = state.issues.find(issue => issue.status !== 'RESOLVED' && issue.severity === 'critical')
            || state.issues.find(issue => issue.status !== 'RESOLVED' && issue.severity === 'high')
            || state.issues.find(issue => issue.status !== 'RESOLVED')
            || state.issues[0]
            || null;
          if(preferred){
            state.selectedIssueId = preferred.id;
            state.hasAutoOpenedIssue = true;
            await loadSelectedTopology();
          }
        }
      } catch (error){
        state.issues = [];
        state.topologyPayload = null;
        state.topologySelected = null;
        state.topologyBadge = null;
        state.topologyLogsSelected = null;
        state.componentLogMeta = null;
        state.componentLogs = [{timestamp:new Date().toISOString(), level:'ERROR', message:String(error.message || error)}];
      } finally {
        state.loadingIssues = false;
        render();
      }
    }

      state.topologyLogsSelected = null;

    async function loadSelectedTopology(){
      const issue = getSelectedIssue();
      if(!issue) return;
      try{
        const res = await fetch(`/api/topology/issues/${issue.id}?lang=${encodeURIComponent(state.lang)}`);
        if(!res.ok) throw new Error(await res.text());
        state.topologyPayload = normalizeLegacyTopologyPayload(await res.json(), issue);
      } catch (error){
        state.topologyPayload = normalizeLegacyTopologyPayload(
          buildFallbackTopologyPayload(issue, String(error.message || error)),
          issue
        );
      }
      state.topologySelected = null;
      state.topologyBadge = null;
      state.topologyLogsSelected = null;
      state.componentLogSource = 'all';
      state.componentLogs = [];
      state.componentLogMeta = null;
      state.componentLogLoading = false;
      state.detailPane = 'rca';
      state.chatPanelOpen = false;
      const topology = state.topologyPayload?.topology || {};
      const defaultNodeId = topology.default_component_id
        || getSelectedBadgeGroup(topology, issue)?.firstNodeId
        || null;
      if(defaultNodeId){
        state.topologySelected = defaultNodeId;
        state.topologyBadge = topologyBadgeIdForNode(
          (topology.nodes || []).find(node => node.id === defaultNodeId),
          issue
        );
        state.topologyLogsSelected = defaultNodeId;
        await loadComponentLogs();
      }
    }

    async function loadComponentLogs(){
      clearComponentLogTimer();
      state.componentLogs = [];
      state.componentLogMeta = null;
      state.componentLogLoading = true;
      const issue = getSelectedIssue();
      if(!issue || !state.topologyLogsSelected){
        state.componentLogLoading = false;
        return;
      }
      await refreshComponentLogs(state.componentLogSource);
      if(issue.status !== 'RESOLVED'){
        state.componentLogTimer = setInterval(() => {
          refreshComponentLogs(state.componentLogSource);
        }, 5000);
      }
    }

    async function refreshComponentLogs(requestedSource = state.componentLogSource){
      const issue = getSelectedIssue();
      if(!issue || !state.topologyLogsSelected) return;
      state.componentLogLoading = true;
      const sourceParam = requestedSource && requestedSource !== 'all'
        ? `&source=${encodeURIComponent(requestedSource)}`
        : '';
      try{
        const res = await fetch(`/api/topology/issues/${issue.id}/components/${encodeURIComponent(state.topologyLogsSelected)}/logs?limit=60&lang=${encodeURIComponent(state.lang)}${sourceParam}`);
        if(!res.ok) throw new Error(await res.text());
        const data = await res.json();
        state.componentLogMeta = data;
        state.componentLogs = data.logs || [];
        choosePreferredLogSource();
      } catch (error){
        const node = (state.topologyPayload?.topology?.nodes || []).find(item => item.id === state.topologyLogsSelected);
        const fallbackLogs = Array.isArray(node?.logs) ? node.logs : [];
        state.componentLogMeta = {
          component: {
            id: node?.id,
            name: node?.name,
            status: node?.status,
            summary: node?.summary,
            role: node?.role,
            evidence_sources: node?.evidence_sources || [],
          },
          sources: node?.evidence_sources || [],
        };
        state.componentLogs = fallbackLogs.length
          ? fallbackLogs
          : [{timestamp:new Date().toISOString(), level:'ERROR', message:String(error.message || error)}];
        choosePreferredLogSource();
      } finally {
        state.componentLogLoading = false;
      }
      render();
    }

    async function selectTopologyNode(nodeId){
      if(!nodeId) return;
      const issue = getSelectedIssue();
      const node = (state.topologyPayload?.topology?.nodes || []).find(item => item.id === nodeId);
      if(node){
        state.topologyBadge = topologyBadgeIdForNode(node, issue);
      }
      if(state.topologySelected === nodeId && state.topologyLogsSelected === nodeId && state.componentLogs.length){
        return;
      }
      state.topologySelected = nodeId;
      state.topologyLogsSelected = nodeId;
      state.componentLogSource = preferredSourceForNode(nodeId);
      state.componentLogs = [];
      state.componentLogMeta = null;
      state.componentLogLoading = true;
      state.detailPane = 'metrics';
      render();
      await loadComponentLogs();
    }

    async function selectTopologyGroup(groupId){
      const issue = getSelectedIssue();
      const topology = state.topologyPayload?.topology || {};
      const group = buildOpsBadgeGroups(topology, issue).find(item => item.id === groupId);
      state.topologyBadge = groupId;
      render();
      if(!group || !group.firstNodeId) return;
      if(group.nodes.some(node => node.id === state.topologySelected) && group.nodes.some(node => node.id === state.topologyLogsSelected) && state.componentLogs.length){
        return;
      }
      await selectTopologyNode(group.firstNodeId);
    }

    async function toggleTopologyLogs(nodeId){
      if(state.topologySelected !== nodeId){
        state.topologySelected = nodeId;
      }
      if(state.topologyLogsSelected === nodeId){
        state.topologyLogsSelected = null;
        state.componentLogSource = 'all';
        state.componentLogs = [];
        state.componentLogLoading = false;
        clearComponentLogTimer();
        render();
        return;
      }
      state.topologyLogsSelected = nodeId;
      state.componentLogSource = preferredSourceForNode(nodeId);
      state.componentLogLoading = true;
      state.detailPane = 'logs';
      render();
      await loadComponentLogs();
    }

    function preferredSourceForNode(nodeId){
      if(nodeId === 'prometheus') return 'prometheus';
      if(nodeId === 'langfuse') return 'langfuse';
      return 'all';
    }

    async function requestLogSource(sourceId){
      if(!state.topologyLogsSelected) return;
      state.componentLogSource = sourceId || 'all';
      state.componentLogLoading = true;
      state.detailPane = 'logs';
      render();
      await loadComponentLogs();
    }

    function choosePreferredLogSource(){
      const rows = Array.isArray(state.componentLogs) ? state.componentLogs : [];
      const rowSources = new Set(rows.map(log => inferredLogSource(log, state.topologyLogsSelected)).filter(Boolean));
      const availableSources = Array.isArray(state.componentLogMeta?.sources)
        ? state.componentLogMeta.sources.map(source => String(source?.id || source?.label || '').toLowerCase()).filter(Boolean)
        : [];
      if(state.topologyLogsSelected === 'prometheus'){
        state.componentLogSource = 'prometheus';
        return;
      }
      if(state.topologyLogsSelected === 'langfuse'){
        state.componentLogSource = 'langfuse';
        return;
      }
      if(state.componentLogSource !== 'all' && (rowSources.has(state.componentLogSource) || availableSources.includes(state.componentLogSource))){
        return;
      }
      if(rowSources.has('prometheus')){ state.componentLogSource = 'prometheus'; return; }
      if(rowSources.has('langfuse')){ state.componentLogSource = 'langfuse'; return; }
      if(availableSources.includes('prometheus')){ state.componentLogSource = 'prometheus'; return; }
      if(availableSources.includes('langfuse')){ state.componentLogSource = 'langfuse'; return; }
      state.componentLogSource = 'all';
    }

    function inferredLogSource(log, selectedNodeId){
      const raw = String(log?.source || log?.source_label || '').toLowerCase();
      if(raw.includes('prom')) return 'prometheus';
      if(raw.includes('langfuse')) return 'langfuse';
      if(selectedNodeId === 'prometheus') return 'prometheus';
      if(selectedNodeId === 'langfuse') return 'langfuse';
      return 'aiops-local';
    }

    async function submitAssistantQuery(mode = 'custom'){
      const issue = getSelectedIssue();
      if(!issue) return;
      const draft = state.assistantDraft.trim();
      const userText = mode === 'custom' ? draft : '';
      const label = mode === 'custom' ? userText : ({summary:tr('quickSummary'), five:tr('quickFive'), detailed:tr('quickDetailed')})[mode];
      if(mode === 'custom' && !userText) return;
      state.assistantDraft = '';
      state.assistantMessages = [...state.assistantMessages, {role:'user', text:label}];
      state.assistantLoading = true;
      state.chatPanelOpen = true;
      render();
      const analysis = state.topologyPayload?.analysis || {};
      const topology = state.topologyPayload?.topology || {};
      const serviceContext = assistantServiceContext(issue, topology);
      try{
        let response;
        if(mode === 'five'){
          response = {role:'assistant', mode:'five', title:tr('quickFive'), items:buildFiveWhys(issue, analysis)};
        } else if(mode === 'detailed'){
          response = {
            role:'assistant',
            mode:'detailed',
            title:tr('detailedTitle'),
            cause:topologyCauseOf(topology, analysis, issue),
            action:topologyActionOf(topology, analysis) || tr('nextAction'),
            evidence:String(analysis.evidence || descOf(issue) || '').split('\n').map(item => item.trim()).filter(Boolean).slice(0, 6),
          };
        } else if(mode === 'summary'){
          response = {
            role:'assistant',
            mode:'summary',
            title:tr('summaryTitle'),
            summary:topologyCauseOf(topology, analysis, issue),
          };
        } else {
          setMcpActive(true);
          try {
            const res = await fetch('/api/chat/rca/live', {
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({
                issue_id: issue.id,
                message: userText,
                service: serviceContext.affectedService || issue.app_name,
                root_candidate_service: serviceContext.rootCandidateService || issue.app_name,
                lang: state.lang,
              }),
            });
            const live = await res.json();
            const evidence = buildChatEvidence(live);
            response = {
              role:'assistant',
              mode:'chat',
              title:tr('chatAnswerTitle'),
              text:buildAssistantChatText(userText, issue, analysis, topology, live),
              evidence,
            };
          } finally {
            setMcpActive(false);
          }
        }
        state.assistantMessages = [...state.assistantMessages, response];

        state.assistantLoading = false;

        const errRate = app.error_rate_pct ?? 0;
        const avgMs = app.avg_ms ?? 0;
        const openIssues = app.open_issues ?? 0;
        const tone = openIssues > 0 || errRate > 10 ? 'error'
                   : errRate > 2 || avgMs > 800 ? 'warn' : 'ok';
        const statusLabel = tone === 'error'
          ? (la ? 'エラー' : 'Error')

          ? (la ? '要注意' : 'Degraded')
          : (la ? '正常' : 'Healthy');
        const errClass = errRate > 10 ? 'error' : errRate > 2 ? 'warn' : '';
        const latClass = avgMs > 800 ? 'error' : avgMs > 400 ? 'warn' : '';
        const hasProm = errRate != null && app.total_traces > 0;

        return `

              <div class="app-health-metric">
                <span class="app-health-metric-val ${latClass}">${avgMs < 1000 ? avgMs.toFixed(0)+'ms' : (avgMs/1000).toFixed(1)+'s'}</span>

    function compactIncidentSegment(text, issue){
      const clean = String(text || '').replace(/\s+/g, ' ').trim();
      if(!clean) return '';
      const lower = clean.toLowerCase();
      const appName = String(appOf(issue) || '').trim();
      if(lower.includes('vm host') || lower.includes('host cpu') || lower.startsWith('vm ') || lower === 'host'){
        return state.lang === 'ja' ? 'VMホスト' : 'VM Host';
      }
      if(lower.includes('docker')){
        return state.lang === 'ja' ? 'Dockerランタイム' : 'Docker Runtime';
      }
      if(lower.includes('pgvector') || lower.includes('postgres')){
        return 'PGVector DB';
      }
      if(lower.includes('langfuse')){
        return 'Langfuse';
      }
      if(lower.includes('prometheus')){
        return 'Prometheus';
      }
      if(appName && lower.includes(appName.toLowerCase())){
        return appName;
      }
      return shortenPlainText(clean, 34);
    }

    function numericMetricValue(metric){
      const raw = String(metric?.value ?? '').replace(/,/g, '');
      const match = raw.match(/-?\d+(\.\d+)?/);
      return match ? Number(match[0]) : NaN;
    }

    function findMetric(node, matcher){
      const metrics = Array.isArray(node?.metrics) ? node.metrics : [];
      return metrics.find(metric => matcher(String(metric?.label || metric?.name || '').toLowerCase())) || null;
    }

    function toneForStatus(status){

    function renderMetricBar(metric, fallbackLabel = '', tone = 'ok'){
      if(!metric) return '';
      const value = String(metric.value || '--');
      const widthValue = numericMetricValue(metric);
      const width = Number.isFinite(widthValue) ? Math.max(10, Math.min(Math.abs(widthValue), 100)) : 24;
      return `
        <div class="fault-map-bar">
          <div class="fault-map-bar-top">
            <span>${esc(metric.label || metric.name || fallbackLabel)}</span>
            <strong>${esc(value)}</strong>

          <div class="fault-map-track"><div class="fault-map-fill ${esc(tone)}" style="width:${width}%"></div></div>
        </div>
      `;
    }

    function servicePathServices(topology, issue){
      const where = String(topology?.impact?.where || '').trim();
      const parts = where.includes('->')
        ? where.split('->').map(part => String(part || '').trim()).filter(Boolean)
        : [];
      if(parts.length >= 2) return parts;
      const issueApp = String(issue?.app_name || '').trim();
      return issueApp ? ['', issueApp] : [];
    }

    function collectNodeLogs(nodes, matcher){
      const seen = new Set();
      const logs = [];
      (Array.isArray(nodes) ? nodes : []).forEach(node => {
        (Array.isArray(node?.logs) ? node.logs : []).forEach(log => {
          const message = String(log?.message || '').trim();
          if(!message || !matcher(message, node)) return;
          const key = `${log.timestamp || ''}|${log.level || ''}|${message}`;
          if(seen.has(key)) return;
          seen.add(key);
          logs.push({
            timestamp: log.timestamp || new Date().toISOString(),
            level: log.level || 'INFO',
            message,
            source: log.source || '',
            source_label: log.source_label || '',
          });
        });
      });
      return logs;
    }

    function synthesizeLegacyUpstreamNode(topology, issue){
      const nodes = Array.isArray(topology?.nodes) ? topology.nodes : [];
      const services = servicePathServices(topology, issue);
      if(services.length < 2) return null;
      const upstream = services[0];
      const downstream = services[services.length - 1];
      if(!upstream || !downstream || upstream === downstream) return null;
      if(nodes.some(node => String(node?.id || '').trim() === upstream)) return null;

      const upstreamLogs = collectNodeLogs(nodes, (message, node) => {
        const text = `${message} ${node?.id || ''} ${node?.name || ''}`.toLowerCase();
        return text.includes(upstream.toLowerCase());
      });
      const promNode = nodes.find(node => String(node?.id || '') === 'prometheus');
      const promMetrics = Array.isArray(promNode?.metrics) ? promNode.metrics : [];
      const failedRequestsMetric = promMetrics.find(metric => /failed requests/i.test(String(metric?.label || metric?.name || '')));
      const upstreamStatusMetric = promMetrics.find(metric => /last upstream status/i.test(String(metric?.label || metric?.name || '')));
      const upstreamIssueMetric = collectNodeLogs(nodes, message => /issue\s*#\d+/i.test(String(message || '')) && String(message || '').toLowerCase().includes(upstream.toLowerCase()))[0];

      return {
        id: upstream,
        name: upstream,
        service_name: upstream,
        zone: 'service',
        status: 'error',
        role: 'Primary application service',
        summary: state.lang === 'ja'
          ? `${localizeNodeName({name: upstream}, issue)} が上流側で障害を起こし、${localizeNodeName({name: downstream}, issue)} に影響しています。`
          : `${upstream} is failing upstream and propagating impact to ${downstream}.`,
        metrics: [
          {label:'Issue', value: upstreamIssueMetric?.message?.match(/#\d+/)?.[0] || 'upstream'},
          upstreamStatusMetric ? {label:'Status', value: upstreamStatusMetric.value || '--'} : null,
          failedRequestsMetric ? {label:'Failed requests', value: failedRequestsMetric.value || '--'} : null,
        ].filter(Boolean),
        logs: upstreamLogs.slice(0, 8),
        evidence_sources: [
          {id:'prometheus', label:'Prometheus', kind:'metrics'},
          {id:'langfuse', label:'Langfuse', kind:'traces'},
          {id:'aiops-local', label:'Local issue logs', kind:'logs'},
        ],
      };
    }

    function normalizeLegacyTopologyPayload(payload, issue){
      const originalTopology = payload?.topology || {};
      const topology = {
        ...originalTopology,
        nodes: Array.isArray(originalTopology.nodes) ? originalTopology.nodes.map(node => ({...node})) : [],
        projection: {...(originalTopology.projection || {})},
      };
      const syntheticUpstream = synthesizeLegacyUpstreamNode(topology, issue);
      if(syntheticUpstream){
        topology.nodes.push(syntheticUpstream);
        const projection = topology.projection || {};
        const pathIds = Array.isArray(projection.path_component_ids) ? [...projection.path_component_ids] : [];
        const affectedIds = Array.isArray(projection.affected_component_ids) ? [...projection.affected_component_ids] : [];
        const evidenceIds = Array.isArray(projection.evidence_component_ids) ? [...projection.evidence_component_ids] : [];
        if(!pathIds.includes(syntheticUpstream.id)) pathIds.unshift(syntheticUpstream.id);
        if(!affectedIds.includes(syntheticUpstream.id)) affectedIds.unshift(syntheticUpstream.id);
        if(!evidenceIds.includes('prometheus')) evidenceIds.push('prometheus');
        if(!evidenceIds.includes('langfuse')) evidenceIds.push('langfuse');
        topology.projection = {
          ...projection,
          root_component_id: syntheticUpstream.id,
          path_component_ids: pathIds,
          affected_component_ids: affectedIds,
          evidence_component_ids: evidenceIds,
        };
      }
      return {...payload, topology};
    }

    function deriveFaultMap(topology, issue, analysis){
      const story = buildIncidentStory(topology, issue, analysis);
      const allNodes = uniqueNodesById((topology?.nodes || []).map(node => ({...node})));
      const projection = topology?.projection || {};
      const nodeMap = new Map(allNodes.map(node => [node.id, node]));
      const pickNodes = ids => uniqueNodesById((Array.isArray(ids) ? ids : []).map(id => nodeMap.get(id)).filter(Boolean));
      const pathNodes = pickNodes(projection.path_component_ids);
      const affectedNodes = pickNodes(projection.affected_component_ids);
      const evidenceNodes = pickNodes(projection.evidence_component_ids);
      const hostNode = pathNodes.find(node => ['platform', 'host'].includes(String(node?.zone || '').toLowerCase()))
        || allNodes.find(node => ['platform', 'host'].includes(String(node?.zone || '').toLowerCase()))
        || story.host
        || null;
      const rootNode = nodeMap.get(projection.root_component_id)
        || affectedNodes[0]
        || story.failure.nodes[0]
        || hostNode
        || null;
      const symptomNode = nodeMap.get(projection.symptom_component_id)
        || allNodes.find(node => node.id === topology?.default_component_id)
        || story.application.nodes[0]
        || rootNode
        || null;
      const runtimeNodes = uniqueNodesById(pathNodes.filter(node =>
        String(node?.zone || '').toLowerCase() === 'runtime'
        || /docker|runtime|container/.test(`${node?.id || ''} ${node?.name || ''}`.toLowerCase())
      ));
      const serviceNodes = uniqueNodesById([
        symptomNode,
        ...pathNodes.filter(node =>
          node
          && node.id !== hostNode?.id
          && !runtimeNodes.some(item => item.id === node.id)
          && !evidenceNodes.some(item => item.id === node.id)
          && String(node?.zone || '').toLowerCase() !== 'platform'
        ),
        ...allNodes.filter(node => /pgvector|postgres|db|vector/.test(`${node?.id || ''} ${node?.name || ''}`.toLowerCase())),
      ].filter(Boolean));
      const sourceNodes = uniqueNodesById([
        hostNode,
        rootNode,
        ...pathNodes.filter(node =>
          ['platform', 'host'].includes(String(node?.zone || '').toLowerCase())
          && node.id !== hostNode?.id
          && node.id !== rootNode?.id
        ),
      ].filter(Boolean));
      const visibleEvidenceNodes = evidenceNodes.length
        ? evidenceNodes
        : uniqueNodesById(story.evidence.nodes).slice(0, 2);
      const stackNodes = uniqueNodesById([
        ...runtimeNodes,
        symptomNode,
        ...serviceNodes.filter(node => node?.id !== symptomNode?.id),
        ...sourceNodes.filter(node => node?.id !== hostNode?.id),
      ].filter(Boolean));
      const selectedNode = nodeMap.get(state.topologySelected)
        || symptomNode
        || rootNode
        || hostNode
        || allNodes[0]
        || null;
      const pathList = pathNodes.length ? pathNodes : uniqueNodesById([rootNode, ...runtimeNodes, symptomNode].filter(Boolean));
      const pathSummary = pathList.map(node => compactIncidentSegment(localizeNodeName(node, issue), issue)).filter(Boolean).join(' -> ') || '--';
      return {
        hostNode,
        rootNode,
        symptomNode,
        runtimeNodes,
        serviceNodes,
        sourceNodes,
        visibleEvidenceNodes,
        stackNodes,
        selectedNode,
        pathSummary,
        affectedIds: new Set((projection.affected_component_ids || []).filter(Boolean)),
        pathIds: new Set((projection.path_component_ids || []).filter(Boolean)),
      };
    }

      return `
        <div class="assistant-entry">

    function getHostMetric(hostNode, keyword){
      if(!hostNode) return null;
      const metrics = Array.isArray(hostNode.metrics) ? hostNode.metrics : [];
      return metrics.find(m => String(m.label || m.name || '').toLowerCase().includes(keyword)) || null;
    }

    function resourceTone(metric){
      const val = numericMetricValue(metric);
      const label = String(metric?.label || metric?.name || '').toLowerCase();
      if(/cpu|mem|ram|usage|load/.test(label)){
        if(val >= 90) return 'error';
        if(val >= 75) return 'warn';
        return 'ok';
      }
      return 'ok';
    }

    function renderVmResourceBar(label, metric){
      if(!metric) return '';
      const val = numericMetricValue(metric);
      const width = Number.isFinite(val) ? Math.max(4, Math.min(Math.abs(val), 100)) : 20;
      const tone = resourceTone(metric);
      return `
        <div class="vm-topo-resource-item">
          <div class="vm-topo-resource-label">${esc(label)}</div>
          <div class="vm-topo-resource-track">
            <div class="vm-topo-resource-fill ${esc(tone)}" style="width:${width}%"></div>
          </div>
          <div class="vm-topo-resource-value ${esc(tone)}">${esc(metric.value || '--')}</div>
        </div>
      `;
    }

    function vmFlowMetricPill(node){
      if(!node) return '';
      const metrics = Array.isArray(node.metrics) ? node.metrics : [];
      const metric = findMetric(node, l =>
        /cpu|p99|latency|mem|hit|rate|depth|conn|timeout|error|queue|kill|crash/.test(l)
      ) || metrics[0] || null;
      const tone = toneForStatus(node.status || 'ok');
      if(!metric) return `<span class="vm-topo-metric-pill ${esc(tone)}">${esc(statusLabel(node.status))}</span>`;
      const mTone = toneForStatus(node.status || 'ok');
      return `<span class="vm-topo-metric-pill ${esc(mTone)}">${esc(metric.label || metric.name || 'Metric')}: ${esc(metric.value || '--')}</span>`;
    }

    function deriveVmFlowNodes(map, allNodes){
      const seen = new Set();
      const flow = [];
      const add = node => { if(node && !seen.has(node.id)){ seen.add(node.id); flow.push(node); } };
      // User-facing symptom first
      if(map.symptomNode) add(map.symptomNode);
      // Runtime containers
      map.runtimeNodes.forEach(add);
      // Other service nodes (background jobs, workers)
      allNodes
        .filter(n => String(n?.zone || '').toLowerCase() === 'platform' && n.id !== 'vm-host')
        .forEach(add);
      // Any remaining stack nodes
      map.serviceNodes.forEach(add);
      // Database / persistent store last
      allNodes
        .filter(n => /pgvector|postgres|db/.test(String(n?.id || '').toLowerCase()))
        .forEach(add);
      return flow.filter(Boolean);
    }

    function vmAlertCount(topology){
      const h = topology?.health_counts || {};
      return (h.error || 0) + (h.warn || 0);
    }

    function renderVmTopoDiagram(topology, issue){
      const analysis = state.topologyPayload?.analysis || {};
      const map = deriveFaultMap(topology, issue, analysis);
      const allNodes = Array.isArray(topology?.nodes) ? topology.nodes : [];
      const externalDependencyIds = new Set(['pgvector', 'postgres', 'redis', 'kafka', 'rabbitmq']);
      const isExternalDependency = node => {
        const id = String(node?.id || '').toLowerCase();
        const text = `${node?.id || ''} ${node?.name || ''} ${node?.role || ''}`.toLowerCase();
        return externalDependencyIds.has(id) || /pgvector|postgres|database|db|redis|cache|queue|kafka|rabbit/.test(text);
      };

      // Observability
      const promNode = allNodes.find(n => n?.id === 'prometheus');
      const langfuseNode = allNodes.find(n => n?.id === 'langfuse');
      const alertCount = vmAlertCount(topology);
      const hasAlerts = alertCount > 0 || (promNode && promNode.status !== 'ok') || (langfuseNode && langfuseNode.status !== 'ok');

      // App state
      const h = topology?.health_counts || {};
      const normalTone = h.error > 0 ? 'error' : h.warn > 0 ? 'warn' : 'ok';
      const appName = appOf(issue) || localizeNodeName(map.symptomNode || map.rootNode || {}, issue) || '--';
      const appRunning = issue.status === 'RESOLVED';
      const uptimeLabel = appRunning
        ? age(issue.created_at)
        : `${state.lang === 'ja' ? 'クラッシュ' : 'Crashed'} ${formatLogTs(issue.created_at)}`;
      const errRate = appRunning ? '0%' : {critical:'100%', high:'~80%', medium:'~40%'}[issue.severity] || '--';
      const langfuseTraces = findMetric(langfuseNode, l => /trace|ok|err/.test(l));
      const traceLabel = langfuseTraces
        ? langfuseTraces.value
        : (appRunning ? (state.lang === 'ja' ? '正常' : 'ok') : (state.lang === 'ja' ? 'エラー' : 'err'));

      // Affected services — service-zone nodes that are in error/warn (callers of the failed component)
      const affectedServices = allNodes.filter(n => {
        const zone = String(n?.zone || '').toLowerCase();
        return (zone === 'service' || zone === 'application' || zone === 'caller')
          && n.id !== (map.rootNode?.id) && n.id !== (map.symptomNode?.id)
          && !isExternalDependency(n)
          && (n.status === 'error' || n.status === 'warn' || map.affectedIds.has(n.id));
      });
      // Fallback: use only service-like nodes, never shared dependencies such as PGVector.
      const displayedServices = uniqueNodesById([
        ...(affectedServices.length ? affectedServices : map.serviceNodes.filter(n =>
          n.id !== map.symptomNode?.id
          && !isExternalDependency(n)
          && !['platform', 'runtime', 'observability'].includes(String(n?.zone || '').toLowerCase())
        ).slice(0, 5)),
        ...(map.rootNode
          && map.rootNode.id !== map.symptomNode?.id
          && !isExternalDependency(map.rootNode)
          && ['service', 'application', 'caller'].includes(String(map.rootNode?.zone || '').toLowerCase())
          ? [map.rootNode]
          : []),
      ]);

      // External/shared dependencies are shown separately from the VM-internal stack.
      const dependencyNodes = uniqueNodesById([
        ...allNodes.filter(node => isExternalDependency(node) && !['prometheus', 'langfuse'].includes(String(node?.id || '').toLowerCase())),
      ]);

      // Inner VM components — runtime/platform nodes (not host, not observability, not shared dependencies)
      const obsIds = new Set(['prometheus', 'langfuse']);
      const innerNodes = allNodes.filter(n => {
        const zone = String(n?.zone || '').toLowerCase();
        const id = String(n?.id || '');
        if(obsIds.has(id) || id === 'vm-host') return false;
        if(zone === 'service' || zone === 'application' || zone === 'caller') return false;
        if(isExternalDependency(n)) return false;
        return true;
      });
      const wrongNodes = innerNodes.filter(n => n.status === 'error' || n.status === 'warn');
      const okNodes = innerNodes.filter(n => n.status === 'ok' || !n.status);

      // Node icon by role/zone/id
      function nodeIcon(node){
        const id = String(node?.id || '').toLowerCase();
        const role = String(node?.role || '').toLowerCase();
        if(/worker|process|job/.test(id + role)) return '⚙';
        if(/db|database|postgres|pgvector|vector/.test(id + role)) return '🗄';
        if(/cache|redis/.test(id + role)) return '⚡';
        if(/queue|kafka|rabbit/.test(id + role)) return '📬';
        if(/agent|ai/.test(id + role)) return '🤖';
        if(/runtime|docker|container/.test(id + role)) return '📦';
        return '◈';
      }

      // Status label
      function statusLabel(status){
        const map = {error: state.lang === 'ja' ? '異常' : 'Error', warn: state.lang === 'ja' ? '警告' : 'Warn', ok: state.lang === 'ja' ? '正常' : 'OK'};
        return map[status] || status || 'OK';
      }

      // Error rate for affected service nodes
      function serviceErrRate(node){
        const m = findMetric(node, l => /error|err_rate|failure/.test(l)) || (Array.isArray(node.metrics) ? node.metrics[0] : null);
        if(m && m.value) return m.value;
        return node.status === 'error' ? '~100%' : node.status === 'warn' ? '~40%' : null;
      }

      const faultPath = map.pathSummary;

      return `
        <div class="vm-topo-diagram">
          <div class="vm-topo-vm-header">
            <span class="vm-topo-vm-title">${esc(state.lang === 'ja' ? '仮想マシン (VM)' : 'Virtual machine (VM)')}</span>
            <span class="vm-topo-obs-label">Metrics: Prometheus + Langfuse</span>
          </div>

          <div class="vm-topo-split">

            ${displayedServices.length ? `
              <!-- Affected services box -->
              <div class="vm-topo-affected-box">
                <div class="vm-topo-affected-head">
                  <span class="vm-topo-affected-title">${esc(state.lang === 'ja' ? '関連サービス' : 'Related services')}</span>
                  <span class="vm-topo-affected-count">${displayedServices.length} ${state.lang === 'ja' ? 'サービス' : 'services'}</span>
                </div>
                ${displayedServices.map(node => {
                  const rate = serviceErrRate(node);
                  return `
                    <button class="vm-topo-affected-service ${state.topologySelected === node.id ? 'active' : ''}"
                      type="button" data-node-id="${esc(node.id)}">
                      <span class="vm-topo-affected-dot ${esc(node.status || 'ok')}"></span>
                      <span class="vm-topo-affected-name">${esc(localizeNodeName(node, issue))}</span>
                      ${node.id === map.rootNode?.id ? `<span class="vm-topo-affected-err">${esc(state.lang === 'ja' ? '上流起点' : 'Upstream root')}</span>` : ''}
                      ${rate ? `<span class="vm-topo-affected-err">${esc(rate)} errors</span>` : ''}
                    </button>
                  `;
                }).join('')}
                <div class="vm-topo-affected-note">${esc(state.lang === 'ja'
                  ? `上流起点と関連サービスを表示しています。${appName} への影響経路をここで確認できます。`
                  : `This shows the upstream root and related services on the impact path into ${appName}.`)}</div>
              </div>

              <!-- Cascade arrow -->
              <div class="vm-topo-cascade">
                <span class="vm-topo-cascade-label">${esc(state.lang === 'ja' ? 'API 呼び出し' : 'API calls')}</span>
                <div class="vm-topo-cascade-arrow-row">
                  <div class="vm-topo-cascade-line"></div>
                  <div class="vm-topo-cascade-head"></div>
                </div>
              </div>
            ` : ''}

            <!-- Main component box -->
            <div class="vm-topo-main-box ${esc(normalTone)}">
              <div class="vm-topo-main-header">
                <div class="vm-topo-main-title-wrap">
                  <span class="vm-topo-main-name">${esc(appName)}</span>
                  <span class="vm-topo-main-subtitle">${esc(state.lang === 'ja' ? 'アプリケーション / サービス' : 'Application / service')}</span>
                </div>
                <span class="vm-topo-status-badge ${esc(normalTone)}">${esc(appRunning
                  ? (state.lang === 'ja' ? '稼働中' : 'Running')
                  : (state.lang === 'ja' ? '停止' : 'Stopped'))}</span>
              </div>

              ${wrongNodes.length ? `
                <div class="vm-topo-section-kicker wrong">⚠ ${esc(state.lang === 'ja' ? 'VM 内で影響を受けたコンポーネント' : 'VM COMPONENTS UNDER IMPACT')}</div>
                <div class="vm-topo-sub-nodes">
                  ${wrongNodes.map(node => `
                    <button class="vm-topo-sub-node ${esc(node.status || 'ok')} ${state.topologySelected === node.id ? 'active' : ''}"
                      type="button" data-node-id="${esc(node.id)}">
                      <span class="vm-topo-sub-node-ico">${nodeIcon(node)}</span>
                      <div style="min-width:0;flex:1">
                        <div class="vm-topo-sub-node-name">${esc(localizeNodeName(node, issue))}</div>
                        <div class="vm-topo-sub-node-desc">${esc(shortenPlainText(nodeSummaryOf(node), 60))}</div>
                      </div>
                      <span class="vm-topo-sub-node-badge ${esc(node.status || 'ok')}">${esc(statusLabel(node.status))}</span>
                    </button>
                  `).join('')}
                </div>
              ` : ''}

              ${okNodes.length ? `
                <div class="vm-topo-section-kicker good">✓ ${esc(state.lang === 'ja' ? 'VM 内で正常なコンポーネント' : 'VM COMPONENTS HEALTHY')}</div>
                <div class="vm-topo-working-chips">
                  ${okNodes.map(node => `
                    <button class="vm-topo-working-chip ${state.topologySelected === node.id ? 'active' : ''}"
                      type="button" data-node-id="${esc(node.id)}">
                      ${nodeIcon(node)} ${esc(localizeNodeName(node, issue))}
                    </button>
                  `).join('')}
                </div>
              ` : ''}

              ${dependencyNodes.length ? `
                <div class="vm-topo-section-kicker">${esc(state.lang === 'ja' ? '共有依存関係 / VM 外' : 'SHARED DEPENDENCIES / OUTSIDE VM')}</div>
                <div class="vm-topo-dependency-wrap">
                  <div class="vm-topo-dependency-chips">
                    ${dependencyNodes.map(node => `
                      <button class="vm-topo-dependency-chip ${esc(node.status || 'ok')} ${state.topologySelected === node.id ? 'active' : ''}"
                        type="button" data-node-id="${esc(node.id)}">
                        <span>${nodeIcon(node)}</span>
                        <span>${esc(localizeNodeName(node, issue))}</span>
                      </button>
                    `).join('')}
                  </div>
                  <div class="vm-topo-dependency-note">${esc(state.lang === 'ja'
                    ? 'PGVector などの依存先は sample-agent の内部コンポーネントではなく、接続先の共有サービスとして扱います。'
                    : 'Dependencies such as PGVector are rendered as shared services the app talks to, not as components inside sample-agent.')}</div>
                </div>
              ` : ''}

              <div class="vm-topo-obs-bar">
                <button class="vm-topo-working-chip ${state.topologySelected === 'prometheus' ? 'active' : ''}" type="button" data-node-id="prometheus">Prometheus</button>
                <button class="vm-topo-working-chip ${state.topologySelected === 'langfuse' ? 'active' : ''}" type="button" data-node-id="langfuse">Langfuse</button>
                <span class="vsep">|</span>
                ${hasAlerts
                  ? `<span class="vm-alert">${esc(alertCount > 0 ? `${alertCount} ${state.lang === 'ja' ? 'アラート発生' : 'alerts'}` : (state.lang === 'ja' ? 'アラート発生' : 'alerts fired'))}</span>`
                  : `<span class="vm-clear">${esc(state.lang === 'ja' ? '異常なし' : 'all clear')}</span>`}
              </div>
              <div class="vm-topo-stats-row">
                <span>${esc(state.lang === 'ja' ? '稼働状況' : 'Uptime')} <strong class="${!appRunning ? 'vm-stat-err' : ''}">${esc(uptimeLabel)}</strong></span>
                <span>${esc(state.lang === 'ja' ? 'エラー率' : 'Error rate')} <strong class="${!appRunning ? 'vm-stat-err' : ''}">${esc(errRate)}</strong></span>
                <span>Langfuse <strong class="${!appRunning ? 'vm-stat-err' : ''}">${esc(traceLabel)}</strong></span>
              </div>
            </div>

          </div>

          ${faultPath ? `
            <div class="vm-topo-fault-ribbon">
              <strong>${esc(state.lang === 'ja' ? '障害経路:' : 'Fault path:')}</strong>
              <span>${esc(faultPath)}</span>
            </div>
          ` : ''}
          <div class="vm-topo-legend">
            <div class="vm-topo-legend-item"><div class="vm-topo-legend-dot error"></div><span>${esc(state.lang === 'ja' ? '障害起点' : 'Fault origin')}</span></div>
            <div class="vm-topo-legend-item"><div class="vm-topo-legend-dot warn"></div><span>${esc(state.lang === 'ja' ? '影響' : 'Affected')}</span></div>
            <div class="vm-topo-legend-item"><div class="vm-topo-legend-dot ok"></div><span>${esc(state.lang === 'ja' ? '正常' : 'Healthy')}</span></div>
            <div class="vm-topo-legend-item"><div class="vm-topo-legend-dash"></div><span>${esc(state.lang === 'ja' ? '障害伝播経路' : 'Failure cascade')}</span></div>
          </div>
        </div>
      `;
    }

    function renderRcaSidePanel(issue, topology, analysis){

      return `

            <button class="rca-icon-btn" type="button" data-assistant-mode="detailed">
              <span class="ico">📄</span><span>${esc(state.lang === 'ja' ? '詳細レポート' : 'Detailed')}</span>

          </button>
          <button class="btn subtle" type="button" data-action="open-conversation-remediation">
            ${esc(tr('openRemediationInChat'))}
          </button>
        </div>
      `;
    }

    function renderNodeLogDrawer(){
      if(!state.topologyLogsSelected) return '';
      const allNodes = state.topologyPayload?.topology?.nodes || [];
      const selectedNode = allNodes.find(n => n.id === state.topologyLogsSelected);
      const nodeName = selectedNode ? localizeNodeName(selectedNode, getSelectedIssue() || {}) : state.topologyLogsSelected;
      const sources = state.componentLogMeta?.sources || state.componentLogMeta?.component?.evidence_sources || selectedNode?.evidence_sources || [];
      const sourceButtons = (sources.length
        ? Array.from(new Map(sources.map(source => {
            const id = String(source?.id || source?.label || 'incident').toLowerCase();
            const label = source?.label || source?.id || (state.lang === 'ja' ? 'ローカル' : 'Local');
            const tone = id.includes('prom') ? 'prometheus' : id.includes('langfuse') ? 'langfuse' : 'aiops-local';
            return [id, `<button class="node-log-source-pill ${esc(tone)} ${state.componentLogSource === id ? 'active' : ''}" type="button" data-log-source="${esc(id)}">● ${esc(label)}</button>`];
          })).values()).join('')
        : [
            `<button class="node-log-source-pill prometheus ${state.componentLogSource === 'prometheus' ? 'active' : ''}" type="button" data-log-source="prometheus">● Prometheus</button>`,
            `<button class="node-log-source-pill langfuse ${state.componentLogSource === 'langfuse' ? 'active' : ''}" type="button" data-log-source="langfuse">● Langfuse</button>`,
          ].join(''));
      const sourcePills = `
        <button class="node-log-source-pill all ${state.componentLogSource === 'all' ? 'active' : ''}" type="button" data-log-source="all">${esc(state.lang === 'ja' ? '● すべて' : '● All')}</button>
        ${sourceButtons}
      `;
      const hasLogs = state.componentLogs.length > 0;
      const sourceTone = value => {
        const id = typeof value === 'string'
          ? String(value || '').toLowerCase()
          : inferredLogSource(value, state.topologyLogsSelected);
        if(id.includes('prom')) return 'prometheus';
        if(id.includes('langfuse')) return 'langfuse';
        return 'aiops-local';
      };
      const visibleLogs = state.componentLogSource === 'all'
        ? state.componentLogs
        : state.componentLogs.filter(log => sourceTone(log) === state.componentLogSource);
      const logSummary = !state.componentLogLoading && visibleLogs.length
        ? (state.lang === 'ja'
          ? `${visibleLogs.length} 件の関連ログを表示`
          : `Showing ${visibleLogs.length} related log entries`)
        : '';
      return `
        <div class="node-log-drawer">
          <div class="node-log-drawer-head">
            <div>
              <div class="node-log-drawer-title">
                ${esc(state.lang === 'ja' ? `Prometheus / Langfuse ログ — ${nodeName}` : `Prometheus / Langfuse logs — ${nodeName}`)}
              </div>
              <div class="node-log-drawer-copy">
                ${esc(state.lang === 'ja'
                  ? '上の VM コンポーネントをクリックすると、この欄に関連ログが表示されます。'
                  : 'Click any VM component above to inspect its related evidence below.')}
              </div>
            </div>
            <div class="node-log-sources">${sourcePills}</div>
          </div>
          ${logSummary ? `<div class="node-log-summary">${esc(logSummary)}</div>` : ''}
          <div class="node-log-drawer-body">
            ${state.componentLogLoading
              ? `<div class="node-log-empty">${esc(state.lang === 'ja'
                  ? `${state.componentLogSource === 'prometheus' ? 'Prometheus' : state.componentLogSource === 'langfuse' ? 'Langfuse' : ''} ログを読み込み中...`.trim()
                  : `Loading ${state.componentLogSource === 'prometheus' ? 'Prometheus ' : state.componentLogSource === 'langfuse' ? 'Langfuse ' : ''}logs...`)}</div>`
              : visibleLogs.length
              ? visibleLogs.slice(0, 50).map(log => `
                  <div class="node-log-row">
                    <span class="node-log-ts">${esc(formatLogTs(log.timestamp))}</span>
                    <span class="node-log-lvl ${esc(String(log.level || 'INFO').toLowerCase())}">${esc(String(log.level || 'INFO').toUpperCase())}</span>
                    <span class="node-log-origin ${esc(sourceTone(log))}">${esc(log.source_label || log.source || (sourceTone(log) === 'langfuse' ? 'Langfuse' : sourceTone(log) === 'prometheus' ? 'Prometheus' : (state.lang === 'ja' ? 'ローカル' : 'Local')))}</span>
                    <span class="node-log-msg">${esc(log.message || '')}</span>
                  </div>`).join('')
              : `<div class="node-log-empty">${esc(hasLogs
                  ? (state.componentLogSource === 'prometheus'
                    ? (state.lang === 'ja' ? 'このコンポーネントに Prometheus ログ / メトリクスはありません。' : 'No Prometheus logs or metrics were returned for this component.')
                    : state.componentLogSource === 'langfuse'
                    ? (state.lang === 'ja' ? 'このコンポーネントに Langfuse ログはありません。' : 'No Langfuse logs were returned for this component.')
                    : (state.lang === 'ja' ? 'このソースのログはありません。' : 'No logs were returned for this source.'))
                  : (state.lang === 'ja' ? 'ログを読み込み中...' : 'Loading logs…'))}</div>`
            }
          </div>
        </div>
      `;
    }

    function renderIssueDetail(){
      const issue = getSelectedIssue();
      if(!issue){
        return renderEmptyState(tr('noIssueTitle'), tr('noIssueCopy'));
      }
      if(state.loadingDetail || !state.topologyPayload){
        return renderLoadingState(tr('detailLoadingTitle'), tr('detailLoadingCopy'));
      }
      const topology = state.topologyPayload.topology || {};
      const analysis = state.topologyPayload.analysis || {};
      return `
        <div class="fit-scale-shell" data-fit-mode="issue-detail">
          <div class="fit-scale-content issue-detail-fit">
            <div class="detail-stack">
              <section class="detail-header">
                <div class="detail-header-main">
                  <div class="detail-nav" aria-label="${esc(tr('dashboardNavigation'))}">
                    <button class="detail-nav-pill" type="button" data-action="go-overview">${esc(tr('overview'))}</button>
                    <span class="detail-nav-sep">/</span>
                    <button class="detail-nav-pill" type="button" data-action="back-to-issues">${esc(tr('issues'))}</button>
                    <span class="detail-nav-sep">/</span>
                    <span class="detail-nav-pill current">#${issue.id}</span>
                  </div>
                  <div>
                    <div class="detail-kicker">${esc(tr('detailEyebrow'))}</div>
                    <h1 class="detail-title">#${issue.id} ${esc(titleOf(issue))}</h1>
                    <div class="chips">
                      <span class="chip ${severityBadgeClass(issue.severity)}">${esc(sevText(issue.severity))}</span>
                      <span class="chip ${statusBadgeClass(issue.status)}">${esc(statusText(issue.status))}</span>
                      <span class="chip primary-point">${esc(`${tr('primaryPoint')}: ${primaryIncidentPointOf(issue)}`)}</span>
                      <span class="chip">${esc(`${tr('createdOn')}: ${formatIssueDate(issue.created_at)}`)}</span>
                    </div>
                  </div>
                </div>
                <div class="detail-actions">
                  <button class="btn subtle" type="button" data-action="back-to-issues">${esc(tr('backToIssues'))}</button>
                  <button class="btn" type="button" data-action="open-conversation" data-conversation-issue-id="${issue.id}">${esc(tr('chatView'))}</button>
                  <button class="btn primary" type="button" data-action="open-conversation-remediation">${esc(tr('openRemediationInChat'))}</button>
                </div>
              </section>

              <section class="section-card">
                <div class="section-head">
                  <div>
                    <h2 class="section-title">${esc(tr('visualFlowTitle'))}</h2>
                    <p class="section-copy">${esc(tr('visualFlowCopy'))}</p>
                  </div>
                </div>
                ${renderVisualFlow(topology, issue)}
              </section>
            </div>
          </div>
        </div>

        ${state.chatPanelOpen ? renderAssistantModal() : ''}
      `;
    }

    function applyViewportFit(){
      const shells = Array.from(document.querySelectorAll('[data-fit-mode]'));
      shells.forEach(shell => {
        const content = shell.querySelector('.fit-scale-content');
        if(!content) return;

        content.style.transform = 'scale(1)';

        const availableWidth = Math.floor(shell.clientWidth);
        const availableHeight = Math.floor(shell.clientHeight);
        if(!availableWidth || !availableHeight) return;

        content.style.width = `${availableWidth}px`;

        const naturalWidth = Math.ceil(content.scrollWidth);
        const naturalHeight = Math.ceil(content.scrollHeight);
        if(!naturalWidth || !naturalHeight) return;

        const widthScale = availableWidth / naturalWidth;
        const heightScale = availableHeight / naturalHeight;
        const scale = Math.min(1, widthScale, heightScale);

        content.style.transform = `scale(${scale})`;
      });
    }

    function scheduleViewportFit(){
      if(state.fitRaf){
        cancelAnimationFrame(state.fitRaf);
      }
      state.fitRaf = requestAnimationFrame(() => {
        state.fitRaf = 0;
        applyViewportFit();
      });
    }

    function renderContent(){
      if(state.loadingIssues){
        return renderLoadingState(tr('loadingTitle'), tr('loadingCopy'));
      }
      if(state.currentPage === 'home'){
        return renderHome();
      }
      if(state.currentPage === 'overview'){
        return renderOverview();
      }
      if(state.currentPage === 'issues' && state.selectedIssueId){
        return renderIssueDetail();
      }
      return renderIssuesList();
    }

    function shouldFitViewport(){
      if(window.innerWidth <= 1180) return false;
      if(state.currentPage === 'issues') return true;
      if(state.currentPage === 'overview') return true;
      return false;
    }

    function applySidebarState(){
      const shell = document.getElementById('appShell');
      shell.classList.toggle('collapsed', state.sidebarCollapsed);
      shell.classList.toggle('fit-page', shouldFitViewport());
      document.body.classList.toggle('fit-page-body', shouldFitViewport());
      localStorage.setItem('opsSidebarCollapsed', state.sidebarCollapsed ? '1' : '0');
    }

    function renderText(){
      document.documentElement.lang = state.lang;
      document.title = tr('pageTitle');
      document.getElementById('brandName').textContent = tr('brand');
      document.getElementById('brandMark').textContent = tr('mark');
      document.getElementById('brandSubtitle').textContent = tr('subtitle');
      document.getElementById('liveText').textContent = tr('live');
      document.getElementById('viewSwitchBtn').textContent = tr('switchToChat');
      document.getElementById('langBtn').textContent = tr('lang');
      document.getElementById('sidebarToggle').setAttribute('aria-label', tr('toggleSidebar'));
      document.getElementById('sidebarToggle').setAttribute('title', tr('toggleSidebar'));
    }

    function render(){
      const focusState = captureFocusState();
      renderText();
      applySidebarState();
      renderSidebar();
      document.getElementById('content').innerHTML = renderContent();
      syncDashboardUrl();
      restoreFocusState(focusState);
      syncAssistantScroll();
      scheduleViewportFit();
    }

    function renderIssuesWorkspace(){
      const content = document.getElementById('content');
      if(!content || state.loadingIssues || state.currentPage !== 'issues' || state.selectedIssueId){
        render();
        return;
      }
      const focusState = captureFocusState();
      content.innerHTML = renderIssuesList();
      restoreFocusState(focusState);
      syncAssistantScroll();
      scheduleViewportFit();
    }

    function captureFocusState(){
      const active = document.activeElement;
      if(!active || !active.id) return null;
      if(active.id !== 'issue-search' && active.id !== 'assistant-draft') return null;
      return {
        id: active.id,
        start: typeof active.selectionStart === 'number' ? active.selectionStart : null,
        end: typeof active.selectionEnd === 'number' ? active.selectionEnd : null,
      };
    }

    function restoreFocusState(focusState){
      if(!focusState) return;
      const target = document.getElementById(focusState.id);
      if(!target) return;
      target.focus();
      if(focusState.start != null && focusState.end != null && typeof target.setSelectionRange === 'function'){
        target.setSelectionRange(focusState.start, focusState.end);
      }
    }

    function syncAssistantScroll(){
      if(!state.chatPanelOpen) return;
      requestAnimationFrame(() => {
        const chatBody = document.querySelector('.assistant-modal-body');
        if(chatBody){
          chatBody.scrollTop = chatBody.scrollHeight;
        }
      });
    }

    document.getElementById('sidebarToggle').addEventListener('click', () => {
      state.sidebarCollapsed = !state.sidebarCollapsed;
      applySidebarState();
    });

    document.getElementById('viewSwitchBtn').addEventListener('click', () => {
      goToConversationView(state.chatPanelOpen ? 'rca' : 'issue');
    });

    document.getElementById('langBtn').addEventListener('click', async () => {
      const preserveDetail = !!state.selectedIssueId;
      state.lang = state.lang === 'ja' ? 'en' : 'ja';
      await loadIssues({preserveDetail});
    });

    window.addEventListener('resize', () => {
      applySidebarState();
      scheduleViewportFit();
    });

    document.getElementById('sidebar').addEventListener('click', event => {
      const nav = event.target.closest('[data-nav]');
      if(!nav) return;
      switchPage(nav.dataset.nav);
    });

    document.getElementById('content').addEventListener('click', event => {
      const conversationButton = event.target.closest('[data-action="open-conversation"]');
      if(conversationButton){
        openConversation(Number(conversationButton.dataset.conversationIssueId));
        return;
      }
      const dashboardButton = event.target.closest('[data-action="open-dashboard"]');
      if(dashboardButton){
        openIssue(Number(dashboardButton.dataset.dashboardIssueId));
        return;
      }
      const issueButton = event.target.closest('[data-issue-id]');
      if(issueButton){
        openIssue(Number(issueButton.dataset.issueId));
        return;
      }
      const groupButton = event.target.closest('[data-node-group]');
      if(groupButton){
        selectTopologyGroup(groupButton.dataset.nodeGroup);
        return;
      }
      const backButton = event.target.closest('[data-action="back-to-issues"]');
      if(backButton){
        closeIssueDetail();
        return;
      }
      const overviewButton = event.target.closest('[data-action="go-overview"]');
      if(overviewButton){
        switchPage('overview');
        return;
      }
      const paneButton = event.target.closest('[data-detail-pane]');
      if(paneButton){
        state.detailPane = paneButton.dataset.detailPane || 'rca';
        render();
        return;
      }
      const nodeButton = event.target.closest('[data-node-id]');
      if(nodeButton){
        selectTopologyNode(nodeButton.dataset.nodeId);
        return;
      }
      const logSourceButton = event.target.closest('[data-log-source]');
      if(logSourceButton){
        requestLogSource(logSourceButton.dataset.logSource);
        return;
      }
      const nodeLogsButton = event.target.closest('[data-node-logs]');
      if(nodeLogsButton){
        toggleTopologyLogs(nodeLogsButton.dataset.nodeLogs);
        return;
      }
      const openChatButton = event.target.closest('[data-action="open-chat-panel"]');
      if(openChatButton){
        openChatPanel();
        return;
      }
      const openConversationRemediation = event.target.closest('[data-action="open-conversation-remediation"]');
      if(openConversationRemediation){
        goToConversationView('remediation');
        return;
      }
      const closeChatButton = event.target.closest('[data-action="close-chat-panel"]');
      if(closeChatButton){
        closeChatPanel();
        return;
      }
      const toggleFlowButton = event.target.closest('[data-action="toggle-flow-accordions"]');
      if(toggleFlowButton){
        const shouldOpen = !allFlowAccordionOpen();
        state.flowAccordion = {
          application: shouldOpen,
          activity: shouldOpen,
          failure: shouldOpen,
          evidence: shouldOpen,
        };
        render();
        return;
      }
      const assistantButton = event.target.closest('[data-assistant-mode]');
      if(assistantButton){
        submitAssistantQuery(assistantButton.dataset.assistantMode);
      }
    });

    document.getElementById('content').addEventListener('toggle', event => {
      const accordion = event.target.closest('[data-flow-section]');
      if(!accordion) return;
      const section = accordion.dataset.flowSection;
      state.flowAccordion[section] = accordion.open;
    }, true);

    document.getElementById('content').addEventListener('input', event => {
      if(event.target.id === 'issue-search'){
        state.searchQuery = event.target.value;
        renderIssuesWorkspace();
        return;
      }
      if(event.target.id === 'assistant-draft'){
        state.assistantDraft = event.target.value;
      }
    });

    document.getElementById('content').addEventListener('change', event => {
      if(event.target.id === 'status-filter'){
        state.statusFilter = event.target.value;
        renderIssuesWorkspace();
        return;
      }
      if(event.target.id === 'severity-filter'){
        state.severityFilter = event.target.value;
        renderIssuesWorkspace();
      }
    });

    document.getElementById('content').addEventListener('keydown', event => {
      const issueCard = event.target.matches('.issue-card[data-issue-id]') ? event.target : null;
      if(issueCard && (event.key === 'Enter' || event.key === ' ')){
        event.preventDefault();
        openIssue(Number(issueCard.dataset.issueId));
        return;
      }
      if(event.target.id === 'assistant-draft' && event.key === 'Enter'){
        event.preventDefault();
        submitAssistantQuery('custom');
      }
    });

    loadIssues();
    loadOverview();
    loadAppHealth();
  </script>
</body>
</html>
