<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIOPS Dashboard</title>
  <style>
    :root{
      --bg:#eef3f8;
      --panel:#ffffff;
      --panel-soft:#f7faff;
      --panel-muted:#edf3fb;
      --ink:#10233f;
      --muted:#5d6c82;
      --line:#d2dceb;
      --line-strong:#b8c7db;
      --blue:#2364d2;
      --blue-soft:#e7f0ff;
      --green:#1c8a58;
      --green-soft:#e9f8ef;
      --amber:#c27a12;
      --amber-soft:#fff4df;
      --red:#d14b59;
      --red-soft:#fff0f2;
      --shadow:0 22px 52px rgba(29,49,84,.10);
      --sidebar-width:280px;
      --sidebar-collapsed-width:86px;
      --radius-lg:24px;
      --radius-md:18px;
      --radius-sm:14px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:
        radial-gradient(circle at top left, rgba(35,100,210,.14), transparent 24%),
        radial-gradient(circle at 85% 10%, rgba(194,122,18,.10), transparent 22%),
        radial-gradient(circle at bottom right, rgba(28,138,88,.10), transparent 20%),
        var(--bg);
      color:var(--ink);
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
      font-size:14px;
      line-height:1.55;
    }

    button,input,select{font:inherit}
    h1,h2,h3,p{margin:0}

    .topbar{
      position:sticky;
      top:0;
      z-index:30;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      height:72px;
      padding:0 24px;
      border-bottom:1px solid rgba(184,199,219,.68);
      background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(247,250,255,.9));
      backdrop-filter:saturate(180%) blur(14px);
      box-shadow:0 10px 24px rgba(16,35,63,.05);
    }

    .topbar-left,.topbar-right,.brand{display:flex;align-items:center;gap:14px}
    .brand-mark{
      width:40px;
      height:40px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,#10233f 0%,#2364d2 58%,#4a9eff 100%);
      color:#fff;
      font-weight:900;
      letter-spacing:.03em;
      box-shadow:0 14px 24px rgba(35,100,210,.26);
    }

    .brand-copy{display:grid;gap:2px}
    .brand-title{font-size:16px;font-weight:850}
    .brand-subtitle{font-size:12px;color:var(--muted);font-weight:600}

    .btn,.icon-btn,.nav-item,.chip{
      border:1px solid transparent;
      transition:background .2s ease,border-color .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease,opacity .2s ease;
    }

    .btn,.icon-btn{
      cursor:pointer;
      background:var(--panel);
      color:var(--ink);
      border-color:var(--line);
    }

    .btn{
      min-height:40px;
      padding:10px 14px;
      border-radius:12px;
      font-weight:750;
    }

    .btn:hover,.icon-btn:hover{border-color:var(--line-strong);background:#fcfdff}
    .btn.primary{
      background:linear-gradient(135deg,#2364d2,#3a7cf1);
      border-color:#2364d2;
      color:#fff;
      box-shadow:0 12px 22px rgba(35,100,210,.22);
    }
    .btn.primary:hover{background:linear-gradient(135deg,#1e57bd,#2f72ea);border-color:#1e57bd}

    .btn.subtle{
      background:var(--panel-soft);
      border-color:var(--line);
      color:var(--muted);
    }

    .icon-btn{
      width:42px;
      height:42px;
      border-radius:12px;
      display:grid;
      place-items:center;
      font-size:18px;
      font-weight:800;
    }

    .live-pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:linear-gradient(180deg,#effaf3,#e5f8ee);
      color:var(--green);
      border:1px solid #bfe7ce;
      font-size:12px;
      font-weight:850;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    .status-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:currentColor;
      box-shadow:0 0 0 4px rgba(21,128,61,.12);
    }

    .app-shell{
      display:grid;
      grid-template-columns:var(--sidebar-width) minmax(0,1fr);
      min-height:calc(100vh - 72px);
      transition:grid-template-columns .28s ease;
    }

    .app-shell.collapsed{
      grid-template-columns:var(--sidebar-collapsed-width) minmax(0,1fr);
    }

    .sidebar{
      position:sticky;
      top:72px;
      height:calc(100vh - 72px);
      padding:20px 14px;
      border-right:1px solid rgba(184,199,219,.66);
      background:
        linear-gradient(180deg,rgba(247,250,255,.96),rgba(241,246,252,.92)),
        rgba(249,251,255,.92);
      backdrop-filter:saturate(160%) blur(10px);
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:18px;
      overflow:hidden;
    }

    .sidebar-section{display:grid;gap:10px}
    .sidebar-label{
      padding:0 10px;
      font-size:11px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#7b8698;
      transition:opacity .2s ease;
    }

    .nav-list{display:grid;gap:8px}
    .nav-item{
      width:100%;
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 14px;
      border-radius:16px;
      background:transparent;
      color:#334155;
      text-align:left;
      cursor:pointer;
      border-color:transparent;
    }

    .nav-item:hover{
      background:rgba(255,255,255,.9);
      border-color:rgba(184,199,219,.72);
      transform:translateY(-1px);
    }

    .nav-item.active{
      background:linear-gradient(180deg,#ffffff,#edf4ff);
      color:#0f172a;
      border-color:#c6d7ff;
      box-shadow:0 14px 26px rgba(35,100,210,.10);
    }

    .nav-icon{
      width:34px;
      height:34px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background:var(--panel);
      border:1px solid var(--line);
      font-size:15px;
      flex:0 0 auto;
    }

    .nav-copy{display:grid;gap:2px;min-width:0}
    .nav-title{font-weight:800;font-size:14px}
    .nav-desc{font-size:12px;color:var(--muted)}

    .sidebar-foot{
      display:grid;
      gap:10px;
      padding:14px;
      border:1px solid rgba(184,199,219,.72);
      border-radius:20px;
      background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(246,249,255,.78));
      transition:padding .2s ease;
    }

    .sidebar-foot strong{font-size:13px}
    .sidebar-foot span{font-size:12px;color:var(--muted)}

    .app-shell.collapsed .sidebar-label,
    .app-shell.collapsed .nav-copy,
    .app-shell.collapsed .sidebar-foot span,
    .app-shell.collapsed .sidebar-foot strong{
      opacity:0;
      pointer-events:none;
      height:0;
      overflow:hidden;
    }

    .app-shell.collapsed .nav-item{
      justify-content:center;
      padding:10px;
    }

    .app-shell.collapsed .sidebar-foot{
      padding:10px;
      place-items:center;
    }

    .content{
      padding:28px;
      min-width:0;
    }

    .view-shell{
      width:min(1320px,100%);
      margin:0 auto;
      display:grid;
      gap:22px;
      animation:fadeIn .26s ease;
    }

    .landing-shell{
      min-height:min(78vh,820px);
      display:grid;
      place-items:center;
      position:relative;
      overflow:hidden;
      border-radius:32px;
      border:1px solid rgba(184,199,219,.7);
      background:
        radial-gradient(circle at top right, rgba(35,100,210,.10), transparent 24%),
        radial-gradient(circle at bottom left, rgba(194,122,18,.08), transparent 20%),
        linear-gradient(180deg,rgba(255,255,255,.95),rgba(244,248,255,.9));
      box-shadow:var(--shadow);
      isolation:isolate;
    }

    .landing-shell::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(135deg, rgba(255,255,255,.36), transparent 38%),
        radial-gradient(circle at 50% 58%, rgba(35,100,210,.08), transparent 26%);
      pointer-events:none;
    }

    .landing-copy{
      position:relative;
      z-index:1;
      display:grid;
      gap:22px;
      justify-items:center;
      text-align:center;
      padding:48px 24px;
    }

    .landing-line{
      max-width:none;
      font-size:clamp(13px,1.35vw,18px);
      line-height:1.45;
      font-weight:600;
      letter-spacing:-.01em;
      color:#49627f;
      white-space:nowrap;
      margin-top:190px;
    }

    .landing-watermark{
      position:absolute;
      inset:50% auto auto 50%;
      transform:translate(-50%,-50%);
      font-size:clamp(180px,24vw,320px);
      line-height:1;
      font-weight:400;
      letter-spacing:-.08em;
      color:rgba(35,100,210,.10);
      text-shadow:0 12px 34px rgba(35,100,210,.05);
      pointer-events:none;
      user-select:none;
      z-index:0;
    }

    @keyframes fadeIn{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:none}
    }

    .hero-card,.section-card,.metric-card,.issue-card,.detail-hero,.node-card,.log-card,.assistant-card{
      background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(249,251,255,.92));
      border:1px solid rgba(184,199,219,.78);
      border-radius:var(--radius-lg);
      box-shadow:var(--shadow);
    }

    .hero-card,.section-card,.detail-hero,.assistant-card{padding:24px}
    .hero-card{
      display:grid;
      gap:16px;
      background:
        radial-gradient(circle at top right, rgba(35,100,210,.10), transparent 24%),
        radial-gradient(circle at bottom left, rgba(194,122,18,.08), transparent 20%),
        linear-gradient(135deg,rgba(255,255,255,.99),rgba(241,246,255,.96)),
        var(--panel);
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      background:linear-gradient(180deg,#f4f8ff,#edf4fb);
      color:#47617f;
      font-size:11px;
      font-weight:850;
      letter-spacing:.08em;
      text-transform:uppercase;
      width:max-content;
    }

    .hero-title{
      font-size:clamp(28px,3vw,38px);
      line-height:1.08;
      font-weight:900;
      letter-spacing:-.03em;
    }

    .hero-copy,.section-copy,.meta-copy,.empty-copy{
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
    }

    .metric-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:16px;
    }

    .metric-card{
      padding:22px;
      display:grid;
      gap:10px;
      min-height:170px;
      position:relative;
      overflow:hidden;
    }

    .metric-card::after{
      content:"";
      position:absolute;
      inset:auto -40px -40px auto;
      width:120px;
      height:120px;
      border-radius:50%;
      opacity:.12;
      background:currentColor;
    }

    .metric-card.open{color:var(--amber);background:linear-gradient(180deg,#fffaf0,var(--amber-soft))}
    .metric-card.resolved{color:var(--green);background:linear-gradient(180deg,#f6fdf8,var(--green-soft))}
    .metric-card.critical{color:var(--red);background:linear-gradient(180deg,#fff6f7,var(--red-soft))}

    .metric-label{
      font-size:12px;
      font-weight:850;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .metric-value{
      font-size:clamp(38px,4vw,48px);
      line-height:1;
      font-weight:900;
      color:var(--ink);
    }

    .metric-note{font-size:13px;color:#475467;max-width:30ch}

    .overview-grid{
      display:grid;
      grid-template-columns:1.2fr .8fr;
      gap:18px;
    }

    .section-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      margin-bottom:18px;
    }

    .section-title{
      font-size:20px;
      line-height:1.2;
      font-weight:850;
      letter-spacing:-.02em;
    }

    .stats-stack,.mini-list{display:grid;gap:12px}
    .mini-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      width:100%;
      padding:14px 16px;
      border-radius:16px;
      background:var(--panel-soft);
      border:1px solid var(--line);
      text-align:left;
    }

    button.mini-item{
      cursor:pointer;
    }

    button.mini-item:hover{
      border-color:#c4d5eb;
      background:#fcfdff;
      box-shadow:0 14px 24px rgba(24,44,83,.06);
    }

    .mini-item strong{display:block;font-size:14px}
    .mini-item span{display:block;font-size:12px;color:var(--muted)}

    .toolbar{
      display:grid;
      grid-template-columns:minmax(0,1fr) repeat(2,minmax(170px,220px));
      gap:12px;
      align-items:center;
      padding:18px;
      border-radius:22px;
      background:rgba(255,255,255,.76);
      border:1px solid rgba(195,207,221,.72);
      box-shadow:0 16px 30px rgba(15,23,42,.05);
    }

    .search-input,.filter-select,.assistant-input{
      width:100%;
      min-height:44px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fff;
      padding:0 14px;
      color:var(--ink);
    }

    .search-input:focus-visible,
    .filter-select:focus-visible,
    .assistant-input:focus-visible,
    .btn:focus-visible,
    .icon-btn:focus-visible,
    .nav-item:focus-visible{
      outline:3px solid #dbe8ff;
      outline-offset:2px;
    }

    .issue-list{
      display:grid;
      gap:14px;
    }

    .issue-card{
      padding:18px 20px;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:14px;
      cursor:pointer;
      text-align:left;
    }

    .issue-card:hover{
      transform:translateY(-1px);
      border-color:#c4d5eb;
      box-shadow:0 22px 38px rgba(24,44,83,.08);
    }

    .issue-title{
      font-size:17px;
      font-weight:850;
      line-height:1.3;
      letter-spacing:-.02em;
    }

    .issue-desc{margin-top:8px;color:var(--muted);line-height:1.65}

    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:12px;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      border-color:var(--line);
      background:#fff;
      color:#475467;
      font-size:12px;
      font-weight:800;
      letter-spacing:.02em;
    }

    .chip.open{background:var(--blue-soft);border-color:#bfd1ff;color:var(--blue)}
    .chip.escalated{background:var(--red-soft);border-color:#ecb4bd;color:var(--red)}
    .chip.resolved{background:var(--green-soft);border-color:#bfe2cb;color:var(--green)}
    .chip.sev-critical,.chip.sev-high{background:var(--red-soft);border-color:#ecb4bd;color:var(--red)}
    .chip.sev-medium{background:var(--amber-soft);border-color:#ebc987;color:var(--amber)}
    .chip.primary-point{background:var(--blue-soft);border-color:#bfd1ff;color:var(--blue)}

    .age-pill{
      align-self:flex-start;
      padding:8px 10px;
      border-radius:12px;
      background:var(--panel-soft);
      border:1px solid var(--line);
      font-size:12px;
      font-weight:800;
      color:#475467;
      white-space:nowrap;
    }

    .detail-hero{
      display:grid;
      gap:18px;
      background:
        linear-gradient(180deg,#ffffff,rgba(245,248,255,.96)),
        var(--panel);
    }

    .detail-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
    }

    .detail-title{
      font-size:clamp(26px,2.4vw,34px);
      font-weight:900;
      line-height:1.1;
      letter-spacing:-.03em;
    }

    .detail-meta{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:14px;
    }

    .meta-card{
      padding:16px;
      border-radius:18px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.88);
      min-width:0;
    }

    .meta-label{
      font-size:11px;
      font-weight:850;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#6b7280;
      display:block;
    }

    .meta-value{
      display:block;
      margin-top:8px;
      font-size:16px;
      font-weight:850;
      line-height:1.35;
      overflow-wrap:anywhere;
    }

    .detail-grid{
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:18px;
      align-items:start;
    }

    .detail-stack{
      display:grid;
      gap:14px;
    }

    .detail-header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
      padding:2px 2px 0;
    }

    .detail-kicker{
      font-size:11px;
      font-weight:850;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#6b7280;
    }

    .detail-header-copy{
      margin-top:8px;
      max-width:780px;
    }

    .flow-board{
      padding:16px;
      border-radius:22px;
      border:1px solid #d2e0f0;
      background:
        radial-gradient(circle at top right, rgba(35,100,210,.12), transparent 22%),
        radial-gradient(circle at bottom left, rgba(194,122,18,.08), transparent 18%),
        linear-gradient(180deg,#ffffff,#f5f9ff);
      display:grid;
      gap:12px;
      min-height:100%;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 16px 34px rgba(24,44,83,.06);
    }

    .flow-grid{
      display:grid;
      grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr) 30px minmax(0,1fr) 30px minmax(0,1fr);
      gap:10px;
      align-items:stretch;
    }

    .flow-stage{
      border:1px solid #d5e1ef;
      border-radius:20px;
      background:#fff;
      box-shadow:0 14px 24px rgba(20,38,70,.06);
      position:relative;
      overflow:hidden;
      min-width:0;
      padding:14px;
      display:grid;
      gap:12px;
      align-content:start;
    }

    .flow-stage.application{
      background:
        radial-gradient(circle at top right, rgba(35,100,210,.10), transparent 24%),
        linear-gradient(180deg,#f4f8ff,#ffffff 58%);
      border-color:#bfd2ff;
      color:#245cc2;
    }

    .flow-stage.activity{
      background:
        radial-gradient(circle at top right, rgba(194,122,18,.10), transparent 24%),
        linear-gradient(180deg,#fffaf2,#ffffff 58%);
      border-color:#ebd09a;
      color:#9a5800;
    }

    .flow-stage.failure{
      background:
        radial-gradient(circle at top right, rgba(208,58,90,.12), transparent 24%),
        linear-gradient(180deg,#fff3f6,#ffffff 58%);
      border-color:#e7a8b6;
      color:#b42336;
      box-shadow:0 0 0 2px rgba(180,35,54,.08), 0 18px 28px rgba(180,35,54,.10);
    }

    .flow-stage.evidence{
      background:
        radial-gradient(circle at top right, rgba(28,138,88,.10), transparent 24%),
        linear-gradient(180deg,#f4fbf7,#ffffff 58%);
      border-color:#bee0ca;
      color:#18794e;
    }

    .flow-stage::after{
      content:"";
      position:absolute;
      inset:auto -22px -28px auto;
      width:96px;
      height:96px;
      border-radius:50%;
      opacity:.14;
      background:currentColor;
      pointer-events:none;
    }

    .flow-step{
      display:inline-flex;
      align-items:center;
      gap:8px;
      width:max-content;
      padding:5px 9px;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--panel-soft);
      color:#475467;
      font-size:10px;
      font-weight:850;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .flow-stage-head{
      display:grid;
      gap:8px;
      min-width:0;
      position:relative;
      z-index:1;
    }

    .flow-stage-title{
      display:grid;
      gap:8px;
      min-width:0;
    }

    .flow-stage.application .flow-step{
      background:rgba(233,241,255,.95);
      border-color:#afc7ff;
      color:#1d4ed8;
    }

    .flow-stage.activity .flow-step{
      background:rgba(255,243,217,.92);
      border-color:#e8c273;
      color:#9a5800;
    }

    .flow-stage.failure .flow-step{
      background:rgba(255,232,238,.96);
      border-color:#efb2c0;
      color:#b42336;
    }

    .flow-stage.evidence .flow-step{
      background:rgba(234,248,239,.95);
      border-color:#acdbc0;
      color:#18794e;
    }

    .flow-stage h3{
      font-size:15px;
      color:#10233f;
      text-transform:none;
      letter-spacing:0;
      line-height:1.25;
    }

    .flow-connector{
      display:grid;
      place-items:center;
      align-self:center;
      position:relative;
      min-height:100%;
    }

    .flow-connector::before{
      content:"→";
      display:grid;
      place-items:center;
      width:28px;
      height:28px;
      border-radius:50%;
      border:1px solid #b7cbf6;
      background:linear-gradient(180deg,#ffffff,#eaf2ff);
      color:var(--blue);

      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .topology-component-flag{
      display:inline-flex;
      align-items:center;
      padding:5px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:850;
      letter-spacing:.02em;
      border:1px solid transparent;
    }

    .topology-component-flag.root{
      background:#ffe4ea;
      border-color:#efbcc6;
      color:#b42336;
    }

    .topology-component-flag.affected{
      background:#edf4ff;
      border-color:#c6d7ff;
      color:#1d4ed8;
    }

    .topology-evidence-column{
      display:grid;
      gap:12px;
      align-content:start;
    }

    .topology-evidence-head{
      border:1px solid #dbe5f1;
      border-radius:18px;
      background:linear-gradient(180deg,#ffffff,#f5f9ff);
      padding:14px;
      display:grid;
      gap:6px;
    }

    .topology-evidence-title{
      font-size:16px;
      font-weight:900;
      color:#10233f;
    }

    .topology-evidence-copy{
      font-size:12px;
      line-height:1.55;
      color:#526581;
    }

    .topology-evidence-grid{
      display:grid;
      gap:12px;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    }

    .topology-impact-ribbon{
      border:1px solid #efc0c8;
      border-radius:18px;
      background:#fff3f5;
      padding:12px 14px;
      font-size:13px;
      line-height:1.5;
      color:#8a2138;
    }

    .topology-inspector{
      padding:0;
      overflow:hidden;
    }

    .topology-inspector-head{
      padding:22px 22px 16px;
      border-bottom:1px solid #dbe5f1;
      display:grid;
      gap:6px;
      background:linear-gradient(180deg,#ffffff,#fafcff);
    }

    .topology-inspector-title{
      font-size:26px;
      font-weight:900;
      color:#10233f;
      line-height:1.15;
    }

    .topology-inspector-subtitle{
      font-size:14px;
      line-height:1.6;
      color:#526581;
    }

    .topology-inspector-body{
      padding:18px 22px 22px;
      display:grid;
      gap:16px;
    }

    .topology-source-row{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .topology-source-pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid #d6e1ed;
      background:#f8fbff;
      color:#35506f;
      font-size:12px;
      font-weight:800;
    }

    .topology-source-pill.prometheus{
      border-color:#bfd1ff;
      background:#edf4ff;
      color:#2364d2;
    }

    .topology-source-pill.langfuse{
      border-color:#d5c7ff;
      background:#f4efff;
      color:#5b4bc4;
    }

    .topology-source-pill.aiops-local,
    .topology-source-pill.incident{
      border-color:#dbe5f1;
      background:#f7f9fc;
      color:#526581;
    }

    .topology-cause-card{
      border:1px solid #efbcc6;
      border-radius:20px;
      background:linear-gradient(180deg,#fff4f6,#fffdfd);
      padding:16px;
      display:grid;
      gap:10px;
    }

    .topology-cause-kicker{
      width:max-content;
      padding:6px 10px;
      border-radius:999px;
      background:#ef5563;
      color:#fff;
      font-size:11px;
      font-weight:850;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    .topology-cause-title{
      font-size:18px;
      font-weight:900;
      line-height:1.3;
      color:#9f1239;
    }

    .topology-cause-copy{
      font-size:13px;
      line-height:1.7;
      color:#8a2138;
    }

    .topology-affects{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .topology-affects span{
      font-size:12px;
      font-weight:800;
      color:#8a2138;
    }

    .topology-affects .topology-component-flag{
      background:#ffd9df;
      border-color:#efbcc6;
      color:#9f1239;
    }

    .topology-inspector-section{
      display:grid;
      gap:10px;
    }

    .topology-section-title{
      font-size:12px;
      font-weight:850;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#667085;
    }

    .topology-metric-list,
    .topology-log-list{
      display:grid;
      gap:10px;
    }

    .topology-metric-row{
      display:grid;
      grid-template-columns:auto minmax(0,1fr) auto;
      gap:12px;
      align-items:start;
      border-bottom:1px solid #e6edf5;
      padding-bottom:10px;
    }

    .topology-metric-source{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:50px;
      padding:5px 8px;
      border-radius:999px;
      background:#edf4ff;
      color:#2364d2;
      font-size:11px;
      font-weight:850;
    }

    .topology-metric-name{
      font-size:13px;
      line-height:1.45;
      color:#3f536f;
    }

    .topology-metric-value{
      font-size:14px;
      font-weight:800;
      color:#10233f;
      text-align:right;
    }

    .topology-log-row{
      border:1px solid #dbe5f1;
      border-radius:16px;
      background:#fff;
      padding:12px;
      display:grid;
      gap:8px;
    }

    .topology-log-meta{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      font-size:11px;
      color:#667085;
      font-weight:800;
      letter-spacing:.03em;
    }

    .topology-log-message{
      font-size:13px;
      line-height:1.6;
      color:#10233f;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }

    .topology-detail-evidence{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    @media (max-width: 860px){
      .topology-detail-grid{
        grid-template-columns:1fr;
      }
    }

    .incident-focus-head{
      display:grid;
      gap:10px;
    }

    .incident-focus-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }

    .incident-focus-card{
      border:1px solid #d8e2ef;
      border-radius:16px;
      background:#fff;
      padding:12px;
      display:grid;
      gap:6px;
      min-width:0;
    }

    .incident-focus-card.primary{
      border-color:#e8a9b5;
      background:linear-gradient(180deg,#fff4f6,#fffafb 78%);
      box-shadow:0 12px 20px rgba(180,35,54,.08);
    }

    .incident-focus-title{
      font-size:11px;
      font-weight:850;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#667085;
    }

    .incident-focus-card.primary .incident-focus-title{
      color:#c2415a;
    }

    .incident-focus-value{
      font-size:17px;
      font-weight:900;
      color:#10233f;
      line-height:1.25;
      word-break:break-word;
    }

    .incident-focus-card.primary .incident-focus-value{
      color:#8a2138;
    }

    .incident-focus-copy{
      font-size:12px;
      color:#526581;
      line-height:1.45;
    }

    .incident-focus-path{
      border:1px dashed #d7e2ef;
      border-radius:16px;
      background:#fbfdff;
      padding:12px;
      display:grid;
      gap:6px;
    }

    .rca-preview{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:14px;
      align-items:stretch;
    }

    .rca-card{
      padding:18px;
      border-radius:18px;
      border:1px solid #d7e1ef;
      background:linear-gradient(180deg,#ffffff,#f7faff);
      display:grid;
      gap:8px;
      min-width:0;
      box-shadow:0 12px 24px rgba(24,44,83,.05);
    }

    .rca-card span{
      font-size:11px;
      font-weight:850;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#6b7280;
    }

    .rca-card strong{
      display:block;
      font-size:16px;
      line-height:1.45;
      overflow-wrap:anywhere;
      word-break:break-word;
    }

    .rca-card p{
      font-size:13px;
      line-height:1.65;
      color:var(--muted);
    }

    .chat-launch{
      min-width:180px;
      grid-column:1 / -1;
      justify-self:end;
      align-self:center;
    }

    .chat-modal-overlay{
      position:fixed;
      inset:0;
      z-index:80;
      background:rgba(15,23,42,.38);
      backdrop-filter:blur(6px);
      padding:92px 24px 28px;
      overflow:auto;
    }

    .chat-modal{
      width:min(860px,100%);
      margin:0 auto;
    }

    .assistant-modal-shell{
      background:
        radial-gradient(circle at top right, rgba(35,100,210,.10), transparent 24%),
        linear-gradient(180deg,#f2f7ff,#ffffff);
      border:1px solid #c5d5ef;
      border-radius:28px;
      box-shadow:0 30px 60px rgba(15,23,42,.24);
      overflow:hidden;
      display:grid;
      grid-template-rows:auto minmax(0,1fr) auto;
      min-height:min(760px,calc(100vh - 140px));
      max-height:calc(100vh - 140px);
    }

    .assistant-modal-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      padding:22px 24px 16px;
      border-bottom:1px solid rgba(201,216,255,.8);
    }

    .chat-close{
      width:42px;
      height:42px;
      border-radius:50%;
      border:1px solid #c5d5ef;
      background:linear-gradient(180deg,#ffffff,#f5f9ff);
      color:var(--blue);
      font-size:24px;
      line-height:1;
      display:grid;
      place-items:center;
      cursor:pointer;
      flex:0 0 auto;
    }

    .assistant-modal-body{
      padding:18px 24px;
      overflow:auto;
      display:grid;
      gap:16px;
      align-content:start;
      position:relative;
    }

    .assistant-modal-body.empty{
      align-content:center;
      justify-items:center;
      overflow:hidden;
    }

    .assistant-modal-body.empty::before{
      content:"助";
      position:absolute;
      inset:50% auto auto 50%;
      transform:translate(-50%,-56%);
      font-size:clamp(160px,22vw,280px);
      line-height:1;
      font-weight:400;
      color:rgba(35,100,210,.08);
      letter-spacing:-.08em;
      pointer-events:none;
      user-select:none;
      text-shadow:0 8px 28px rgba(35,100,210,.06);
    }

    .assistant-modal-compose{
      padding:18px 24px 24px;
      border-top:1px solid rgba(197,213,239,.8);
      display:grid;
      gap:14px;
      background:linear-gradient(180deg,rgba(242,247,255,.7),#edf3fb);
    }

    .node-layout{
      display:grid;
      gap:14px;
    }

    .node-group{
      padding:18px;
      border-radius:20px;
      border:1px solid var(--line);
      background:linear-gradient(180deg,#ffffff,#fbfcff);
      display:grid;
      gap:14px;
    }

    .node-group-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }

    .node-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
      gap:12px;
    }

    .node-card{
      padding:14px;
      text-align:left;
      cursor:pointer;
      border-radius:18px;
      display:grid;
      gap:8px;
      min-height:150px;
    }

    .node-card:hover{
      transform:translateY(-1px);
      border-color:#bfd1ff;
      box-shadow:0 14px 24px rgba(37,99,235,.08);
    }

    .node-card.active{
      border-color:#9fbcff;
      box-shadow:0 0 0 3px rgba(37,99,235,.12);
    }

    .node-card.ok{background:#fcfdfd}
    .node-card.warn{background:var(--amber-soft);border-color:#efcf95}
    .node-card.error{background:var(--red-soft);border-color:#f1b6b6}

    .node-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .node-title{
      font-size:15px;
      font-weight:850;
      line-height:1.3;
      overflow-wrap:anywhere;
    }

    .node-status{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:56px;
      padding:5px 8px;
      border-radius:999px;
      background:#fff;
      border:1px solid rgba(15,23,42,.08);
      font-size:10px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .flow-node.ok .node-status{
      background:var(--green-soft);
      border-color:#bfe2cb;
      color:var(--green);
    }

    .flow-node.warn .node-status{
      background:var(--amber-soft);
      border-color:#ebc987;
      color:var(--amber);
    }

    .flow-node.error .node-status{
      background:var(--red-soft);
      border-color:#ecb4bd;
      color:var(--red);
    }

    .node-copy{font-size:12.5px;color:#475467;line-height:1.6}
    .node-metrics{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
    .node-metric{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:5px 8px;
      border-radius:999px;
      background:rgba(255,255,255,.92);
      border:1px solid rgba(15,23,42,.08);
      font-size:11px;
      color:#475467;
    }

    .log-card{
      padding:14px;
      display:grid;
      gap:10px;
      background:linear-gradient(180deg,#ffffff,#f8fbff);
      border:1px solid #d5e1ef;
      box-shadow:0 14px 28px rgba(24,44,83,.05);
    }

    .log-stream{
      display:grid;
      gap:8px;
      max-height:300px;
      overflow:auto;
      padding-right:4px;
    }

    .log-row{
      display:grid;
      grid-template-columns:84px 62px minmax(0,1fr);
      gap:10px;
      padding:10px 12px;
      border-radius:14px;
      background:#0f172a;
      color:#e2e8f0;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:11px;
    }

    .log-row .ts{color:#7dd3fc}
    .log-row .lvl{font-weight:900;letter-spacing:.08em}
    .log-row .lvl.error,.log-row .lvl.critical{color:#fca5a5}
    .log-row .lvl.warn,.log-row .lvl.warning{color:#fde68a}
    .log-row .lvl.info{color:#86efac}
    .log-row .lvl.debug{color:#c4b5fd}
    .log-row .msg{line-height:1.65;word-break:break-word}

    .assistant-card{
      display:grid;
      gap:16px;
      background:linear-gradient(180deg,#eff5ff,#ffffff);
      border-color:#c9d8ff;
    }

    .assistant-tools{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .assistant-prompt{
      padding:8px 12px;
      border-radius:999px;
      border:1px solid #d6dce8;
      background:#fff;
      color:#334155;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 1px 2px rgba(15,23,42,.04);
    }

    .assistant-prompt:hover{
      border-color:#bfd1ff;
      background:#f8fbff;
      color:#1d4ed8;
    }

    .assistant-compose{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:10px;
    }

    .assistant-stream{
      display:grid;
      gap:12px;
    }

    .assistant-entry{
      display:grid;
      gap:8px;
    }

    .assistant-entry.user{justify-items:end}
    .assistant-meta{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:11px;
      font-weight:850;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#6b7280;
    }

    .assistant-entry.user .assistant-meta{justify-content:flex-end}

    .assistant-avatar{
      width:28px;
      height:28px;
      border-radius:50%;
      display:grid;
      place-items:center;
      color:#fff;
      font-size:11px;
      font-weight:900;
    }

    .assistant-avatar.assistant{background:var(--blue)}
    .assistant-avatar.user{background:#0f172a}

    .assistant-bubble{
      max-width:min(100%,860px);
      padding:14px 16px;
      border-radius:18px;
      border:1px solid rgba(195,207,221,.78);
      background:#fff;
    }

    .assistant-entry.user .assistant-bubble{
      background:#1d4ed8;
      color:#fff;
      border-color:#1d4ed8;
    }

    .assistant-bubble h3{
      font-size:12px;
      font-weight:850;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#6b7280;
      margin-bottom:10px;
    }

    .assistant-entry.user .assistant-bubble h3{color:#dbeafe}
    .assistant-bubble p{line-height:1.7}
    .assistant-bubble ul{margin:10px 0 0 18px;line-height:1.65}
    .assistant-bubble li + li{margin-top:6px}

    .empty-state,.loading-state{
      padding:44px 28px;
      border-radius:var(--radius-lg);
      border:1px dashed var(--line-strong);
      background:rgba(255,255,255,.7);
      text-align:center;
      display:grid;
      gap:12px;
      place-items:center;
    }

    .empty-title{
      font-size:20px;
      font-weight:850;
      letter-spacing:-.02em;
    }

    .spinner{
      width:22px;
      height:22px;
      border-radius:50%;
      border:3px solid #dbe4f1;
      border-top-color:var(--blue);
      animation:spin .8s linear infinite;
    }

    @keyframes spin{to{transform:rotate(360deg)}}

    .sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    @media (max-width:1100px){
      .overview-grid,.detail-grid{grid-template-columns:1fr}
      .toolbar{grid-template-columns:1fr}
      .flow-grid{grid-template-columns:1fr}
      .flow-connector{
        min-height:26px;
        padding-top:0;
        align-self:center;
      }
      .flow-connector::before{content:"↓"}
      .flow-connector::after{
        top:50%;
        width:1px;
        height:18px;
        background:linear-gradient(180deg,#d8c28b,#bcd2ff,#bfe1cb);
        transform:translate(-50%,-50%);
      }
      .incident-flow-top{grid-template-columns:1fr}
      .incident-focus-grid{grid-template-columns:1fr}
      .fault-map-top{grid-template-columns:1fr}
      .fault-map-bar-grid{grid-template-columns:1fr}
      .fault-map-evidence{justify-content:flex-start}
      .topology-workspace{grid-template-columns:1fr}
      .topology-canvas-frame{grid-template-columns:1fr}
      .rca-preview{grid-template-columns:1fr}
      .chat-launch{justify-self:start}
    }

    @media (max-width:860px){
      .app-shell,.app-shell.collapsed{grid-template-columns:1fr}
      .sidebar{
        position:static;
        height:auto;
        border-right:none;
        border-bottom:1px solid rgba(195,207,221,.72);
      }
      .app-shell.collapsed .sidebar-label,
      .app-shell.collapsed .nav-copy,
      .app-shell.collapsed .sidebar-foot span,
      .app-shell.collapsed .sidebar-foot strong{
        opacity:1;
        height:auto;
      }
      .app-shell.collapsed .nav-item{justify-content:flex-start;padding:12px 14px}
      .app-shell.collapsed .sidebar-foot{padding:14px;place-items:start}
      .content{padding:18px}
    }

    @media (max-width:640px){
      .topbar{padding:0 14px}
      .topbar-right{gap:10px}
      .hero-card,.section-card,.detail-hero,.assistant-card,.log-card{padding:18px}
      .content{padding:14px}
      .detail-top,.section-head{display:grid}
      .assistant-compose{grid-template-columns:1fr}
      .issue-card{grid-template-columns:1fr}
      .log-row{grid-template-columns:1fr}
      .chat-modal-overlay{padding:82px 12px 18px}
      .assistant-modal-head,.assistant-modal-body,.assistant-modal-compose{padding-left:16px;padding-right:16px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="sidebarToggle" type="button" aria-label="Toggle sidebar">☰</button>
      <div class="brand">
        <div class="brand-mark" id="brandMark">助</div>
        <div class="brand-copy">
          <div class="brand-title" id="brandName">Ops Assistant</div>
          <div class="brand-subtitle" id="brandSubtitle">Operations overview and incident detail</div>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="live-pill"><span class="status-dot"></span><span id="liveText">Live</span></div>
      <button class="btn" id="langBtn" type="button">English</button>
    </div>
  </header>

  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content">
      <div class="view-shell" id="content"></div>
    </main>
  </div>

  <script>
    const state = {
      lang: new URLSearchParams(location.search).get('lang') || 'ja',
      issues: [],
      currentPage: 'home',
      selectedIssueId: null,
      loadingIssues: true,
      loadingDetail: false,
      sidebarCollapsed: localStorage.getItem('opsSidebarCollapsed') === '1',
      searchQuery: '',
      statusFilter: '',
      severityFilter: '',
      topologyPayload: null,
      topologySelected: null,
      topologyLogsSelected: null,

    function tr(key){
      return (t[state.lang] && t[state.lang][key]) || key;

    function esc(value){
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function titleOf(issue){
      return state.lang === 'ja' ? (issue?.title_ja || issue?.title || '') : (issue?.title_en || issue?.title || '');
    }

    function descOf(issue){
      return state.lang === 'ja' ? (issue?.description_ja || issue?.description || '') : (issue?.description_en || issue?.description || '');
    }

    function appOf(issue){
      return state.lang === 'ja'
        ? (issue?.app_name_ja || issue?.app_display_name || issue?.app_name || '')
        : (issue?.app_display_name || issue?.app_name || '');
    }

    function cleanDisplayText(value, depth = 0){
      if(value == null || depth > 6) return '';
      const preferredKeys = ['analysis_summary','full_summary','likely_cause','reason','error_summary','summary','message','recommended_action','root_cause_chain','description','error_message'];
      const skipKeys = new Set(['trace_id','timestamp','confidence','processing_time_ms','raw_log_count','occurrence_count','total_logs_analyzed','data_sources','analysis_target','service','component']);
      const skipString = text => /^[a-f0-9]{24,}$/i.test(text) || /^[a-f0-9-]{30,}$/i.test(text);
      if(Array.isArray(value)){
        for(const item of value){
          const next = cleanDisplayText(item, depth + 1);
          if(next) return next;
        }
        return '';
      }
      if(typeof value === 'object'){
        for(const key of preferredKeys){
          const next = cleanDisplayText(value[key], depth + 1);
          if(next) return next;
        }
        for(const [key, item] of Object.entries(value)){
          if(skipKeys.has(key) || key.endsWith('_id') || key.endsWith('_ids') || key.includes('timestamp')) continue;
          const next = cleanDisplayText(item, depth + 1);
          if(next) return next;
        }
        return '';
      }
      const raw = String(value).trim();
      if(!raw || skipString(raw)) return '';
      if(raw.startsWith('{') || raw.startsWith('[')){
        try{
          return cleanDisplayText(JSON.parse(raw), depth + 1);
        }catch{
          return '';
        }
      }
      return raw.replace(/\s+/g, ' ').trim();
    }

    function analysisCauseOf(analysis){
      return state.lang === 'ja'

        : cleanDisplayText(analysis?.likely_cause_en || analysis?.likely_cause);

        : cleanDisplayText(analysis?.full_summary_en || analysis?.likely_cause_en || analysis?.likely_cause);

    function sevText(value){
      return ({critical:tr('critical'), high:tr('high'), medium:tr('medium')})[value] || value || '--';
    }

    function statusText(value){
      return ({OPEN:tr('open'), ESCALATED:tr('escalated'), RESOLVED:tr('resolved')})[value] || value || '--';
    }

    function age(value){
      if(!value) return '--';
      const diff = (Date.now() - new Date(value).getTime()) / 60000;
      if(diff < 60) return `${Math.max(1, Math.round(diff))}m`;
      if(diff < 1440) return `${Math.round(diff / 60)}h`;
      return `${Math.round(diff / 1440)}d`;
    }

    function shortenPlainText(text, max = 120){
      const clean = String(text || '').replace(/\s+/g, ' ').trim();
      if(!clean) return '--';
      if(clean.length <= max) return clean;
      return `${clean.slice(0, max - 1).trim()}…`;
    }

    function formatLogTs(ts){
      if(!ts) return '--';
      const date = new Date(String(ts).endsWith('Z') ? ts : `${ts}Z`);
      if(Number.isNaN(date.getTime())) return String(ts);
      return date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
    }

    function formatIssueDate(value){
      if(!value) return '--';
      const date = new Date(String(value).endsWith('Z') ? value : `${value}Z`);
      if(Number.isNaN(date.getTime())) return String(value);
      if(state.lang === 'ja'){
        return date.toLocaleDateString('ja-JP', {year:'numeric', month:'long', day:'numeric'});
      }
      return date.toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'});
    }

    function issueMeta(issue){
      const raw = issue?.metadata_json;
      if(!raw) return {};
      if(typeof raw === 'object') return raw;
      try { return JSON.parse(raw) || {}; } catch { return {}; }

    function issueMatchesQuery(issue){
      const query = state.searchQuery.trim().toLowerCase();
      const haystack = [
        issue.id,
        issue.app_name,
        appOf(issue),
        titleOf(issue),
        descOf(issue),
        issue.rule_id,
      ].join(' ').toLowerCase();
      return !query || haystack.includes(query);
    }

    function filteredIssues({ignoreStatus = false, ignoreSeverity = false} = {}){
      return state.issues.filter(issue =>
        issueMatchesQuery(issue)
        && (ignoreStatus || !state.statusFilter || issue.status === state.statusFilter)
        && (ignoreSeverity || !state.severityFilter || issue.severity === state.severityFilter)
      );
    }

    function issueFilterCounts(){
      const statusBase = filteredIssues({ignoreStatus:true});
      const severityBase = filteredIssues({ignoreSeverity:true});
      return {
        allStatus: statusBase.length,
        allSeverity: severityBase.length,
        status: {
          OPEN: statusBase.filter(issue => issue.status === 'OPEN').length,
          ESCALATED: statusBase.filter(issue => issue.status === 'ESCALATED').length,
          RESOLVED: statusBase.filter(issue => issue.status === 'RESOLVED').length,
        },
        severity: {
          critical: severityBase.filter(issue => issue.severity === 'critical').length,
          high: severityBase.filter(issue => issue.severity === 'high').length,
          medium: severityBase.filter(issue => issue.severity === 'medium').length,
        },
      };
    }

    function primaryIncidentPointOf(issue){
      const topology = issueMeta(issue)?.topology || {};
      const nodes = Array.isArray(topology.nodes) ? topology.nodes : [];
      const primary = nodes.find(node => node?.id === topology.default_component_id)
        || nodes.find(node => String(node?.status || '').toLowerCase() === 'error')
        || nodes.find(node => String(node?.status || '').toLowerCase() === 'warn')
        || nodes[0]
        || null;
      return primary?.name || primary?.service || primary?.process_name || appOf(issue) || issue?.app_name || '--';
    }

      const name = String(node?.name || node?.id || '').trim();
      const catalog = {

    function normalizeNode(node, idx){
      return {
        id: String(node?.id || `node-${idx + 1}`),
        name: node?.name || node?.process_name || node?.service || `Node ${idx + 1}`,
        zone: node?.zone || (idx === 0 ? 'platform' : 'runtime'),
        role: node?.role || '',
        status: ['ok','warn','error'].includes(node?.status) ? node.status : 'ok',
        summary: node?.summary || node?.error_message || node?.role || '',
        error_message: node?.error_message || '',
        metrics: Array.isArray(node?.metrics) ? node.metrics : [],
        logs: Array.isArray(node?.logs) ? node.logs : [],
        layout: node?.layout || null,
      };
    }

    function defaultNodesForIssue(issue){
      const severity = issue?.severity === 'critical' || issue?.severity === 'high' ? 'error' : issue?.severity === 'medium' ? 'warn' : 'ok';
      return [
        {id:'vm-host', name:'VM Host', zone:'platform', role:'Compute and OS scheduler', status:severity, summary:titleOf(issue), metrics:[], logs:[]},
        {id:'docker-runtime', name:'Docker Runtime', zone:'runtime', role:'Container runtime and isolation', status:severity === 'error' ? 'warn' : severity, summary:descOf(issue), metrics:[], logs:[]},
        {id:'ai-agent', name:appOf(issue), zone:'runtime', role:'Primary application service', status:severity, summary:descOf(issue), metrics:[], logs:[]},
        {id:'prometheus', name:'Prometheus', zone:'observability', role:'Metrics scraping and alerting', status:'ok', summary:'Monitoring path', metrics:[], logs:[]},
        {id:'langfuse', name:'Langfuse', zone:'observability', role:'Trace capture and LLM observability', status:'ok', summary:'Tracing path', metrics:[], logs:[]},
        {id:'pgvector', name:'PGVector DB', zone:'observability', role:'Stateful vector dependency', status:'ok', summary:'Dependency path', metrics:[], logs:[]},
      ];
    }

    function buildFallbackTopologyPayload(issue, errorMessage = ''){
      const meta = issueMeta(issue);
      const rawTopology = meta.topology || {};
      const nodes = (Array.isArray(rawTopology.nodes) && rawTopology.nodes.length ? rawTopology.nodes : defaultNodesForIssue(issue)).map(normalizeNode);
      const counts = {ok:0, warn:0, error:0};
      nodes.forEach(node => { counts[node.status] = (counts[node.status] || 0) + 1; });
      const defaultComponent = (nodes.find(node => node.status === 'error') || nodes.find(node => node.status === 'warn') || nodes[0] || {}).id || null;
      return {
        issue: {id: issue.id, app_name: issue.app_name, trace_id: issue.trace_id},
        analysis: {
          status: rawTopology.root_cause_chain || issue.description ? 'done' : 'missing',
          likely_cause: rawTopology.root_cause_chain || descOf(issue),
          recommended_action: rawTopology.recommended_action || (errorMessage ? `${tr('technicalView')}: ${errorMessage}` : ''),
          model_used: errorMessage ? 'local-fallback' : 'metadata-topology',
        },
        topology: {
          title: rawTopology.title || tr('runtimeTitle'),
          root_cause_chain: rawTopology.root_cause_chain || descOf(issue),
          recommended_action: rawTopology.recommended_action || '',
          nodes,
          metrics: Array.isArray(rawTopology.metrics) ? rawTopology.metrics : [],
          health_counts: counts,
          default_component_id: defaultComponent,
        },
      };
    }

    function buildIncidentStory(topology, issue, analysis){
      const nodes = (topology?.nodes || []).map(node => ({...node}));
      const appTokens = [String(issue?.app_name || '').toLowerCase(), String(appOf(issue) || '').toLowerCase()].filter(Boolean);
      const primary = nodes.find(node => node.id === topology?.default_component_id)
        || nodes.find(node => String(node?.status || '').toLowerCase() === 'error')
        || nodes.find(node => String(node?.status || '').toLowerCase() === 'warn')
        || nodes[0]
        || null;
      const hostNodes = nodes.filter(node => ['platform','host'].includes(String(node.zone || '').toLowerCase()));
      const agentNodes = nodes.filter(node => {
        const name = `${node.id} ${node.name}`.toLowerCase();
        return appTokens.some(token => token && name.includes(token)) || node.id === 'ai-agent' || name.includes('agent');
      });
      const componentNodes = nodes.filter(node => ['docker-runtime','pgvector'].includes(node.id) || /db|vector|runtime|container|postgres/.test(`${node.id} ${node.name}`.toLowerCase()));
      const observabilityNodes = nodes.filter(node => ['prometheus','langfuse'].includes(node.id) || /prometheus|langfuse|trace|observability|metric/.test(`${node.id} ${node.name}`.toLowerCase()));
      const unique = list => list.filter((node, index, self) => self.findIndex(other => other.id === node.id) === index);
      const applicationNodes = unique(agentNodes.length ? agentNodes : [primary].filter(Boolean));
      const activityNodes = unique([
        ...agentNodes,
        ...componentNodes.filter(node => !primary || node.id !== primary.id),
        ...hostNodes.filter(node => !primary || node.id !== primary.id),
      ]).slice(0, 4);
      const failureNodes = unique([
        primary,
        ...nodes.filter(node => ['error','warn'].includes(String(node?.status || '').toLowerCase()) && (!primary || node.id !== primary.id)),
      ].filter(Boolean)).slice(0, 3);
      const evidenceNodes = unique(observabilityNodes.length ? observabilityNodes : [
        ...nodes.filter(node => (Array.isArray(node?.metrics) && node.metrics.length) || (Array.isArray(node?.logs) && node.logs.length)),
        ...nodes.filter(node => /prometheus|langfuse|trace|metric/.test(`${node.id} ${node.name}`.toLowerCase())),
      ]).slice(0, 4);
      const applicationName = appOf(issue) || localizeNodeName(applicationNodes[0] || primary || {}, issue) || '--';
      const failureName = localizeNodeName(failureNodes[0] || primary || applicationNodes[0] || {}, issue) || applicationName;
      const evidenceNames = evidenceNodes.map(node => localizeNodeName(node, issue)).filter(Boolean).slice(0, 2);
      const causeText = topologyCauseOf(topology, analysis, issue);
      return {
        application: {
          title: state.lang === 'ja' ? 'アプリケーション' : 'Application',
          copy: state.lang === 'ja'
            ? `${applicationName} が今回の問題の対象サービスです。`
            : `${applicationName} is the application tied to this incident.`,
          nodes: applicationNodes.slice(0, 2),
        },
        host: hostNodes[0] || primary || null,
        activity: {
          title: state.lang === 'ja' ? '何をしていたか' : 'What it was doing',
          copy: state.lang === 'ja'
            ? 'この問題が見えた時に通っていた処理経路です。'
            : 'This is the path the application was using when the issue surfaced.',
          nodes: activityNodes.length ? activityNodes : applicationNodes,
        },
        failure: {
          title: state.lang === 'ja' ? 'どこで壊れたか' : 'Where it broke',
          copy: state.lang === 'ja'
            ? `${failureName} が今回の主な異常ポイントです。`
            : `${failureName} is the main break point for this incident.`,
          nodes: failureNodes.length ? failureNodes : applicationNodes,
        },
        evidence: {
          title: state.lang === 'ja' ? 'どこで証拠を見たか' : 'How we verified it',
          copy: state.lang === 'ja'
            ? `${evidenceNames.join(' / ') || '監視とトレース'} で根拠を確認できます。`
            : `Evidence is confirmed in ${evidenceNames.join(' / ') || 'monitoring and trace tools'}.`,
          nodes: evidenceNodes.length ? evidenceNodes : unique(nodes.filter(node =>
            !hostNodes.some(item => item.id === node.id)
            && !agentNodes.some(item => item.id === node.id)
            && !componentNodes.some(item => item.id === node.id)
          )).slice(0, 3),
        },
        summary: shortenPlainText(causeText, 180),
        extra: unique(nodes.filter(node =>
          !hostNodes.some(item => item.id === node.id)
          && !agentNodes.some(item => item.id === node.id)
          && !componentNodes.some(item => item.id === node.id)
          && !observabilityNodes.some(item => item.id === node.id)
        )),
      };
    }

    function buildImpactSummary(issue, topology, analysis){
      const impact = topology?.impact || {};
      const primary = (topology?.nodes || []).find(node => node.id === topology?.default_component_id)
        || (topology?.nodes || []).find(node => node.status === 'error')
        || (topology?.nodes || []).find(node => node.status === 'warn')
        || (topology?.nodes || [])[0]
        || null;
      const affectedApps = Array.isArray(impact.applications) && impact.applications.length ? impact.applications.filter(Boolean) : [appOf(issue)].filter(Boolean);
      const cause = topologyCauseOf(topology, analysis, issue);
      return {
        service: appOf(issue) || '--',
        status: statusText(issue?.status),
        severity: sevText(issue?.severity),
        source: primary ? localizeNodeName(primary, issue) : appOf(issue),
        cause: shortenPlainText(cause, 180),
        nextAction: shortenPlainText(topologyActionOf(topology, analysis) || (state.lang === 'ja' ? '安全な初動対応を確認してください。' : 'Review the safest next response.'), 180),
        affected: affectedApps.join(', ') || appOf(issue) || '--',
      };
    }

    function buildFiveWhys(issue, analysis){
      const cause = analysisCauseOf(analysis) || descOf(issue) || titleOf(issue);
      const action = analysisActionOf(analysis) || tr('nextAction');
      const symptom = descOf(issue) || titleOf(issue);
      const layer = appOf(issue);
      return state.lang === 'ja'
        ? [
            ['なぜ利用者に影響が出たのか？', `${layer} で ${symptom} が発生したためです。`],
            ['なぜその問題が起きたのか？', cause],
            ['なぜ影響が広がったのか？', '同じランタイム経路にある依存コンポーネントにも影響が及んだためです。'],
            ['なぜ特定できるのか？', 'Prometheus や Langfuse などのシグナルに裏付けが残っているためです。'],
            ['次に何をすべきか？', action],
          ]
        : [
            ['Why did users feel impact?', `${layer} surfaced the issue as: ${symptom}.`],
            ['Why did that happen?', cause],
            ['Why did it propagate?', 'Dependencies on the same runtime path were affected as the issue expanded.'],
            ['Why are we confident?', 'Operational evidence was preserved in monitoring and trace signals.'],
            ['What should happen next?', action],
          ];
    }

    function detectAssistantIntent(question){
      const text = String(question || '').trim().toLowerCase();
      if(!text) return 'general';
      if(/next step|action|recommend|fix|mitigat|resolve|対応|修正|対処|次/.test(text)) return 'action';
      if(/status|current|now|live|ongoing|resolved|still|状態|現在|ライブ/.test(text)) return 'status';
      if(/evidence|metric|metrics|log|logs|prometheus|proof|signal|trace|証拠|ログ|メトリクス/.test(text)) return 'evidence';
      if(/which service|what service|affected|impact|component|service|app|どの|サービス|影響/.test(text)) return 'service';
      if(/why|cause|root cause|reason|what happened|issue|problem|原因|なぜ|理由/.test(text)) return 'cause';
      return 'general';
    }

    function buildChatEvidence(live){
      return (live?.evidence || [])
        .map(item => cleanDisplayText(item?.summary || item?.query_name || item?.kind))
        .filter(Boolean)
        .slice(0, 6);
    }

    function buildAssistantChatText(question, issue, analysis, topology, live){
      const intent = detectAssistantIntent(question);
      const impact = buildImpactSummary(issue, topology, analysis);
      const cause = analysisCauseOf(analysis) || impact.cause || descOf(issue) || titleOf(issue);
      const action = analysisActionOf(analysis) || topologyActionOf(topology, analysis) || impact.nextAction;
      const evidence = buildChatEvidence(live);
      const liveHazard = (live?.evidence || []).some(item => ['warning','error','critical'].includes(String(item?.severity || '').toLowerCase()));

      if(intent === 'action'){
        return cleanDisplayText(action) || tr('noIssueSpecificAnswer');
      }
      if(intent === 'status'){
        if(state.lang === 'ja'){
          if(liveHazard) return `問題 #${issue.id} は ${impact.status} で、${impact.service} に対して現在も警告またはエラーのライブ証拠があります。`;
          if(evidence.length) return `問題 #${issue.id} は ${impact.status} で、現在のライブ証拠は正常または参考情報です。`;
          return `問題 #${issue.id} は ${impact.status} ですが、この時間枠では新しいライブ証拠は返っていません。`;
        }
        if(liveHazard) return `Issue #${issue.id} is ${impact.status}, and live evidence still shows an active warning or error affecting ${impact.service}.`;
        if(evidence.length) return `Issue #${issue.id} is ${impact.status}, and the current live evidence is informational or healthy.`;
        return `Issue #${issue.id} is ${impact.status}, but no new live evidence was returned in this window.`;
      }
      if(intent === 'evidence'){
        if(evidence.length){
          return state.lang === 'ja'
            ? `この問題に関連するライブ証拠は次のとおりです: ${evidence.join('; ')}`
            : `Live evidence tied to this issue: ${evidence.join('; ')}`;
        }
        return tr('noIssueSpecificAnswer');
      }
      if(intent === 'service'){
        if(state.lang === 'ja'){
          return `影響を受けているサービスは ${impact.service} です。現在の主要な影響経路では ${impact.source} が関連コンポーネントとして見えています。`;
        }
        return `The affected service is ${impact.service}. In the current impact path, ${impact.source} appears as the primary related component.`;
      }
      if(intent === 'cause'){
        return cleanDisplayText(cause) || tr('noIssueSpecificAnswer');
      }
      if(state.lang === 'ja'){
        return cleanDisplayText(analysisSummaryOf(analysis) || cause || action) || tr('noIssueSpecificAnswer');
      }
      return cleanDisplayText(analysisSummaryOf(analysis) || cause || action) || tr('noIssueSpecificAnswer');
    }

    async function loadIssues({preserveDetail = false} = {}){
      const previousId = preserveDetail ? state.selectedIssueId : null;
      state.loadingIssues = true;
      if(!preserveDetail){
        state.selectedIssueId = null;
        state.topologyPayload = null;
        state.topologySelected = null;
        state.topologyLogsSelected = null;
        state.componentLogs = [];
        state.componentLogMeta = null;
        state.assistantMessages = [];
        state.assistantDraft = '';
        clearComponentLogTimer();
      }
      render();
      try{
        const res = await fetch(`/api/issues?lang=${encodeURIComponent(state.lang)}`);
        if(!res.ok) throw new Error(await res.text());
        const data = await res.json();
        state.issues = data.issues || [];
        if(previousId && state.issues.some(issue => issue.id === previousId)){
          state.selectedIssueId = previousId;
          await loadSelectedTopology();
        } else if(previousId){
          state.selectedIssueId = null;
          state.topologyPayload = null;
          state.topologySelected = null;
          state.topologyLogsSelected = null;
          state.componentLogs = [];
          state.componentLogMeta = null;
        }
      } catch (error){
        state.issues = [];
        state.topologyPayload = null;
        state.topologySelected = null;
        state.topologyLogsSelected = null;
        state.componentLogMeta = null;
        state.componentLogs = [{timestamp:new Date().toISOString(), level:'ERROR', message:String(error.message || error)}];
      } finally {
        state.loadingIssues = false;
        render();
      }
    }

    async function loadSelectedTopology(){
      const issue = getSelectedIssue();
      if(!issue) return;
      try{
        const res = await fetch(`/api/topology/issues/${issue.id}?lang=${encodeURIComponent(state.lang)}`);
        if(!res.ok) throw new Error(await res.text());
        state.topologyPayload = await res.json();
      } catch (error){
        state.topologyPayload = buildFallbackTopologyPayload(issue, String(error.message || error));
      }
      state.topologySelected = null;
      state.topologyLogsSelected = null;
      state.componentLogs = [];
      state.componentLogMeta = null;
      state.chatPanelOpen = false;
      const defaultNodeId = state.topologyPayload?.topology?.default_component_id || null;
      if(defaultNodeId){
        state.topologySelected = defaultNodeId;
        state.topologyLogsSelected = defaultNodeId;
        await loadComponentLogs();
      }
    }

    async function loadComponentLogs(){
      clearComponentLogTimer();
      state.componentLogs = [];
      state.componentLogMeta = null;
      const issue = getSelectedIssue();
      if(!issue || !state.topologyLogsSelected) return;
      await refreshComponentLogs();
      if(issue.status !== 'RESOLVED'){
        state.componentLogTimer = setInterval(refreshComponentLogs, 5000);
      }
    }

    async function refreshComponentLogs(){
      const issue = getSelectedIssue();
      if(!issue || !state.topologyLogsSelected) return;
      try{
        const res = await fetch(`/api/topology/issues/${issue.id}/components/${encodeURIComponent(state.topologyLogsSelected)}/logs?limit=60&lang=${encodeURIComponent(state.lang)}`);
        if(!res.ok) throw new Error(await res.text());
        const data = await res.json();
        state.componentLogMeta = data;
        state.componentLogs = data.logs || [];
      } catch (error){
        const node = (state.topologyPayload?.topology?.nodes || []).find(item => item.id === state.topologyLogsSelected);
        const fallbackLogs = Array.isArray(node?.logs) ? node.logs : [];
        state.componentLogMeta = {
          component: {
            id: node?.id,
            name: node?.name,
            status: node?.status,
            summary: node?.summary,
            role: node?.role,
            evidence_sources: node?.evidence_sources || [],
          },
          sources: node?.evidence_sources || [],
        };
        state.componentLogs = fallbackLogs.length
          ? fallbackLogs
          : [{timestamp:new Date().toISOString(), level:'ERROR', message:String(error.message || error)}];
      }
      render();
    }

    async function selectTopologyNode(nodeId){
      if(!nodeId) return;
      if(state.topologySelected === nodeId && state.topologyLogsSelected === nodeId && state.componentLogs.length){
        return;
      }
      state.topologySelected = nodeId;
      state.topologyLogsSelected = nodeId;
      state.componentLogs = [];
      state.componentLogMeta = null;
      render();
      await loadComponentLogs();
    }

    async function toggleTopologyLogs(nodeId){
      if(state.topologySelected !== nodeId){
        state.topologySelected = nodeId;
      }
      if(state.topologyLogsSelected === nodeId){
        state.topologyLogsSelected = null;
        state.componentLogs = [];
        clearComponentLogTimer();
        render();
        return;
      }
      state.topologyLogsSelected = nodeId;
      render();
      await loadComponentLogs();
    }

    async function submitAssistantQuery(mode = 'custom'){
      const issue = getSelectedIssue();
      if(!issue) return;
      const draft = state.assistantDraft.trim();
      const userText = mode === 'custom' ? draft : '';
      const label = mode === 'custom' ? userText : ({summary:tr('quickSummary'), five:tr('quickFive'), detailed:tr('quickDetailed')})[mode];
      if(mode === 'custom' && !userText) return;
      state.assistantDraft = '';
      state.assistantMessages = [...state.assistantMessages, {role:'user', text:label}];
      state.assistantLoading = true;
      state.chatPanelOpen = true;
      render();
      const analysis = state.topologyPayload?.analysis || {};
      const topology = state.topologyPayload?.topology || {};
      try{
        let response;
        if(mode === 'five'){
          response = {role:'assistant', mode:'five', title:tr('quickFive'), items:buildFiveWhys(issue, analysis)};
        } else if(mode === 'detailed'){
          response = {
            role:'assistant',
            mode:'detailed',
            title:tr('detailedTitle'),
            cause:topologyCauseOf(topology, analysis, issue),
            action:topologyActionOf(topology, analysis) || tr('nextAction'),
            evidence:String(analysis.evidence || descOf(issue) || '').split('\n').map(item => item.trim()).filter(Boolean).slice(0, 6),
          };
        } else if(mode === 'summary'){
          response = {
            role:'assistant',
            mode:'summary',
            title:tr('summaryTitle'),
            summary:topologyCauseOf(topology, analysis, issue),
          };
        } else {
          const res = await fetch('/api/chat/rca/live', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
              issue_id: issue.id,
              message: userText,
              service: issue.app_name,
              root_candidate_service: issue.app_name,
              lang: state.lang,
            }),
          });
          const live = await res.json();
          const evidence = buildChatEvidence(live);
          response = {
            role:'assistant',
            mode:'chat',
            title:tr('chatAnswerTitle'),
            text:buildAssistantChatText(userText, issue, analysis, topology, live),
            evidence,
          };
        }
        state.assistantMessages = [...state.assistantMessages, response];
      } finally {
        state.assistantLoading = false;
        render();
      }
    }

    function logsForIncidentNode(node, overrideLogs = []){
      if(Array.isArray(overrideLogs) && overrideLogs.length){

      if(Array.isArray(node?.logs) && node.logs.length){
        return node.logs.slice(0, 4);
      }
      const metrics = Array.isArray(node?.metrics) ? node.metrics : [];
      if(metrics.length){
        return metrics.slice(0, 4).map(metric => ({
          timestamp: new Date().toISOString(),
          level: 'INFO',
          message: `${localizeMetricLabel(metric.label || metric.name || 'Metric')}: ${metric.value || '--'}`,

      `;

    function compactIncidentSegment(text, issue){
      const clean = String(text || '').replace(/\s+/g, ' ').trim();
      if(!clean) return '';
      const lower = clean.toLowerCase();
      const appName = String(appOf(issue) || '').trim();
      if(lower.includes('vm host') || lower.includes('host cpu') || lower.startsWith('vm ') || lower === 'host'){
        return state.lang === 'ja' ? 'VMホスト' : 'VM Host';
      }
      if(lower.includes('docker')){
        return state.lang === 'ja' ? 'Dockerランタイム' : 'Docker Runtime';
      }
      if(lower.includes('pgvector') || lower.includes('postgres')){
        return 'PGVector DB';
      }
      if(lower.includes('langfuse')){
        return 'Langfuse';
      }
      if(lower.includes('prometheus')){
        return 'Prometheus';
      }
      if(appName && lower.includes(appName.toLowerCase())){
        return appName;
      }
      return shortenPlainText(clean, 34);
    }

    function numericMetricValue(metric){
      const raw = String(metric?.value ?? '').replace(/,/g, '');
      const match = raw.match(/-?\d+(\.\d+)?/);
      return match ? Number(match[0]) : NaN;
    }

    function findMetric(node, matcher){
      const metrics = Array.isArray(node?.metrics) ? node.metrics : [];
      return metrics.find(metric => matcher(String(metric?.label || metric?.name || '').toLowerCase())) || null;
    }

    function toneForStatus(status){
      if(status === 'error') return 'error';
      if(status === 'warn') return 'warn';
      return 'ok';
    }

    function renderMetricBar(metric, fallbackLabel = '', tone = 'ok'){
      if(!metric) return '';
      const value = String(metric.value || '--');
      const widthValue = numericMetricValue(metric);
      const width = Number.isFinite(widthValue) ? Math.max(10, Math.min(Math.abs(widthValue), 100)) : 24;
      return `
        <div class="fault-map-bar">
          <div class="fault-map-bar-top">
            <span>${esc(metric.label || metric.name || fallbackLabel)}</span>
            <strong>${esc(value)}</strong>
          </div>
          <div class="fault-map-track"><div class="fault-map-fill ${esc(tone)}" style="width:${width}%"></div></div>
        </div>
      `;
    }

    function localizeZoneLabel(zone){
      const normalized = String(zone || '').toLowerCase();
      const labels = {
        platform: {en:'Platform', ja:'プラットフォーム'},
        host: {en:'Host', ja:'ホスト'},
        runtime: {en:'Runtime', ja:'ランタイム'},
        observability: {en:'Observability', ja:'可観測性'},
      };
      return labels[normalized]?.[state.lang] || (state.lang === 'ja' ? 'コンポーネント' : 'Component');
    }

    function renderTopologyMetricPill(node){
      const metric = (Array.isArray(node?.metrics) ? node.metrics : []).find(item => cleanDisplayText(item?.value || item?.label || item?.name))
        || null;
      if(metric){
        const tone = toneForStatus(String(node?.status || '').toLowerCase());
        return `<span class="fault-map-node-metric ${esc(tone)}">${esc(metric.label || metric.name || localizeMetricLabel('Status'))}: ${esc(metric.value || '--')}</span>`;
      }
      return `<span class="fault-map-node-metric ${esc(toneForStatus(String(node?.status || '').toLowerCase()))}">${esc(statusLabel(node?.status))}</span>`;
    }

    function renderTopologyNode(node, issue, activeId, failureId){
      const summary = shortenPlainText(nodeSummaryOf(node), 88);
      return `
        <button class="fault-map-node ${esc(node.status || 'ok')} ${activeId === node.id ? 'active' : ''}" type="button" data-node-id="${esc(node.id)}">

    function uniqueNodesById(list){
      return list.filter((node, index, self) => node && self.findIndex(other => other?.id === node.id) === index);

    function metricSnippetOf(node){
      const metric = findMetric(node, label => /cpu|latency|p99|memory|mem|tcp|status|severity|issue/.test(label))
        || (Array.isArray(node?.metrics) ? node.metrics[0] : null);
      if(metric){
        return `${localizeMetricLabel(metric.label || metric.name || 'Metric')}: ${metric.value || '--'}`;

    function renderTopologySourcePills(sources){

    function deriveFaultMap(topology, issue, analysis){
      const story = buildIncidentStory(topology, issue, analysis);
      const allNodes = uniqueNodesById((topology?.nodes || []).map(node => ({...node})));
      const projection = topology?.projection || {};
      const nodeMap = new Map(allNodes.map(node => [node.id, node]));
      const pickNodes = ids => uniqueNodesById((Array.isArray(ids) ? ids : []).map(id => nodeMap.get(id)).filter(Boolean));
      const pathNodes = pickNodes(projection.path_component_ids);
      const affectedNodes = pickNodes(projection.affected_component_ids);
      const evidenceNodes = pickNodes(projection.evidence_component_ids);
      const hostNode = pathNodes.find(node => ['platform', 'host'].includes(String(node?.zone || '').toLowerCase()))
        || allNodes.find(node => ['platform', 'host'].includes(String(node?.zone || '').toLowerCase()))
        || story.host
        || null;
      const rootNode = nodeMap.get(projection.root_component_id)
        || affectedNodes[0]
        || story.failure.nodes[0]
        || hostNode
        || null;
      const symptomNode = nodeMap.get(projection.symptom_component_id)
        || allNodes.find(node => node.id === topology?.default_component_id)
        || story.application.nodes[0]
        || rootNode
        || null;
      const runtimeNodes = uniqueNodesById(pathNodes.filter(node =>
        String(node?.zone || '').toLowerCase() === 'runtime'
        || /docker|runtime|container/.test(`${node?.id || ''} ${node?.name || ''}`.toLowerCase())
      ));
      const serviceNodes = uniqueNodesById([
        symptomNode,
        ...pathNodes.filter(node =>
          node
          && node.id !== hostNode?.id
          && !runtimeNodes.some(item => item.id === node.id)
          && !evidenceNodes.some(item => item.id === node.id)
          && String(node?.zone || '').toLowerCase() !== 'platform'
        ),
        ...allNodes.filter(node => /pgvector|postgres|db|vector/.test(`${node?.id || ''} ${node?.name || ''}`.toLowerCase())),
      ].filter(Boolean));
      const sourceNodes = uniqueNodesById([
        hostNode,
        rootNode,
        ...pathNodes.filter(node =>
          ['platform', 'host'].includes(String(node?.zone || '').toLowerCase())
          && node.id !== hostNode?.id
          && node.id !== rootNode?.id
        ),
      ].filter(Boolean));
      const visibleEvidenceNodes = evidenceNodes.length
        ? evidenceNodes
        : uniqueNodesById(story.evidence.nodes).slice(0, 2);
      const stackNodes = uniqueNodesById([
        ...runtimeNodes,
        symptomNode,
        ...serviceNodes.filter(node => node?.id !== symptomNode?.id),
        ...sourceNodes.filter(node => node?.id !== hostNode?.id),
      ].filter(Boolean));
      const selectedNode = nodeMap.get(state.topologySelected)
        || symptomNode
        || rootNode
        || hostNode
        || allNodes[0]
        || null;
      const pathList = pathNodes.length ? pathNodes : uniqueNodesById([rootNode, ...runtimeNodes, symptomNode].filter(Boolean));
      const pathSummary = pathList.map(node => compactIncidentSegment(localizeNodeName(node, issue), issue)).filter(Boolean).join(' -> ') || '--';
      return {
        hostNode,
        rootNode,
        symptomNode,
        runtimeNodes,
        serviceNodes,
        sourceNodes,
        visibleEvidenceNodes,
        stackNodes,
        selectedNode,
        pathSummary,
        affectedIds: new Set((projection.affected_component_ids || []).filter(Boolean)),
        pathIds: new Set((projection.path_component_ids || []).filter(Boolean)),
      };
    }

    function renderVisualFlow(topology, issue){
      const analysis = state.topologyPayload?.analysis || {};
      const map = deriveFaultMap(topology, issue, analysis);
      const selectedNode = map.selectedNode || map.symptomNode || map.rootNode || map.hostNode;
      const clusterTone = (map.symptomNode?.status || map.rootNode?.status || selectedNode?.status || 'ok');
      const health = topology?.health_counts || {};
      const sourceSignals = state.componentLogMeta?.sources || state.componentLogMeta?.component?.evidence_sources || selectedNode?.evidence_sources || [];
      const affectedNodes = uniqueNodesById([map.symptomNode, ...map.runtimeNodes].filter(node => node && node.id !== map.rootNode?.id));
      return `
        <div class="topology-sim-shell">
          <div class="topology-health">
