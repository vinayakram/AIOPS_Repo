<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>助手 | AIOps Chat</title>
<style>
:root {
  --bg:#f0f4f9; --rail:#fbfcfe; --panel:#ffffff;
  --border:#d1d9e8; --border2:#e8edf5;
  --ink:#0d1728; --muted:#5a6b82;
  --blue:#1d4ed8; --blue-bg:#eff4ff; --blue-line:#bfcffe;
  --green:#065f46; --green-bg:#ecfdf5; --green-line:#a7f3d0;
  --amber:#92400e; --amber-bg:#fffbeb; --amber-line:#fcd34d;
  --red:#991b1b; --red-bg:#fef2f2; --red-line:#fca5a5;
  --purple:#5b21b6; --purple-bg:#f5f3ff; --purple-line:#c4b5fd;
  --shadow:0 2px 8px rgba(13,23,40,.08);
  --radius:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",system-ui,sans-serif;font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

/* ── Layout ─────────────────────────────────── */
.app{height:100vh;display:grid;grid-template-columns:300px 1fr 360px}
.rail{background:var(--rail);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.detail{background:var(--rail);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}

/* ── Topbar ───────────────────────────────── */
.topbar{height:60px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;backdrop-filter:saturate(180%) blur(10px);flex-shrink:0;z-index:10}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#0d1728,#1d4ed8);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:900;flex-shrink:0}
.brand-name{font-size:15px;font-weight:800}
.brand-sub{font-size:11px;color:var(--muted)}
.topbar-right{display:flex;align-items:center;gap:10px}
.mcp-live-pill{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--purple-bg);border:1px solid var(--purple-line);color:var(--purple);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.mcp-live-dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.lang-btn{height:32px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--muted);font-size:13px}
.lang-btn:hover{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.session-state{font-size:11px;color:#94a3b8}

/* ── Rail ───────────────────────────────────── */
.rail-top{height:60px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
.rail-mark{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}
.rail-new-btn{width:30px;height:30px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--muted);font-size:16px;display:grid;place-items:center}
.rail-new-btn:hover{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.rail-actions{padding:10px 10px 0;display:grid;gap:4px;flex-shrink:0}
.rail-btn{height:38px;border:1px solid transparent;border-radius:9px;background:transparent;padding:0 10px;display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13px;text-align:left;width:100%}
.rail-btn:hover,.rail-btn.active{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.rail-section{padding:14px 14px 6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);flex-shrink:0}
.ticket-list{flex:1;overflow-y:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:4px}
.ticket{border:1px solid transparent;border-radius:9px;padding:10px;text-align:left;background:transparent;color:var(--ink);width:100%}
.ticket:hover,.ticket.selected{background:var(--blue-bg);border-color:var(--blue-line)}
.ticket-title{font-size:13px;font-weight:700;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket-meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:5px}
.sev-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0}
.sev-dot.critical{background:#dc2626}.sev-dot.high{background:#d97706}.sev-dot.medium{background:#2563eb}.sev-dot.low{background:#16a34a}

/* ── Chat area ──────────────────────────────── */
.chat-scroll{flex:1;overflow-y:auto;padding:20px 24px 0}
.chat-inner{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-bottom:20px}
.welcome{text-align:center;padding:48px 24px 32px}
.welcome-heading{font-size:26px;font-weight:850;letter-spacing:-.02em;margin-bottom:8px}
.welcome-sub{color:var(--muted);font-size:14px;margin-bottom:24px}
.quick-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.quick-chip{height:36px;padding:0 14px;border:1px solid var(--border);border-radius:999px;background:var(--panel);color:var(--muted);font-size:13px}
.quick-chip:hover{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}

/* ── Chat container ─────────────────────────── */
#chat{display:flex;flex-direction:column;gap:16px}

/* ── Message rows ───────────────────────────── */
.msg-row{display:flex;gap:10px;max-width:860px}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse;max-width:min(72%,680px)}
.msg-avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;flex-shrink:0;margin-top:2px}
.msg-avatar.assistant{background:var(--ink);color:#fff}
.msg-avatar.user{background:var(--blue);color:#fff}
.msg-body{flex:1;min-width:0}
.msg-row.user .msg-body{display:flex;justify-content:flex-end}
.user-bubble{background:var(--blue);color:#fff;border-radius:18px 18px 4px 18px;padding:10px 14px;font-size:14px;line-height:1.5;max-width:100%}
.assistant-content{display:flex;flex-direction:column;gap:10px}

/* ── Chat cards ─────────────────────────────── */
.chat-card{background:var(--panel);border:1px solid var(--border2);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.card-heading{font-size:16px;font-weight:800;margin-bottom:8px;line-height:1.35}
.card-sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.card-body{font-size:14px;line-height:1.65;color:#2d3748}
.chips-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-size:11px;font-weight:700;white-space:nowrap}
.chip.critical{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.chip.high{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.chip.medium{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-line)}
.chip.ok{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.chip.mcp{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-line)}
.chip.prometheus{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
.chip.langfuse{background:#faf5ff;color:#7e22ce;border-color:#e9d5ff}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn-primary{height:36px;padding:0 14px;border:0;border-radius:999px;background:var(--blue);color:#fff;font-size:13px;font-weight:700;box-shadow:0 1px 3px rgba(29,78,216,.3)}
.btn-primary:hover{background:#1e40af}
.btn-secondary{height:36px;padding:0 13px;border:1px solid var(--border);border-radius:999px;background:var(--panel);color:var(--muted);font-size:13px}
.btn-secondary:hover{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}

/* ── MCP Call Card ──────────────────────────── */
.mcp-call-card{background:var(--purple-bg);border:1px solid var(--purple-line);border-radius:var(--radius);overflow:hidden}
.mcp-call-header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--purple-line);background:rgba(245,243,255,.8)}
.mcp-badge-sm{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:var(--purple);color:#fff;font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase}
.mcp-tool-name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--purple);font-weight:600}
.mcp-status-text{margin-left:auto;font-size:11px;color:var(--muted)}
.mcp-call-body{padding:10px 14px}
.mcp-params{display:grid;gap:3px;margin-bottom:8px}
.mcp-param{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#4c1d95;background:rgba(139,92,246,.08);padding:3px 8px;border-radius:4px}
.mcp-result-text{font-size:13px;color:var(--ink);line-height:1.6;margin-bottom:8px}
.mcp-spinner{display:inline-block;width:8px;height:8px;border:2px solid var(--purple-line);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Evidence grid ──────────────────────────── */
.evidence-grid{display:grid;gap:7px}
.evidence-item{background:var(--panel);border:1px solid var(--border2);border-radius:10px;padding:9px 11px}
.evidence-item-head{display:flex;align-items:center;gap:5px;margin-bottom:4px;flex-wrap:wrap}
.evidence-label{font-size:12px;font-weight:700;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evidence-value{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted);background:#f1f5f9;padding:2px 5px;border-radius:4px;white-space:nowrap}
.evidence-summary{font-size:12px;color:var(--muted);line-height:1.5}

/* ── Topology mini ──────────────────────────── */
.topo-mini{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.topo-mini-header{padding:8px 12px;background:#f8fafc;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted)}
.topo-mini-nodes{padding:10px 12px;display:flex;flex-direction:column;gap:0}
.topo-mini-node{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);cursor:pointer;transition:box-shadow .15s}
.topo-mini-node:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.topo-mini-node.error{border-color:var(--red-line);background:var(--red-bg)}
.topo-mini-node.warn{border-color:var(--amber-line);background:var(--amber-bg)}
.topo-mini-node.ok{border-color:var(--green-line)}
.topo-mini-node-left{min-width:0}
.topo-mini-node-name{font-size:12px;font-weight:700}
.topo-mini-node-role{font-size:11px;color:var(--muted)}
.topo-mini-fault-badge{font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;background:#dc2626;color:#fff;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;flex-shrink:0;margin-left:8px}
.topo-mini-arrow{display:flex;justify-content:center;margin:1px 0}
.topo-mini-arrow-inner{display:flex;flex-direction:column;align-items:center}
.topo-mini-arrow-line{width:2px;height:14px;background:var(--green)}
.topo-mini-arrow-line.fault{background:repeating-linear-gradient(to bottom,#dc2626 0,#dc2626 3px,transparent 3px,transparent 6px)}
.topo-mini-arrow-head{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--green)}
.topo-mini-arrow-head.fault{border-top-color:#dc2626}
.topo-mini-obs-bar{display:flex;gap:7px;align-items:center;padding:7px 12px;border-top:1px solid var(--border);font-size:11px;background:#f8fafc}
.topo-mini-fault-path{padding:7px 12px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);background:#fef2f2}

/* ── RCA table ──────────────────────────────── */
.rca-table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;font-size:13px}
.rca-table th,.rca-table td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border)}
.rca-table th{width:140px;background:#f8fafc;color:var(--muted);font-weight:700;font-size:12px}
.rca-table tr:last-child th,.rca-table tr:last-child td{border-bottom:0}
.rca-table .cause-row th{background:var(--amber-bg)}
.rca-table .evidence-row th{background:var(--blue-bg)}
.rca-table .action-row th{background:var(--green-bg)}

/* ── Remediation steps ──────────────────────── */
.remed-steps{display:grid;gap:0;padding:6px 0}
.remed-step{display:flex;gap:12px;padding:0 0 16px;position:relative}
.remed-step:not(:last-child)::before{content:'';position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--border)}
.remed-step-dot{width:30px;height:30px;border-radius:50%;background:var(--border);border:2px solid var(--panel);display:grid;place-items:center;flex-shrink:0;font-size:12px;font-weight:900;color:var(--muted);z-index:1}
.remed-step-dot.active{background:var(--blue);color:#fff;border-color:var(--blue-line)}
.remed-step-dot.done{background:var(--green);color:#fff;border-color:var(--green-line)}
.remed-step-content{padding-top:4px}
.remed-step-title{font-size:13px;font-weight:700}
.remed-step-desc{font-size:12px;color:var(--muted);margin-top:2px}

/* ── Detail panel ───────────────────────────── */
.detail-top{height:60px;padding:0 14px;display:flex;align-items:center;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;color:var(--muted);gap:8px;flex-shrink:0}
.detail-scroll{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.detail-section{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.detail-section-head{padding:8px 12px;background:#f8fafc;border-bottom:1px solid var(--border);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.detail-section-body{padding:10px 12px}
.detail-metric-row{display:flex;align-items:flex-start;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border2);gap:8px}
.detail-metric-row:last-child{border-bottom:0}
.detail-metric-label{font-size:12px;color:var(--muted);flex-shrink:0}
.detail-metric-value{font-size:12px;font-weight:700;color:var(--ink);text-align:right;max-width:180px;line-height:1.4}
.detail-metric-value.error{color:#dc2626}
.detail-metric-value.warn{color:#d97706}
.detail-metric-value.ok{color:#065f46}

/* ── Forms ──────────────────────────────────── */
.form-grid{display:grid;grid-template-columns:120px 1fr;gap:7px 10px;align-items:center;margin-top:10px}
.form-grid label{font-size:12px;color:var(--muted);font-weight:700}
.form-grid input,.form-grid select{width:100%;height:34px;border:1px solid var(--border);border-radius:7px;background:var(--panel);padding:0 8px;font-size:13px}

/* ── Plan sections ──────────────────────────── */
.plan-block{display:grid;gap:7px;margin-top:8px}
.plan-section{border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--panel);font-size:13px}
.plan-section:nth-child(1){background:var(--amber-bg)}
.plan-section:nth-child(2){background:var(--blue-bg)}
.plan-section:nth-child(3){background:var(--green-bg)}
.plan-section h4{font-size:11px;font-weight:800;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.plan-section ul{padding-left:16px}
.plan-section li{margin-top:3px}

/* ── Composer ───────────────────────────────── */
.composer-wrap{flex-shrink:0;padding:10px 24px 14px;background:linear-gradient(180deg,rgba(240,244,249,0),var(--bg) 22%)}
.composer{max-width:860px;margin:0 auto;display:grid;grid-template-columns:38px 1fr 38px;align-items:center;background:var(--panel);border:1.5px solid var(--blue-line);border-radius:16px;padding:7px 9px;box-shadow:0 4px 20px rgba(29,78,216,.09)}
.composer-attach{width:32px;height:32px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);font-size:16px;display:grid;place-items:center}
.composer-attach:hover{background:var(--blue-bg);color:var(--blue)}
.composer-input{border:0;outline:0;background:transparent;font-size:14px;color:var(--ink);padding:0 8px}
.composer-input::placeholder{color:#94a3b8}
.composer-send{width:32px;height:32px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-size:14px;font-weight:900;display:grid;place-items:center;box-shadow:0 2px 6px rgba(29,78,216,.25)}
.composer-send:hover{background:#1e40af}

/* ── Utilities ──────────────────────────────── */
.hidden{display:none!important}
.empty-msg{color:var(--muted);font-size:13px;padding:12px;text-align:center}
.error-msg{color:#dc2626}
.spinner-inline{display:inline-block;width:8px;height:8px;border:2px solid #c7d7fe;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin-right:5px}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── Responsive ─────────────────────────────── */
@media(max-width:1100px){.app{grid-template-columns:280px 1fr 0}.detail{display:none}}
@media(max-width:780px){.app{grid-template-columns:0 1fr}.rail{display:none}.chat-scroll{padding:14px 14px 0}.composer-wrap{padding:8px 14px 12px}}
</style>
</head>
<body>
<div class="app">

  <!-- ── Left Rail ─────────────────────────── -->
  <aside class="rail">
    <div class="rail-top">
      <div class="rail-mark" id="rail-mark">助</div>
      <button class="rail-new-btn" onclick="newChat()" title="新しい相談">＋</button>
    </div>
    <div class="rail-actions">
      <button class="rail-btn" onclick="askOpenTickets()">
        <span>📋</span><span id="rb-tickets">未対応を見る</span>
      </button>
      <button class="rail-btn" onclick="askRCA()">
        <span>🔍</span><span id="rb-rca">原因を確認</span>
      </button>
      <button class="rail-btn" onclick="askRemediation()">
        <span>🛠</span><span id="rb-remed">対応を進める</span>
      </button>
    </div>
    <div class="rail-section" id="rail-section">最近の問題</div>
    <div class="ticket-list" id="ticket-list">
      <div class="empty-msg">読み込み中...</div>
    </div>
  </aside>

  <!-- ── Main ──────────────────────────────── -->
  <main class="main">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" id="brand-mark">助</div>
        <div>
          <div class="brand-name" id="brand-name">助手</div>
          <div class="brand-sub">AIOps chat · MCP observability</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="mcp-live-pill hidden" id="mcp-pill">
          <span class="mcp-live-dot"></span>
          <span>MCP</span>
        </div>
        <span class="session-state" id="session-state"></span>
        <button class="lang-btn" id="lang-btn" onclick="toggleLanguage()">English</button>
      </div>
    </header>

    <div class="chat-scroll" id="chat-scroll">
      <div class="chat-inner">
        <div id="welcome" class="welcome">
          <div class="welcome-heading" id="w-heading">こんにちは。助手です。</div>
          <div class="welcome-sub" id="w-sub">未対応の確認、MCPライブ証拠、原因分析、対応案まで一緒に進めます。</div>
          <div class="quick-chips">
            <button class="quick-chip" onclick="askOpenTickets()">📋 未対応を見る</button>
            <button class="quick-chip" onclick="askRCA()">🔍 原因を確認</button>
            <button class="quick-chip" onclick="askSummary()">📝 やさしく要約</button>
            <button class="quick-chip" onclick="askRemediation()">🛠 対応を進める</button>
          </div>
        </div>
        <div id="chat" class="hidden"></div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <button class="composer-attach" onclick="askOpenTickets()" title="問題一覧">📋</button>
        <input class="composer-input" id="chat-input"
          placeholder="例: なぜ起きたの？ / 対応を進めたい / show open issues"
          onkeydown="handleKey(event)">
        <button class="composer-send" onclick="send()">↑</button>
      </div>
    </div>
  </main>

  <!-- ── Detail Panel ───────────────────────── -->
  <aside class="detail">
    <div class="detail-top">
      <span>📌</span>
      <span id="detail-heading">問題の詳細</span>
    </div>
    <div class="detail-scroll" id="detail-scroll">
      <div class="empty-msg" id="detail-empty">左から問題を選ぶか、チャットで問題を指定してください。</div>
    </div>
  </aside>

</div>
<script>
'use strict';

/* ── Constants ──────────────────────────────── */
const SEV_RANK={critical:4,high:3,medium:2,low:1};
const SEV_JA={critical:'重大',high:'高',medium:'中',low:'低'};
const SEV_EN={critical:'Critical',high:'High',medium:'Medium',low:'Low'};
const ST_JA={OPEN:'未対応',ACKNOWLEDGED:'確認中',ESCALATED:'エスカレーション',RESOLVED:'解決済み'};
const ST_EN={OPEN:'Open',ACKNOWLEDGED:'Acknowledged',ESCALATED:'Escalated',RESOLVED:'Resolved'};
const RST_JA={
  PROJECT_REVIEW_PENDING:'対象確認待ち',PROJECT_APPROVED:'対応準備完了',
  PLAN_DRAFTING:'対応案作成中',PLAN_RUNNING:'対応案作成中',PLAN_DRAFTED:'対応案完成',
  PLAN_REVISED:'対応案更新',PLAN_REVISION_RUNNING:'対応案修正中',
  PLAN_APPROVED:'実装準備完了',IMPLEMENTATION_RUNNING:'実装中',
  IMPLEMENTATION_READY:'実装確認待ち',REVIEW_PENDING:'レビュー待ち',
  REVIEW_APPROVED:'レビュー承認済み',PR_CREATING:'PR作成中',PR_CREATED:'PR作成済み',FAILED:'失敗'
};
const RST_EN={
  PROJECT_REVIEW_PENDING:'Target review needed',PROJECT_APPROVED:'Target approved',
  PLAN_DRAFTING:'Creating plan',PLAN_RUNNING:'Creating plan',PLAN_DRAFTED:'Plan ready',
  PLAN_REVISED:'Plan updated',PLAN_REVISION_RUNNING:'Revising plan',
  PLAN_APPROVED:'Plan approved',IMPLEMENTATION_RUNNING:'Implementing',
  IMPLEMENTATION_READY:'Review ready',REVIEW_PENDING:'Review pending',
  REVIEW_APPROVED:'Review approved',PR_CREATING:'Creating PR',PR_CREATED:'PR created',FAILED:'Failed'
};

/* ── State ──────────────────────────────────── */
const P=new URLSearchParams(location.search);
let lang=(P.get('lang')||'ja').startsWith('en')?'en':'ja';
let currentIssue=null,currentAnalysis=null,currentTopology=null;
let ticketsCache=[],remediationStarted=false,chatProject={};

/* ── Helpers ────────────────────────────────── */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok){let m=await r.text();try{m=JSON.parse(m).detail||m}catch{}throw new Error(m)}return r.json();}
function t(ja,en){return lang==='ja'?ja:en}
function sevText(s){return lang==='ja'?(SEV_JA[s]||s):(SEV_EN[s]||s)}
function statusText(s){return lang==='ja'?(ST_JA[s]||s):(ST_EN[s]||s)}
function rStatusText(s){const raw=String(s||'').toUpperCase();return lang==='ja'?(RST_JA[raw]||s):(RST_EN[raw]||s)}
function sevClass(s){return s==='critical'?'critical':s==='high'?'high':s==='medium'?'medium':''}

function setMcp(on){const p=document.getElementById('mcp-pill');if(p)p.classList.toggle('hidden',!on)}
function setState(txt){const e=document.getElementById('session-state');if(e)e.textContent=txt}

function cleanText(v,d=0){
  if(v==null||d>5)return'';
  const pref=['analysis_summary','full_summary','likely_cause','reason','error_summary','summary','message','recommended_action','root_cause_chain','description','error_message'];
  const skip=new Set(['trace_id','timestamp','confidence','processing_time_ms','raw_log_count','occurrence_count','total_logs_analyzed','data_sources','analysis_target','service','component']);
  const skipS=s=>/^[a-f0-9]{24,}$/i.test(s)||/^[a-f0-9-]{30,}$/i.test(s);
  if(Array.isArray(v)){for(const i of v){const n=cleanText(i,d+1);if(n)return n}return''}
  if(typeof v==='object'){
    for(const k of pref){const n=cleanText(v[k],d+1);if(n)return n}
    for(const[k,i]of Object.entries(v)){if(skip.has(k)||k.endsWith('_id')||k.includes('timestamp'))continue;const n=cleanText(i,d+1);if(n)return n}
    return'';
  }
  const raw=String(v).trim();
  if(!raw||skipS(raw))return'';
  if(raw.startsWith('{')||raw.startsWith('[')){try{return cleanText(JSON.parse(raw),d+1)}catch{return''}}
  return raw.replace(/\s+/g,' ').trim();
}

function issueTitle(i){return cleanText(i?.title)||`#${i?.id||''}`}
function issueDesc(i){return cleanText(i?.description)||t('説明はありません。','No description available.')}
function issueApp(i){return cleanText(i?.app_display_name||i?.app_name)||t('対象サービス','Service')}
function analysisCause(a){return cleanText(a?.likely_cause)||cleanText(a?.likely_cause_ja)||''}
function analysisAction(a){return cleanText(a?.recommended_action)||cleanText(a?.recommended_action_ja)||''}
function prioritySort(a,b){return(SEV_RANK[b.severity]||0)-(SEV_RANK[a.severity]||0)||new Date(b.created_at||0)-new Date(a.created_at||0)}
function detectLang(text){if(!text)return lang;if(/[぀-ヿ㐀-鿿]/.test(text))return'ja';if((text.match(/[A-Za-z]/g)||[]).length>=4)return'en';return lang}

/* ── Chat ───────────────────────────────────── */
function hideWelcome(){document.getElementById('welcome').classList.add('hidden');document.getElementById('chat').classList.remove('hidden')}
function retireActions(){document.querySelectorAll('#chat .card-actions').forEach(el=>el.classList.add('hidden'))}
function scrollBottom(){const s=document.getElementById('chat-scroll');requestAnimationFrame(()=>{if(s)s.scrollTop=s.scrollHeight})}

function addMsg(kind,html){
  hideWelcome();
  if(kind==='agent')retireActions();
  const row=document.createElement('div');
  row.className='msg-row '+kind;
  const mark=lang==='ja'?'助':'A';
  if(kind==='user'){
    row.innerHTML=`<div class="msg-avatar user">${mark}</div><div class="msg-body"><div class="user-bubble">${html}</div></div>`;
  }else{
    row.innerHTML=`<div class="msg-avatar assistant">${mark}</div><div class="msg-body"><div class="assistant-content">${html}</div></div>`;
  }
  document.getElementById('chat').appendChild(row);
  scrollBottom();
  return row.querySelector(kind==='user'?'.user-bubble':'.assistant-content');
}

function newChat(){
  currentIssue=null;currentAnalysis=null;currentTopology=null;
  remediationStarted=false;chatProject={};
  document.getElementById('chat').innerHTML='';
  document.getElementById('chat').classList.add('hidden');
  document.getElementById('welcome').classList.remove('hidden');
  document.querySelectorAll('.ticket').forEach(el=>el.classList.remove('selected'));
  renderDetailPanel(null,null,null);
  setState(t('待機中','Idle'));
}

/* ── Chips ──────────────────────────────────── */
function sevChip(i){return`<span class="chip ${sevClass(i.severity)}">${esc(sevText(i.severity))}</span>`}
function statusChip(i){const c=i.status==='RESOLVED'?'ok':i.status==='ESCALATED'?'critical':'';return`<span class="chip ${c}">${esc(statusText(i.status))}</span>`}

/* ── Ticket list ────────────────────────────── */
async function loadTickets(silent=true){
  setState(t('確認中','Checking'));
  document.getElementById('ticket-list').innerHTML=`<div class="empty-msg">${t('読み込み中...','Loading...')}</div>`;
  try{
    const data=await api(`/api/issues?limit=200&lang=${lang}`);
    ticketsCache=(data.issues||[]).filter(i=>i.status!=='RESOLVED').sort(prioritySort);
    renderSidebarTickets();
    setState(ticketsCache.length?`${ticketsCache.length}${t('件',' issues')}`:t('問題なし','No issues'));
    if(!silent)showOpenTickets();
  }catch(e){
    document.getElementById('ticket-list').innerHTML=`<div class="empty-msg error-msg">${esc(e.message)}</div>`;
    setState(t('取得失敗','Failed'));
  }
}

function renderSidebarTickets(){
  const list=document.getElementById('ticket-list');
  if(!ticketsCache.length){list.innerHTML=`<div class="empty-msg">${t('未対応の問題はありません。','No open issues.')}</div>`;return}
  list.innerHTML=ticketsCache.slice(0,15).map(i=>`
    <button class="ticket" id="ticket-${i.id}" onclick="selectIssue(${i.id},{fromSidebar:true})">
      <div class="ticket-title">${esc(issueTitle(i))}</div>
      <div class="ticket-meta"><span class="sev-dot ${esc(i.severity)}"></span>${esc(sevText(i.severity))} · ${esc(issueApp(i))}</div>
    </button>`).join('');
}

/* ── Issue cards ────────────────────────────── */
function issueCard(i){
  return`<div class="chat-card">
    <div class="chips-row">${sevChip(i)}${statusChip(i)}</div>
    <div class="card-heading">${esc(issueTitle(i))}</div>
    <div class="card-sub">${esc(issueApp(i))} · #${i.id}</div>
    <div class="card-body">${esc(issueDesc(i))}</div>
    <div class="card-actions">
      <button class="btn-primary" onclick="selectIssue(${i.id})">${t('この問題を開く','Open issue')}</button>
      <button class="btn-secondary" onclick="selectIssue(${i.id}).then(()=>askRCA())">${t('原因を見る','See RCA')}</button>
      <button class="btn-secondary" onclick="selectIssue(${i.id}).then(()=>askRemediation())">${t('対応へ進む','Remediate')}</button>
    </div>
  </div>`;
}

function showOpenTickets(){
  if(!ticketsCache.length){addMsg('agent',`<div class="chat-card"><div class="card-body">${t('現在、対応が必要な問題はありません。','No open issues right now.')}</div></div>`);return}
  const shown=ticketsCache.slice(0,6);
  addMsg('agent',`
    <div class="card-heading">${t('未対応の問題','Open issues')}</div>
    <div class="card-sub">${t(`${ticketsCache.length}件。優先度順。`,`${ticketsCache.length} issues, priority order.`)}</div>
    ${shown.map(issueCard).join('')}
  `);
}

/* ── Issue selection ────────────────────────── */
async function selectIssue(id,opts={}){
  setState(`#${id}`);
  document.querySelectorAll('.ticket').forEach(el=>el.classList.remove('selected'));
  const card=document.getElementById(`ticket-${id}`);
  if(card)card.classList.add('selected');
  try{
    currentIssue=await api(`/api/issues/${id}?lang=${lang}`);
    currentAnalysis=null;currentTopology=null;
    await loadTopology(id);
    remediationStarted=false;chatProject={};
    if(opts.fromSidebar)addMsg('user',t(`#${id} を確認します`,`Inspecting issue #${id}`));
    addMsg('agent',selectedIssueHtml(currentIssue));
    renderDetailPanel(currentIssue,currentTopology,currentAnalysis);
    setState(`#${id}`);
    return currentIssue;
  }catch(e){addMsg('agent',`<div class="chat-card"><div class="card-body error-msg">${esc(e.message)}</div></div>`)}
}

function selectedIssueHtml(i){
  const topo=currentTopology?.topology||{};
  const cause=cleanText(topo.root_cause_chain)||issueDesc(i);
  const action=cleanText(topo.recommended_action)||'';
  return`
    <div class="card-heading">${t('問題を開きました','Issue opened')}</div>
    ${issueCard(i)}
    ${cause?`<div class="chat-card"><div class="card-body"><strong>${t('推定原因:','Likely cause:')}</strong> ${esc(cause)}</div>${action?`<div class="card-body" style="margin-top:6px"><strong>${t('推奨対応:','Recommended action:')}</strong> ${esc(action)}</div>`:''}</div>`:''}
    <div class="card-actions">
      <button class="btn-secondary" onclick="askSummary()">${t('要約','Summary')}</button>
      <button class="btn-secondary" onclick="askRCA()">${t('原因は？','Why?')}</button>
      <button class="btn-secondary" onclick="askRemediation()">${t('対応する','Remediate')}</button>
    </div>`;
}

/* ── Topology ───────────────────────────────── */
async function loadTopology(issueId){
  try{currentTopology=await api(`/api/topology/issues/${issueId}?lang=${lang}`)}
  catch{currentTopology=null}
}

function renderTopoMini(topology,issue){
  if(!topology||!Array.isArray(topology.nodes)||!topology.nodes.length)return'';
  const allNodes=topology.nodes;
  const pathIds=new Set(topology.projection?.path_component_ids||[]);
  const rootId=topology.projection?.root_component_id||'';
  const display=allNodes
    .filter(n=>!['prometheus','langfuse'].includes(n.id))
    .filter(n=>pathIds.size===0?(n.status!=='ok'):pathIds.has(n.id)||n.status==='error')
    .slice(0,5);
  if(!display.length)return'';

  const nodesHtml=display.map((node,i)=>{
    const isRoot=node.id===rootId;
    const prevFault=i>0&&(pathIds.has(display[i-1].id)||display[i-1].id===rootId);
    const metric=(node.metrics||[]).slice(0,1).map(m=>`<span style="font-size:10px;color:var(--muted)">${esc(m.label||'')} ${esc(m.value||'')}</span>`).join('');
    const arrow=i>0?`<div class="topo-mini-arrow"><div class="topo-mini-arrow-inner"><div class="topo-mini-arrow-line${prevFault?' fault':''}"></div><div class="topo-mini-arrow-head${prevFault?' fault':''}"></div></div></div>`:'';
    const statusLabel=isRoot?`<span class="topo-mini-fault-badge">${t('障害起点','Fault origin')}</span>`:`<span class="chip ${node.status||'ok'}" style="height:20px;font-size:10px">${esc(node.status==='error'?t('異常','Error'):node.status==='warn'?t('警告','Warn'):t('正常','OK'))}</span>`;
    return`${arrow}<div class="topo-mini-node ${esc(node.status||'ok')}"><div class="topo-mini-node-left"><div class="topo-mini-node-name">${esc(node.name||node.id)}</div><div class="topo-mini-node-role">${esc((node.role||'').slice(0,50))}</div>${metric}</div>${statusLabel}</div>`;
  }).join('');

  const hc=topology.health_counts||{};
  const obsStatus=hc.error>0?`<span style="color:#dc2626;font-size:11px;margin-left:auto">${hc.error} ${t('異常','err')}${hc.warn>0?` · ${hc.warn} ${t('警告','warn')}`:''}</span>`:`<span style="color:#065f46;font-size:11px;margin-left:auto">${t('全正常','All clear')}</span>`;
  const faultPath=topology.root_cause_chain||'';

  return`<div class="topo-mini">
    <div class="topo-mini-header"><span>${t('コンポーネントトポロジー','Component topology')}</span><span>${esc(issueApp(issue))}</span></div>
    <div class="topo-mini-nodes">${nodesHtml}</div>
    ${faultPath?`<div class="topo-mini-fault-path"><strong style="color:#991b1b">${t('障害経路: ','Fault path: ')}</strong>${esc(faultPath.slice(0,120))}</div>`:''}
    <div class="topo-mini-obs-bar">
      <span class="chip prometheus" style="height:20px;font-size:10px">Prometheus</span>
      <span class="chip langfuse" style="height:20px;font-size:10px">Langfuse</span>
      ${obsStatus}
    </div>
  </div>`;
}

/* ── Detail panel ───────────────────────────── */
function renderDetailPanel(issue,topology,analysis){
  const scroll=document.getElementById('detail-scroll');
  const heading=document.getElementById('detail-heading');
  if(!issue){
    scroll.innerHTML=`<div class="empty-msg">${t('左から問題を選ぶか、チャットで問題を指定してください。','Select an issue from the left or mention one in chat.')}</div>`;
    if(heading)heading.textContent=t('問題の詳細','Issue detail');
    return;
  }
  if(heading)heading.textContent=`#${issue.id} ${issueTitle(issue).slice(0,36)}`;
  const topo=topology?.topology||{};
  const topoHtml=renderTopoMini(topo,issue);
  const metrics=topo.metrics||[];
  const cause=analysis?analysisCause(analysis):cleanText(topo.root_cause_chain)||'';
  const action=analysis?analysisAction(analysis):cleanText(topo.recommended_action)||'';

  const metricsSec=metrics.length?`<div class="detail-section">
    <div class="detail-section-head"><span>${t('主要メトリクス','Key metrics')}</span><span class="chip prometheus" style="height:18px;font-size:10px">Prometheus</span></div>
    <div class="detail-section-body">${metrics.map(m=>`<div class="detail-metric-row"><span class="detail-metric-label">${esc(m.label)}</span><span class="detail-metric-value ${m.tone||''}">${esc(m.value)}</span></div>`).join('')}</div>
  </div>`:'';

  const rcaSec=(cause||action)?`<div class="detail-section">
    <div class="detail-section-head"><span>RCA</span><span class="chip langfuse" style="height:18px;font-size:10px">Langfuse</span></div>
    <div class="detail-section-body">
      ${cause?`<div class="detail-metric-row"><span class="detail-metric-label">${t('原因','Cause')}</span><span class="detail-metric-value" style="font-size:12px;font-weight:500;line-height:1.4">${esc(cause.slice(0,160))}</span></div>`:''}
      ${action?`<div class="detail-metric-row"><span class="detail-metric-label">${t('対応','Action')}</span><span class="detail-metric-value" style="font-size:12px;font-weight:500;line-height:1.4">${esc(action.slice(0,160))}</span></div>`:''}
    </div>
  </div>`:'';

  const metaSec=`<div class="detail-section">
    <div class="detail-section-head"><span>${t('問題情報','Issue info')}</span></div>
    <div class="detail-section-body">
      <div class="detail-metric-row"><span class="detail-metric-label">${t('重大度','Severity')}</span><span class="chip ${sevClass(issue.severity)}" style="height:20px">${esc(sevText(issue.severity))}</span></div>
      <div class="detail-metric-row"><span class="detail-metric-label">${t('状態','Status')}</span><span class="detail-metric-value">${esc(statusText(issue.status))}</span></div>
      <div class="detail-metric-row"><span class="detail-metric-label">${t('サービス','Service')}</span><span class="detail-metric-value">${esc(issueApp(issue))}</span></div>
    </div>
  </div>`;

  scroll.innerHTML=`
    ${metaSec}
    ${topoHtml?`<div class="detail-section" style="overflow:hidden">${topoHtml}</div>`:''}
    ${metricsSec}${rcaSec}
    <button class="btn-primary" style="width:100%" onclick="askRCA()">🔍 ${t('原因を確認','Check RCA')}</button>
    <button class="btn-secondary" style="width:100%;margin-top:6px" onclick="askRemediation()">🛠 ${t('対応を進める','Remediate')}</button>
  `;
}

/* ── MCP RCA ────────────────────────────────── */
function mcpCallCardHtml(toolName,params,result,confidence){
  const statusLabel=result?`${esc(confidence||'')} · ${t('完了','Done')}`:`<span class="mcp-spinner"></span>${t('実行中...','Running...')}`;
  const paramsHtml=Object.entries(params||{}).map(([k,v])=>`<div class="mcp-param">${esc(k)}: <strong>${esc(String(v))}</strong></div>`).join('');
  const evidenceHtml=result?(result.evidence||[]).slice(0,5).map(ev=>`
    <div class="evidence-item">
      <div class="evidence-item-head">
        <span class="chip ${ev.source==='prometheus'?'prometheus':ev.source==='langfuse'?'langfuse':''}" style="height:18px;font-size:10px">${esc(ev.source||'source')}</span>
        <span class="chip ${ev.severity==='error'?'critical':ev.severity==='warning'?'high':''}" style="height:18px;font-size:10px">${esc(ev.severity||'info')}</span>
        <span class="evidence-label">${esc(ev.query_name||ev.kind||'signal')}</span>
        ${ev.value!=null?`<code class="evidence-value">${esc(ev.value)}</code>`:''}
      </div>
      <div class="evidence-summary">${esc(ev.summary||'')}</div>
    </div>`).join(''):`<div style="padding:6px 0;color:var(--muted);font-size:12px"><span class="mcp-spinner"></span>${t('証拠を取得中...','Fetching evidence...')}</div>`;

  return`<div class="mcp-call-card">
    <div class="mcp-call-header">
      <span class="mcp-badge-sm">MCP</span>
      <span class="mcp-tool-name">${esc(toolName)}</span>
      <span class="mcp-status-text">${statusLabel}</span>
    </div>
    <div class="mcp-call-body">
      <div class="mcp-params">${paramsHtml}</div>
      ${result?.answer?`<div class="mcp-result-text">${esc(result.answer)}</div>`:''}
      <div class="evidence-grid">${evidenceHtml}</div>
    </div>
  </div>`;
}

function mcpRcaResponseHtml(live,stored){
  const hazardous=(live.evidence||[]).some(e=>['warning','error','critical'].includes(e.severity));
  const kb=(live.knowledge_matches||[]).slice(0,2).map(k=>`
    <div class="evidence-item" style="border-left:2px solid var(--blue)">
      <div class="evidence-item-head">
        <span class="chip" style="height:18px;font-size:10px">${esc(k.source||'KB')}</span>
        <span class="chip" style="height:18px;font-size:10px">${esc(k.remediation_type||'')}</span>
        <span class="evidence-label">${esc(k.title||t('ナレッジ','Knowledge'))}</span>
      </div>
      <div class="evidence-summary">${esc(k.recommended_action||k.reason||'')}</div>
    </div>`).join('');

  const storedHtml=stored?`<div class="chat-card" style="margin-top:2px">
    <div class="chips-row"><span class="chip">${t('保存済み RCA','Stored RCA')}</span><span class="chip langfuse" style="height:20px;font-size:10px">Langfuse</span></div>
    <div class="card-body">${esc(analysisCause(stored)||t('原因不明','Unknown'))}</div>
    ${analysisAction(stored)?`<div class="card-sub" style="margin-top:5px">${esc(analysisAction(stored))}</div>`:''}
  </div>`:'';

  return`
    <div class="card-heading">${t('RCA 結果','RCA result')}</div>
    ${mcpCallCardHtml('correlate_cross_service_incident',{root_candidate_service:currentIssue?.app_name||'service',affected_service:live.affected_service||currentIssue?.app_name||'service',window_minutes:10},live,live.confidence)}
    ${storedHtml}
    ${kb?`<div class="card-heading" style="font-size:13px;margin-top:4px">${t('ナレッジベース','Knowledge base')}</div><div class="evidence-grid">${kb}</div>`:''}
    <div class="card-actions">
      <button class="btn-primary" onclick="askRCA()">${t('MCPで再確認','Re-check via MCP')}</button>
      <button class="btn-secondary" onclick="askRemediation()">${t('対応へ進む','Remediate')}</button>
    </div>`;
}

/* ── RCA ────────────────────────────────────── */
async function getRCA(){
  if(!currentIssue)return null;
  try{currentAnalysis=await api(`/api/analysis/issues/${currentIssue.id}?lang=${lang}&summary=true`)}
  catch{
    try{
      await api(`/api/analysis/issues/${currentIssue.id}`,{method:'POST'});
      currentAnalysis=await pollRCA(currentIssue.id);
    }catch{return null}
  }
  return currentAnalysis;
}

async function pollRCA(id){
  for(let i=0;i<24;i++){
    await new Promise(r=>setTimeout(r,2500));
    try{const a=await api(`/api/analysis/issues/${id}?lang=${lang}&summary=true`);if(!['pending','running'].includes(a.status))return a}catch{}
  }
  throw new Error(t('RCAが時間内に完了しませんでした','RCA timed out'));
}

async function askRCA(userPrompt=''){
  const prompt=userPrompt||t('なぜ起きたの？','Why did this happen?');
  if(!userPrompt)addMsg('user',esc(prompt));
  if(!currentIssue){addMsg('agent',`<div class="chat-card"><div class="card-body">${t('まず問題を選んでください。','Please select an issue first.')}</div></div>`);return}
  setMcp(true);
  const progressEl=addMsg('agent',mcpCallCardHtml('correlate_cross_service_incident',{root_candidate_service:currentIssue.app_name,affected_service:currentIssue.app_name,window_minutes:10},null,null));
  try{
    const [liveRes,storedRes]=await Promise.allSettled([
      api('/api/chat/rca/live',{method:'POST',body:JSON.stringify({issue_id:currentIssue.id,message:prompt,service:currentIssue.app_name,lang,window_minutes:10})}),
      getRCA()
    ]);
    const live=liveRes.status==='fulfilled'?liveRes.value:null;
    const stored=storedRes.status==='fulfilled'?storedRes.value:null;
    if(live){
      progressEl.innerHTML=mcpRcaResponseHtml(live,stored);
      if(currentIssue)renderDetailPanel(currentIssue,currentTopology,stored||currentAnalysis);
    }else if(stored){
      progressEl.innerHTML=storedRcaHtml(stored);
    }else{
      progressEl.innerHTML=`<div class="chat-card"><div class="card-body error-msg">${t('RCAを取得できませんでした','Could not fetch RCA')}</div></div>`;
    }
  }finally{setMcp(false);scrollBottom()}
}

function storedRcaHtml(a){
  const ev=(a.evidence||'').split('\n').map(x=>x.trim().replace(/^[-•*]\s*/,'')).filter(Boolean).slice(0,4);
  return`
    <div class="card-heading">${t('原因分析レポート','RCA Report')}</div>
    <table class="rca-table">
      <tr class="cause-row"><th>${t('推定原因','Likely cause')}</th><td>${esc(analysisCause(a)||t('未取得','Not available'))}</td></tr>
      <tr class="evidence-row"><th>${t('根拠','Evidence')}</th><td>${ev.length?`<ul>${ev.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:t('なし','None')}</td></tr>
      <tr class="action-row"><th>${t('推奨対応','Action')}</th><td>${esc(analysisAction(a)||t('未取得','Not available'))}</td></tr>
    </table>
    <div class="card-actions"><button class="btn-primary" onclick="askRemediation()">${t('対応へ進む','Proceed to remediation')}</button></div>`;
}

/* ── Summary ────────────────────────────────── */
function askSummary(){
  addMsg('user',t('やさしく要約して','Give me a simple summary'));
  if(!currentIssue){addMsg('agent',`<div class="chat-card"><div class="card-body">${t('まず問題を選んでください。','Select an issue first.')}</div></div>`);return}
  const topo=currentTopology?.topology||{};
  const cause=cleanText(topo.root_cause_chain)||issueDesc(currentIssue);
  const action=cleanText(topo.recommended_action)||analysisAction(currentAnalysis)||'';
  addMsg('agent',`
    <div class="card-heading">${t('短い要約','Summary')}</div>
    <div class="chat-card">
      <div class="chips-row">${sevChip(currentIssue)}${statusChip(currentIssue)}</div>
      <div class="card-heading">${esc(issueTitle(currentIssue))}</div>
      <div class="card-body">${esc(cause)}</div>
      ${action?`<div class="card-body" style="margin-top:6px;color:var(--muted)">${esc(action)}</div>`:''}
    </div>
    <div class="card-actions">
      <button class="btn-primary" onclick="askRCA()">${t('原因を確認','Check RCA')}</button>
      <button class="btn-secondary" onclick="askRemediation()">${t('対応を進める','Remediate')}</button>
    </div>`);
}

/* ── Remediation ────────────────────────────── */
async function askRemediation(){
  addMsg('user',t('対応を進めたい','I want to remediate this'));
  if(!currentIssue){addMsg('agent',`<div class="chat-card"><div class="card-body">${t('まず問題を選んでください。','Select an issue first.')}</div></div>`);return}
  if(!currentAnalysis){try{await getRCA()}catch{}}
  addMsg('agent',`
    <div class="card-heading">${t('対応の進め方','Remediation flow')}</div>
    <div class="remed-steps">
      <div class="remed-step"><div class="remed-step-dot active">1</div><div class="remed-step-content"><div class="remed-step-title">${t('対象確認','Confirm target')}</div><div class="remed-step-desc">${t('リポジトリと変更対象を確認します','Confirm the target repository and scope')}</div></div></div>
      <div class="remed-step"><div class="remed-step-dot">2</div><div class="remed-step-content"><div class="remed-step-title">${t('対応案の確認','Review plan')}</div><div class="remed-step-desc">${t('変更内容を確認してから実装へ','Review changes before implementing')}</div></div></div>
      <div class="remed-step"><div class="remed-step-dot">3</div><div class="remed-step-content"><div class="remed-step-title">${t('実装と PR','Implement & PR')}</div><div class="remed-step-desc">${t('実装後 Pull Request を作成','Implement and create a pull request')}</div></div></div>
    </div>
    <div class="card-actions">
      <button class="btn-primary" onclick="startRemediation()">${t('対応を開始','Start remediation')}</button>
      <button class="btn-secondary" onclick="refreshRemediation()">${t('進捗を見る','Check progress')}</button>
    </div>`);
}

async function startRemediation(){
  if(!currentIssue)return;
  setState(t('対応開始','Starting'));
  const prog=addMsg('agent',`<div class="chat-card"><span class="spinner-inline"></span>${t('対応ワークフローを開始しています。','Starting remediation workflow.')}</div>`);
  try{
    const body={requested_by:lang==='ja'?'support-engineer-ja':'support-engineer-en'};
    const data=await api(`/api/remediation/issues/${currentIssue.id}/start`,{method:'POST',body:JSON.stringify(body)});
    remediationStarted=true;rememberProject(data);
    prog.innerHTML=remedStatusHtml(data,t('対応ワークフローを開始しました。','Remediation started.'));
    await showProjectSelect();
    setState(t('対応中','In progress'));
  }catch(e){prog.innerHTML=`<div class="chat-card"><div class="card-body error-msg">${esc(e.message)}</div></div>`;setState(t('失敗','Failed'))}
}

async function refreshRemediation(){
  if(!currentIssue)return;
  try{const data=await api(`/api/remediation/issues/${currentIssue.id}/status`);addMsg('agent',remedStatusHtml(data,t('現在の進捗です。','Current progress.')))}
  catch(e){addMsg('agent',`<div class="chat-card"><div class="card-body error-msg">${esc(e.message)}</div></div>`)}
}

function rememberProject(data){const c=(data?.resolution_candidates||[])[0]||{};const i=data?.issue||data?.selected_project||{};chatProject={...chatProject,...c,...i}}

function remedStatusHtml(data,intro){
  rememberProject(data);
  const raw=String(data?.status||data?.resolution_status||'').toUpperCase();
  const phase=data?.job_phase||'';
  const pr=data?.pr_url?`<p style="margin-top:8px"><a href="${esc(data.pr_url)}" target="_blank" rel="noreferrer">${t('Pull Request を開く','Open PR')}</a></p>`:'';
  return`<div class="card-heading">${esc(intro)}</div><div class="chat-card"><div class="chips-row"><span class="chip">${esc(rStatusText(raw))}</span>${phase?`<span class="chip">${esc(phase)}</span>`:''}</div>${pr}${remedActions(raw)}</div>`;
}

function remedActions(raw){
  if(['PLAN_RUNNING','PLAN_DRAFTING'].includes(raw))return`<div class="card-body"><span class="spinner-inline"></span>${t('対応案を作成中...','Creating plan...')}</div>`;
  if(raw==='PROJECT_REVIEW_PENDING')return`<div class="card-actions"><button class="btn-primary" onclick="showProjectSelect()">${t('対象を確認','Review target')}</button></div>`;
  if(raw==='PROJECT_APPROVED')return`<div class="card-actions"><button class="btn-primary" onclick="startPlan()">${t('対応案を作成','Create plan')}</button></div>`;
  if(['PLAN_DRAFTED','PLAN_REVISED'].includes(raw))return`<div class="card-actions"><button class="btn-primary" onclick="getPlan()">${t('対応案を確認','Review plan')}</button><button class="btn-secondary" onclick="approvePlan()">${t('実装へ進む','Implement')}</button></div>`;
  if(['IMPLEMENTATION_READY','REVIEW_PENDING'].includes(raw))return`<div class="card-actions"><button class="btn-primary" onclick="checkImplResults()">${t('実装結果を確認','Review results')}</button></div>`;
  if(raw==='IMPLEMENTATION_RUNNING'||raw==='PLAN_APPROVED')return`<div class="card-body"><span class="spinner-inline"></span>${t('実装中...','Implementing...')}</div><div class="card-actions"><button class="btn-secondary" onclick="refreshRemediation()">${t('進捗を更新','Refresh')}</button></div>`;
  if(raw==='PR_CREATED')return`<div class="card-body" style="color:var(--green)">${t('PRが作成されました。','PR created successfully.')}</div>`;
  return`<div class="card-actions"><button class="btn-secondary" onclick="showProjectSelect()">${t('対象を確認','Review target')}</button><button class="btn-secondary" onclick="startPlan()">${t('対応案を作成','Create plan')}</button><button class="btn-secondary" onclick="refreshRemediation()">${t('進捗を見る','Progress')}</button></div>`;
}

async function showProjectSelect(){
  if(!currentIssue)return;
  try{const d=await api(`/api/remediation/issues/${currentIssue.id}/resolution`);rememberProject(d)}catch{}
  const p=chatProject;const pv=(k,fb='')=>esc(p[k]||fb);
  addMsg('agent',`<div class="card-heading">${t('対象システムの確認','Review target system')}</div><div class="chat-card">
    <div class="card-body">${t('必要に応じて修正してください。','Update as needed.')}</div>
    <div class="form-grid">
      <label>${t('プロジェクト','Project')}</label><input id="r-proj" value="${pv('project_name',currentIssue?.app_name||'')}">
      <label>Repo root</label><input id="r-repo" value="${pv('repo_root')}">
      <label>Allowed folder</label><input id="r-folder" value="${pv('allowed_folder')}">
      <label>GitHub repo</label><input id="r-github" value="${pv('github_repo')}">
      <label>Base branch</label><input id="r-branch" value="${pv('base_branch','main')}">
    </div>
    <div class="card-actions"><button class="btn-primary" onclick="approveProject()">${t('承認','Approve')}</button></div>
  </div>`);
}

function readProjectForm(){chatProject={...chatProject,project_name:document.getElementById('r-proj')?.value?.trim()||'',repo_root:document.getElementById('r-repo')?.value?.trim()||'',allowed_folder:document.getElementById('r-folder')?.value?.trim()||'',github_repo:document.getElementById('r-github')?.value?.trim()||'',base_branch:document.getElementById('r-branch')?.value?.trim()||'main'};return chatProject}

async function approveProject(){
  const payload=readProjectForm();
  try{const d=await api(`/api/remediation/issues/${currentIssue.id}/project/approve`,{method:'POST',body:JSON.stringify(payload)});rememberProject(d);addMsg('agent',remedStatusHtml(d,t('対象を承認しました。','Target approved.')));pollRemediation('project')}
  catch(e){addMsg('agent',`<div class="chat-card"><div class="card-body error-msg">${esc(e.message)}</div></div>`)}
}

async function startPlan(){
  const prog=addMsg('agent',`<div class="chat-card"><span class="spinner-inline"></span>${t('対応案を作成しています。','Creating plan.')}</div>`);
  try{await api(`/api/remediation/issues/${currentIssue.id}/plan/start`,{method:'POST',body:'{}'});pollPlan(prog)}
  catch(e){prog.innerHTML=`<div class="chat-card"><div class="card-body error-msg">${esc(e.message)}</div></div>`}
}

async function pollPlan(progEl){
  for(let i=0;i<40;i++){
    await new Promise(r=>setTimeout(r,3000));
    try{
      const d=await api(`/api/remediation/issues/${currentIssue.id}/plan`);
      const s=d?.status||'';
      if(!['PLAN_RUNNING','PLAN_DRAFTING','PROJECT_APPROVED'].includes(s)&&d?.active_job!=='plan'){progEl.innerHTML='';showPlan(d);return d}
      progEl.innerHTML=`<div class="chat-card"><span class="spinner-inline"></span>${t('対応案を作成中...','Creating plan...')} (${i+1})</div>`;
    }catch{}
  }
  progEl.innerHTML=`<div class="chat-card"><div class="card-body">${t('まだ処理中です。「対応案を見る」と入力してください。','Still processing. Ask to see the plan when ready.')}</div></div>`;
}

async function getPlan(){
  try{const d=await api(`/api/remediation/issues/${currentIssue.id}/plan`);
    if(['PLAN_RUNNING','PLAN_DRAFTING'].includes(d?.status||'')){const p=addMsg('agent',`<div class="chat-card"><span class="spinner-inline"></span>${t('対応案はまだ作成中です。','Plan still being created.')}</div>`);pollPlan(p);return}
    showPlan(d);
  }catch(e){addMsg('agent',`<div class="chat-card"><div class="card-body error-msg">${esc(e.message)}</div></div>`)}
}

function planText(d){let b=d?.plan_text||d?.plan||d?.content||d?.markdown||d?.summary||'';if(typeof b==='string'&&b.trim().startsWith('{')){try{const p=JSON.parse(b);b=p.plan_text||p.plan||p.content||b}catch{}}return String(b||'')}

function showPlan(d){
  const text=planText(d);
  const lines=text.split('\n').map(l=>l.replace(/^#+\s*/,'').replace(/^[-*]\s*/,'').replace(/`/g,'').trim()).filter(Boolean);
  const summary=lines[0]||t('対応案です。','Response plan.');
  const steps=lines.slice(1).filter(l=>/change|update|restart|confirm|設定|更新|確認|再起動/.test(l)).slice(0,5);
  addMsg('agent',`
    <div class="card-heading">${t('対応案ができました','Plan ready')}</div>
    <div class="plan-block">
      <div class="plan-section"><h4>${t('概要','Summary')}</h4><p>${esc(summary)}</p></div>
      ${steps.length?`<div class="plan-section"><h4>${t('主な手順','Steps')}</h4><ul>${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:''}
    </div>
    <div class="card-actions"><button class="btn-primary" onclick="approvePlan()">${t('この案で実装へ進む','Approve & implement')}</button></div>`);
}

async function approvePlan(){
  const prog=addMsg('agent',`<div class="chat-card"><span class="spinner-inline"></span>${t('実装を開始しています。','Starting implementation.')}</div>`);
  try{const d=await api(`/api/remediation/issues/${currentIssue.id}/plan/approve`,{method:'POST',body:'{}'});prog.innerHTML=remedStatusHtml(d,t('実装を開始しました。','Implementation started.'));pollRemediation('implementation',prog)}
  catch(e){prog.innerHTML=`<div class="chat-card"><div class="card-body error-msg">${esc(e.message)}</div></div>`}
}

async function pollRemediation(kind='status',progEl=null){
  const node=progEl||addMsg('agent',`<div class="chat-card"><span class="spinner-inline"></span>${t('進捗を確認中...','Checking progress...')}</div>`);
  const busy={project:s=>!['PROJECT_APPROVED','PLAN_DRAFTED','PLAN_REVISED','PR_CREATED','FAILED'].includes(s),implementation:s=>['IMPLEMENTATION_RUNNING','PLAN_APPROVED'].includes(s),status:s=>['PLAN_RUNNING','PLAN_DRAFTING','PLAN_REVISION_RUNNING','IMPLEMENTATION_RUNNING','PR_CREATING'].includes(s)};
  const isBusy=busy[kind]||busy.status;
  for(let i=0;i<60;i++){
    await new Promise(r=>setTimeout(r,2500));
    try{const d=await api(`/api/remediation/issues/${currentIssue.id}/status`);const raw=String(d?.status||d?.resolution_status||'').toUpperCase();node.innerHTML=remedStatusHtml(d,t('進捗を更新しました。','Progress updated.'));if(!isBusy(raw))return d}catch{}
  }
}

async function checkImplResults(){
  const prog=addMsg('agent',`<div class="chat-card"><span class="spinner-inline"></span>${t('実装結果を確認しています。','Checking results.')}</div>`);
  try{
    const summary=await api(`/api/remediation/issues/${currentIssue.id}/implementation/summary`);
    let artifacts={artifacts:[]};try{artifacts=await api(`/api/remediation/issues/${currentIssue.id}/artifacts`)}catch{}
    const raw=String(summary?.status||'').toUpperCase();
    const pr=summary?.pr_url?`<p style="margin-top:8px"><a href="${esc(summary.pr_url)}" target="_blank" rel="noreferrer">${t('Pull Request を開く','Open PR')}</a></p>`:'';
    const artList=(artifacts.artifacts||[]).map(a=>`<li><a href="${esc(a.view_url||a.download_url||'#')}" target="_blank" rel="noreferrer">${esc(a.name||a.path||'artifact')}</a></li>`).join('');
    prog.innerHTML=`
      <div class="card-heading">${t('実装結果','Implementation results')}</div>
      <div class="chat-card"><div class="chips-row"><span class="chip">${esc(rStatusText(raw))}</span></div>
      ${pr}${summary?.change_summary?.human_summary?`<div class="card-body">${esc(summary.change_summary.human_summary)}</div>`:''}
      ${artList?`<ul style="margin:8px 0 0 16px;font-size:13px">${artList}</ul>`:''}
      <div class="card-actions"><button class="btn-primary" onclick="createPR()">${t('PR を作成','Create PR')}</button></div></div>`;
  }catch(e){prog.innerHTML=`<div class="chat-card"><div class="card-body error-msg">${esc(e.message)}</div></div>`}
}

async function createPR(){
  try{const d=await api(`/api/remediation/issues/${currentIssue.id}/pr`,{method:'POST',body:'{}'});addMsg('agent',remedStatusHtml(d,t('PR作成を開始しました。','PR creation started.')));pollRemediation('pr')}
  catch(e){addMsg('agent',`<div class="chat-card"><div class="card-body error-msg">${esc(e.message)}</div></div>`)}
}

/* ── Intent handling ────────────────────────── */
async function handleIntent(text){
  const low=text.toLowerCase();
  if(/open|ticket|issue|未対応|一覧|問題|tickets?/.test(low)&&!/why|cause|原因/.test(low)){
    if(/重大|critical|most critical|highest/.test(low)){const f=ticketsCache.find(t=>t.severity==='critical')||ticketsCache[0];if(f){await selectIssue(f.id);return}}
    ticketsCache.length?showOpenTickets():await loadTickets(false);return;
  }
  if(/why|cause|rca|原因|なぜ|どうして|理由/.test(low)){await askRCA(text);return}
  if(/summary|summarize|要約|簡単|やさしく/.test(low)){askSummary();return}
  if(/remediat|fix|対応|修復|進め/.test(low)){await askRemediation();return}
  if(/impl.*result|実装結果/.test(low)){await checkImplResults();return}
  if(/plan|proposal|案/.test(low)){await getPlan();return}
  if(/status|progress|進捗|状態/.test(low)){await refreshRemediation();return}
  if(currentIssue){await askRCA(text);return}
  addMsg('agent',`<div class="chat-card"><div class="card-body">${t('未対応の確認、原因分析、対応開始、進捗確認ができます。まずは「未対応を見る」と入力するか、左から問題を選んでください。','I can help with open issues, RCA, remediation, and progress. Type "open issues" or select one from the left.')}</div></div>`);
}

function handleKey(e){if(e.key==='Enter'){e.preventDefault();send()}}

async function send(){
  const input=document.getElementById('chat-input');
  const text=(input.value||'').trim();
  if(!text)return;
  input.value='';
  const detected=detectLang(text);
  if(detected!==lang){lang=detected;updateUiLang();await loadTickets(true)}
  addMsg('user',esc(text));
  await handleIntent(text);
}

/* ── Language ────────────────────────────────── */
function updateUiLang(){
  document.documentElement.lang=lang;
  document.getElementById('lang-btn').textContent=lang==='ja'?'English':'日本語';
  document.getElementById('rail-mark').textContent=lang==='ja'?'助':'A';
  document.getElementById('brand-mark').textContent=lang==='ja'?'助':'A';
  document.getElementById('brand-name').textContent=lang==='ja'?'助手':'AIOPS';
  document.getElementById('w-heading').textContent=lang==='ja'?'こんにちは。助手です。':"Hello. I'm your AIOps assistant.";
  document.getElementById('w-sub').textContent=lang==='ja'?'未対応の確認、MCPライブ証拠、原因分析、対応案まで一緒に進めます。':'Open issues, MCP live evidence, RCA, and remediation — all in one conversation.';
  document.getElementById('rb-tickets').textContent=lang==='ja'?'未対応を見る':'Open issues';
  document.getElementById('rb-rca').textContent=lang==='ja'?'原因を確認':'Check RCA';
  document.getElementById('rb-remed').textContent=lang==='ja'?'対応を進める':'Remediate';
  document.getElementById('rail-section').textContent=lang==='ja'?'最近の問題':'Recent issues';
  document.getElementById('detail-heading').textContent=lang==='ja'?'問題の詳細':'Issue detail';
  document.getElementById('chat-input').placeholder=lang==='ja'?'例: なぜ起きたの？ / 対応を進めたい / show open issues':'e.g. why did this happen? / remediate / 未対応を見る';
}

async function toggleLanguage(){
  lang=lang==='ja'?'en':'ja';
  updateUiLang();
  await loadTickets(true);
  if(currentIssue){await loadTopology(currentIssue.id);renderDetailPanel(currentIssue,currentTopology,currentAnalysis)}
  addMsg('agent',lang==='ja'?'日本語で続けます。':'Continuing in English.');
}

function askOpenTickets(){addMsg('user',t('未対応の問題を見せて','Show me open issues'));ticketsCache.length?showOpenTickets():loadTickets(false)}

/* ── Boot ───────────────────────────────────── */
async function boot(){
  updateUiLang();
  await loadTickets(true);
  const issueId=Number(P.get('issue_id')||0);
  if(issueId){await selectIssue(issueId);if(P.get('mode')==='remediation')askRemediation()}
}
boot();
</script>
